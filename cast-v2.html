<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>STACKUP CAST</title>
<link href="https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap" rel="stylesheet">
<style>
:root{--g:#8dfc3b;--bg:#020402;--panel:#061007;--line:rgba(141,252,59,.84);--u:min(1vw,1.7777778vh)}
*{box-sizing:border-box;font-family:'Caacupe One'!important;font-weight:400;letter-spacing:.02em}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff}
body{background:radial-gradient(ellipse at 50% 42%,#0b1c0b 0,#061006 34%,#020402 76%)}
.cast{position:fixed;inset:0;width:100%;height:100%;padding:calc(var(--u)*.65) calc(var(--u)*.95) 0;display:grid;grid-template-rows:calc(var(--u)*8.5) 1fr calc(var(--u)*4.5);gap:10px;background:linear-gradient(120deg,rgba(0,0,0,.1),rgba(10,35,12,.08),rgba(0,0,0,.1))}
.head{display:grid;grid-template-columns:minmax(0,1fr);align-items:center;min-height:0;text-align:center}.event{font-size:calc(var(--u)*5.2083333333);line-height:1;color:var(--g);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand{text-align:center;line-height:.9}.brandMain{font-size:calc(var(--u)*3.45);color:#fff}.brandMain em{font-style:normal;color:var(--g)}.brandSub{font-size:calc(var(--u)*0.95);letter-spacing:.35em;margin-top:calc(var(--u)*.28)}.mode{text-align:right;color:var(--g);font-size:calc(var(--u)*1.55);white-space:nowrap}
.main{min-height:0;display:grid;grid-template-columns:18% minmax(0,1fr) 18%;gap:10px;align-items:stretch}.sideColumn{height:100%;min-height:0;display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:10px}.stat{position:relative;overflow:hidden;min-height:0;border:2px solid var(--line);border-radius:calc(var(--u)*.55);background:linear-gradient(135deg,rgba(8,27,10,.96),rgba(2,8,3,.88));padding:calc(var(--u)*.55) calc(var(--u)*1.05);display:flex;flex-direction:column;justify-content:center}.stat::before,.stat::after{content:none!important;display:none!important}.leftSide .stat{text-align:left}.rightSide .stat{text-align:right}.stat span{display:block;color:var(--g);font-size:calc(var(--u)*2.0833);line-height:1}.stat b{display:block;color:#fff;font-size:calc(var(--u)*2.8646);line-height:1;margin-top:calc(var(--u)*.24);white-space:nowrap}
.center{min-height:0;display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:10px}.hero,.nextBox{min-height:0;border:2px solid var(--line);border-radius:calc(var(--u)*.65);background:linear-gradient(145deg,rgba(6,22,8,.96),rgba(1,7,2,.9));overflow:hidden}.hero{grid-row:1 / 5;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:calc(var(--u)*.8) calc(var(--u)*1.2) calc(var(--u)*.7);align-items:center}.levelTop{text-align:center;color:var(--g);font-size:calc(var(--u)*6.25);line-height:.9}.levelTop b{color:#fff}.timerArea{min-height:0;align-self:stretch;display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,2fr)}.clock{grid-row:2;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--g);font-size:calc(var(--u)*20.8333333333);line-height:.72;white-space:nowrap;min-height:0}.track{grid-row:3;align-self:center;width:92%;height:max(4px,calc(var(--u)*.28));margin:0 auto;background:#1c2c18;border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--g);border-radius:999px}.currentGrid{min-width:0;text-align:center}.blindGroup,.anteGroup{text-align:center;min-width:0}.currentLabel{display:block;color:var(--g);font-size:calc(var(--u)*2.0833);line-height:1;margin-bottom:calc(var(--u)*.28)}.blindLine{display:block;white-space:pre;text-align:center}.currentInline{font-size:calc(var(--u)*6.7708333333);line-height:1}.currentInline .anteValue{font-size:calc(var(--u)*5.2083333333)}
.nextBox{grid-row:5;display:grid;grid-template-columns:1fr 2fr;grid-template-rows:minmax(0,1fr);gap:10px;align-items:center;padding:calc(var(--u)*.6) calc(var(--u)*1.1)}.nextLevelTitle{text-align:center;color:var(--g);font-size:calc(var(--u)*2.8646);line-height:1}.nextGrid{min-width:0;text-align:center}.nextLabel{display:block;text-align:center;color:var(--g);font-size:calc(var(--u)*2.0833);line-height:1}.nextGrid{font-size:calc(var(--u)*4.1666666667);line-height:1}.nextGrid .anteValue{font-size:calc(var(--u)*3.3854166667)}
.ticker{margin:0 calc(var(--u)*-.95);border-top:1px solid var(--line);background:#030703;display:grid;grid-template-columns:18% 64% 18%;align-items:center;padding:0 calc(var(--u)*1.25);min-height:0}.tickerBrand{font-size:calc(var(--u)*1.8)}.tickerBrand em{font-style:normal;color:var(--g)}.tickerLogo{text-align:center;font-size:calc(var(--u)*2.0833);white-space:nowrap}.tickerClock{text-align:right;font-size:calc(var(--u)*1.8)}
.enter{position:fixed;inset:0;z-index:100;background:#020302;display:flex;align-items:center;justify-content:center}.enter button{border:2px solid var(--g);background:#071008;color:var(--g);padding:calc(var(--u)*1.7) calc(var(--u)*2.7);font-size:calc(var(--u)*2.2)}.rotate{display:none;position:fixed;inset:0;z-index:120;background:#020302;align-items:center;justify-content:center;text-align:center}.rotate b{display:block;color:var(--g);font-size:8vw}
html.cardsNoBorders .stat,html.cardsNoBorders .nextBox{border:0!important;outline:0!important;box-shadow:none!important}
html.centralCardNoBorder .hero{border:0!important;outline:0!important;box-shadow:none!important}
@media(orientation:portrait){.cast,.enter{display:none!important}.rotate{display:flex}}
</style>
</head>
<body>
<main class="cast">
<header class="head"><div class="event" id="eventName">EVENTO</div></header>
<section class="main">
<aside class="leftSide"><div class="sideColumn"><div class="stat"><span id="leftFieldLabel">ATIVOS / TOTAL</span><b id="leftField">0 / 0</b></div><div class="stat"><span id="totalChipsLabel">TOTAL CHIPS</span><b id="totalChips">0</b></div><div class="stat"><span id="avgStackLabel">AVG STACK</span><b id="avgStack">0</b></div><div class="stat"><span id="elapsedLabel">DECORRIDO</span><b id="elapsed">00:00:00</b></div><div class="stat"><span id="breakLabel">INTERVALO</span><b id="breakTime">—</b></div></div></aside>
<section class="center"><div class="hero"><div class="levelTop"><span id="levelLabel">NÍVEL</span> <b id="currentLevelNo">00</b></div><div class="timerArea"><div class="clock" id="time">00:00</div><div class="track"><div class="fill" id="fill"></div></div></div><div class="currentGrid currentInline blindLine"><b class="sbValue" id="currentSb">0</b><span class="sep"> / </span><b class="bbValue" id="currentBb">0</b><span class="anteValue"> (<b id="currentAnte">0</b>)</span></div></div><div class="nextBox nextInline"><div class="nextLevelTitle" id="nextLevelLabel">PRÓXIMO NÍVEL</div><div class="nextGrid blindLine"><b class="sbValue" id="nextSb">0</b><span class="sep"> / </span><b class="bbValue" id="nextBb">0</b><span class="anteValue"> (<b id="nextAnte">0</b>)</span></div></div></section>
<aside class="rightSide"><div class="sideColumn"><div class="stat"><span id="buyInLabel">ENTRADAS</span><b id="buyIn">0</b></div><div class="stat"><span id="reentryLabel">RE-ENTRADAS</span><b id="reentry">0</b></div><div class="stat"><span id="rebuyLabel">REBUYS I / II</span><b id="rebuy">0 / 0</b></div><div class="stat"><span id="addonLabel">ADD ONS I / II</span><b id="addon">0 / 0</b></div><div class="stat"><span id="bonusLabel">BONUS I / II</span><b id="bonus">0 / 0</b></div></div></aside>
</section>
<footer class="ticker"><div class="tickerBrand">STACK<em>UP</em></div><div class="tickerLogo">♠ STACKUP HOLD'EM ENTERPRISE</div><div class="tickerClock" id="wallClock">--:--</div></footer>
</main>
<div class="enter" id="enter"><button id="fullscreenBtn">ABRIR CAST EM TELA CHEIA</button></div><div class="rotate"><div><b>CAST 16:9</b>GIRE O DISPOSITIVO PARA PAISAGEM.</div></div>
<script data-stackup-theme-loader></script><script data-stackup-data-entry></script><script data-stackup-input-masks></script>
<script src="shared.js?v=db3b90d8"></script><script src="timer-engine.js"></script><script src="cast-live-engine.js?v=8db7fa9"></script>
<script>
const $=id=>document.getElementById(id);const LABELS={pt:{level:'NÍVEL',left:'ATIVOS / TOTAL',chips:'TOTAL CHIPS',avg:'AVG STACK',elapsed:'DECORRIDO',br:'INTERVALO',buy:'ENTRADAS',re:'RE-ENTRADAS',rb:'REBUYS I / II',ad:'ADD ONS I / II',bo:'BONUS I / II',next:'PRÓXIMO NÍVEL'},en:{level:'LEVEL',left:'LEFT / FIELD',chips:'TOTAL CHIPS',avg:'AVG STACK',elapsed:'ELAPSED',br:'BREAK',buy:'BUY INS',re:'RE-ENTRIES',rb:'REBUYS I / II',ad:'ADD ONS I / II',bo:'BONUS I / II',next:'NEXT LEVEL'},es:{level:'NIVEL',left:'ACTIVOS / TOTAL',chips:'FICHAS TOTALES',avg:'STACK PROMEDIO',elapsed:'TRANSCURRIDO',br:'INTERVALO',buy:'ENTRADAS',re:'REENTRADAS',rb:'RECOMPRAS I / II',ad:'ADICIONALES I / II',bo:'BONOS I / II',next:'PRÓXIMO NIVEL'}};
function language(s){const x=String(s?.language||'pt').slice(0,2).toLowerCase();return LABELS[x]?x:'pt'}function applyLabels(s){const t=LABELS[language(s)];$('levelLabel').textContent=t.level;$('leftFieldLabel').textContent=t.left;$('totalChipsLabel').textContent=t.chips;$('avgStackLabel').textContent=t.avg;$('elapsedLabel').textContent=t.elapsed;$('breakLabel').textContent=t.br;$('buyInLabel').textContent=t.buy;$('reentryLabel').textContent=t.re;$('rebuyLabel').textContent=t.rb;$('addonLabel').textContent=t.ad;$('bonusLabel').textContent=t.bo;$('nextLevelLabel').textContent=t.next}
function blindValue(v){const n=Number(v)||0;if(Math.abs(n)>=100000){const k=n/1000;return `${Number.isInteger(k)?k:k.toFixed(1).replace(/\.0$/,'')}K`}return String(Math.trunc(n))}
function render(s){applyLabels(s);const live=StackupCastLive.snapshot(s),snap=live.snap,cur=currentItem?.(),nxt=nextLevelItem?.(),q=StackupCastLive.qty,br=typeof calcNextBreak==='function'?calcNextBreak():null,no=typeof currentLevelNumber==='function'?currentLevelNumber():null;$('eventName').textContent=s.tournamentName||'EVENTO';$('currentLevelNo').textContent=String(no||0).padStart(2,'0');$('leftField').textContent=`${q(live.left)} / ${q(live.field)}`;$('totalChips').textContent=q(live.chips);$('avgStack').textContent=q(live.avg);$('elapsed').textContent=fmtTime?.(live.elapsed,true)||'00:00:00';$('breakTime').textContent=br?fmtTime?.(br.secs,true)||'00:00:00':'—';$('time').textContent=fmtTime?.(snap.remaining)||'00:00';if(cur?.type==='level'){$('currentSb').textContent=blindValue(cur.sb);$('currentBb').textContent=blindValue(cur.bb);$('currentAnte').textContent=blindValue(cur.ante)}else{$('currentSb').textContent=$('currentBb').textContent=$('currentAnte').textContent='0'}if(nxt?.type==='level'){$('nextSb').textContent=blindValue(nxt.sb);$('nextBb').textContent=blindValue(nxt.bb);$('nextAnte').textContent=blindValue(nxt.ante)}else{$('nextSb').textContent=$('nextBb').textContent=$('nextAnte').textContent='0'}$('fill').style.width=Math.max(0,Math.min(100,(+snap.remaining||0)/(+cur?.duration||1)*100))+'%';$('buyIn').textContent=q(live.m.buy);$('reentry').textContent=q(live.m.re);$('rebuy').textContent=`${q(live.m.r1)} / ${q(live.m.r2)}`;$('addon').textContent=`${q(live.m.a1)} / ${q(live.m.a2)}`;$('bonus').textContent=`${q(live.m.early)} / ${q(live.m.addonBonus)}`}
function tick(){render(state);$('wallClock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});setTimeout(tick,250)}window.onPokerStateChange=render;render(state);tick();$('fullscreenBtn').onclick=async()=>{try{await document.documentElement.requestFullscreen?.()}catch(_){}$('enter').style.display='none'};window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='STACKUP_TV_STATE'||!e.data.state)return;try{localStorage.setItem('poker-club-state-v4',JSON.stringify(e.data.state));state=e.data.state;render(state)}catch(_){}});
</script>
<script>
(()=>{const defaults={event:'#8DFC3B',levelLabel:'#8DFC3B',levelNumber:'#FFFFFF',clock:'#8DFC3B',currentBlinds:'#FFFFFF',nextLevel:'#8DFC3B',nextBlinds:'#FFFFFF',cardBorder:'#8DFC3B',cardBordersEnabled:true,centralCardBorderEnabled:true,cardTitle:'#8DFC3B',cardContent:'#FFFFFF',bar:'#8DFC3B',barStyle:'rounded',sideCardBackground:'#061007',centralCardBackground:'#061007',sideCardGlassEnabled:false,centralCardGlassEnabled:false,screenBackground:'#020402',tickerText:'#FFFFFF',tickerLine:'#8DFC3B'};function theme(){try{const saved=JSON.parse(localStorage.getItem('stackupScreenTheme')||'{}'),t=Object.assign({},defaults,saved,{barStyle:'rounded'});if(!saved.levelLabel)t.levelLabel=saved.currentLevel||defaults.levelLabel;if(!saved.levelNumber)t.levelNumber=saved.currentLevel||defaults.levelNumber;if(!saved.currentBlinds)t.currentBlinds=saved.currentLevel||defaults.currentBlinds;if(!saved.nextLevel)t.nextLevel=saved.sideTitle||defaults.nextLevel;if(!saved.nextBlinds)t.nextBlinds=saved.sideContent||defaults.nextBlinds;if(!saved.cardBorder)t.cardBorder=saved.secondary||defaults.cardBorder;if(!saved.cardTitle)t.cardTitle=saved.sideTitle||defaults.cardTitle;if(!saved.cardContent)t.cardContent=saved.sideContent||defaults.cardContent;if(!saved.sideCardBackground)t.sideCardBackground=saved.cardBackground||defaults.sideCardBackground;if(!saved.centralCardBackground)t.centralCardBackground=saved.cardBackground||defaults.centralCardBackground;if(typeof saved.cardBordersEnabled!=='boolean')t.cardBordersEnabled=true;if(typeof saved.centralCardBorderEnabled!=='boolean')t.centralCardBorderEnabled=true;if(typeof saved.sideCardGlassEnabled!=='boolean')t.sideCardGlassEnabled=false;if(typeof saved.centralCardGlassEnabled!=='boolean')t.centralCardGlassEnabled=false;return t}catch(_){return {...defaults,barStyle:'rounded'}}}function set(sel,prop,value){document.querySelectorAll(sel).forEach(el=>el.style.setProperty(prop,value,'important'))}function rgba(hex,a){const h=String(hex||'').replace('#','');if(!/^[0-9a-fA-F]{6}$/.test(h))return `rgba(0,0,0,${a})`;const n=parseInt(h,16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`}function applyCardBackground(sel,color,glass){if(glass){set(sel,'background',`linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.025)),${rgba(color,.58)}`);set(sel,'backdrop-filter','blur(12px) saturate(135%)');set(sel,'-webkit-backdrop-filter','blur(12px) saturate(135%)')}else{set(sel,'background',color);set(sel,'backdrop-filter','none');set(sel,'-webkit-backdrop-filter','none')}}function applyBarStyle(t){const fill=document.getElementById('fill'),track=document.querySelector('.track');if(!fill||!track)return;fill.textContent='';fill.style.setProperty('background-image','none','important');fill.style.setProperty('background-color',t.bar,'important');fill.style.setProperty('border-radius','999px','important');fill.style.setProperty('height','100%','important');fill.style.setProperty('font-size','0','important');fill.style.setProperty('transform','none','important');track.style.setProperty('height','max(4px,calc(var(--u)*.28))','important');track.style.setProperty('border-radius','999px','important');track.style.setProperty('overflow','hidden','important')}function applyTheme(){const t=theme();set('html,body,.cast','background',t.screenBackground);applyCardBackground('.stat,.nextBox',t.sideCardBackground,t.sideCardGlassEnabled);applyCardBackground('.hero',t.centralCardBackground,t.centralCardGlassEnabled);set('.event','color',t.event);set('#levelLabel','color',t.levelLabel);set('#currentLevelNo','color',t.levelNumber);set('.clock','color',t.clock);set('.currentInline .sbValue,.currentInline .bbValue,.currentInline .sep,.currentInline .anteValue,.currentInline .anteValue b','color',t.currentBlinds);set('.nextLevelTitle','color',t.nextLevel);set('.nextGrid .sbValue,.nextGrid .bbValue,.nextGrid .sep,.nextGrid .anteValue,.nextGrid .anteValue b','color',t.nextBlinds);set('.stat,.hero,.nextBox','border-color',t.cardBorder);set('.stat,.nextBox','border-width',t.cardBordersEnabled?'2px':'0');set('.stat,.nextBox','border-style',t.cardBordersEnabled?'solid':'none');set('.hero','border-width',t.centralCardBorderEnabled?'2px':'0');set('.hero','border-style',t.centralCardBorderEnabled?'solid':'none');set('.stat,.hero,.nextBox','outline','none');set('.stat,.hero,.nextBox','box-shadow','none');document.documentElement.classList.toggle('cardsNoBorders',!t.cardBordersEnabled);document.documentElement.classList.toggle('centralCardNoBorder',!t.centralCardBorderEnabled);set('.stat span','color',t.cardTitle);set('.stat b','color',t.cardContent);set('.ticker,.tickerBrand,.tickerBrand em,.tickerLogo,.tickerClock','color',t.tickerText);set('.ticker','border-top-color',t.tickerLine);applyBarStyle(t)}applyTheme();window.addEventListener('storage',e=>{if(e.key==='stackupScreenTheme')applyTheme()});window.addEventListener('focus',applyTheme);window.addEventListener('pageshow',applyTheme);document.addEventListener('visibilitychange',()=>{if(!document.hidden)applyTheme()});window.StackupCastV2Theme={apply:applyTheme,read:theme}})();
</script>
</body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CENTRAL DE TORNEIOS</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.ey,.section{color:#8DFC3B;letter-spacing:.12em}.title{margin:5px 0 24px}.section{font-size:12px;margin:20px 2px 8px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.stat,.row{border:1px solid #27342D;border-radius:10px;background:linear-gradient(#0B100D,#060907);padding:13px}.stat span{display:block;color:#AEB8B1;font-size:11px}.stat b{display:block;color:#8DFC3B;font-size:22px;margin-top:7px}.list{display:grid;gap:8px}.row b{color:#fff}.meta{color:#AEB8B1;font-size:12px;margin-top:6px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">CENTRAL DE TORNEIOS</h1><div class="section">VISÃO GERAL</div><div class="stats"><div class="stat"><span>TORNEIOS</span><b id="total">0</b></div><div class="stat"><span>ATIVOS</span><b id="active">0</b></div><div class="stat"><span>FINALIZADOS</span><b id="finished">0</b></div><div class="stat"><span>JOGADORES / ENTRADAS</span><b id="entries">0</b></div></div><div class="section">HISTÓRICO E DADOS</div><div id="list" class="list"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script>const READY_KEY='stackup-ready-tournaments-v1';const safe=v=>String(v??'').replace(/[<>]/g,'');function ready(){try{const x=JSON.parse(localStorage.getItem(READY_KEY)||'[]');return Array.isArray(x)?x:[]}catch(_){return[]}}function currentPlayers(){return currentTournamentPlayers()}function all(){const map=new Map(),put=(id,patch)=>{id=String(id||'');if(!id)return;map.set(id,{...(map.get(id)||{id}),...patch})};(state.savedTournaments||[]).forEach(t=>put(t.id,{name:t.name||t.data?.tournamentName||'TORNEIO',status:t.status||'DRAFT',environment:t.data?.clubName||t.data?.activeEnvironmentName||'',updatedAt:t.updatedAt||0}));ready().forEach(t=>put(t.id,{name:t.name||'TORNEIO',status:'VALIDATED',environment:t.data?.clubName||t.clubName||'',validatedAt:t.validatedAt||0}));(state.eventClosures||[]).forEach(c=>put(c.eventId,{name:c.tournamentName||'TORNEIO',status:'CLOSED',environment:c.environmentName||'',closedAt:c.closedAt||0,entries:Array.isArray(c.rankingRows)?c.rankingRows.length:(+c.playerCount||0)}));if(state.eventId)put(state.eventId,{name:state.tournamentName||'TORNEIO',status:state.tournamentStatus==='CLOSED'?'CLOSED':state.prepared?'ACTIVE':state.tournamentStatus||'DRAFT',environment:state.activeEnvironmentName||state.clubName||'',entries:currentPlayers().length,active:!!state.prepared});return[...map.values()].sort((a,b)=>(+b.closedAt||+b.validatedAt||+b.updatedAt||0)-(+a.closedAt||+a.validatedAt||+a.updatedAt||0))}function render(){const a=all(),closed=a.filter(t=>t.status==='CLOSED'),activeRows=a.filter(t=>t.status==='ACTIVE'||t.active);total.textContent=a.length;active.textContent=activeRows.length;finished.textContent=closed.length;entries.textContent=a.reduce((n,t)=>n+(+t.entries||0),0);list.innerHTML=a.length?a.map(t=>`<div class="row"><b>${safe(t.name||'TORNEIO')}</b><div class="meta">${safe(t.status||'CADASTRADO')} • ${safe(t.environment||'AMBIENTE NÃO INFORMADO')} • ID ${safe(t.id)}</div></div>`).join(''):'<div class="row"><div class="meta">AINDA NÃO HÁ TORNEIOS REGISTRADOS PARA EXIBIR.</div></div>'}render();window.onPokerStateChange=render;window.addEventListener('storage',render);</script><script src="app-theme.js"></script></body></html>

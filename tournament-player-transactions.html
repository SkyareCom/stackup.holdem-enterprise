<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>TRANSAÇÕES POR JOGADOR • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.ey{color:#8DFC3B;letter-spacing:.14em}.title{margin:4px 0 6px}.sub{color:#AEB8B1;margin-bottom:18px}.topActions{margin-bottom:18px}.topActions button{width:100%}.list{display:grid;gap:8px}.row{padding:12px;border:1px solid #27342D;border-radius:9px;background:linear-gradient(#0B100D,#060907)}.name{color:#fff}.meta{color:#AEB8B1;margin-top:4px}.purchases{color:#fff;margin-top:6px}.total{color:#8DFC3B;margin-top:6px}.empty{padding:18px;color:#AEB8B1;text-align:center}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">TRANSAÇÕES POR JOGADOR</h1><div id="eventName" class="sub"></div><div class="topActions"><button id="backBtn" type="button">VOLTAR À GESTÃO DE TORNEIOS</button></div><div id="root" class="list"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard('control.html')</script><script>(()=>{const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),item=t=>String(t?.itemCode||t?.payment?.reference||'').toUpperCase(),qty=t=>Math.max(1,+t.quantity||1),amount=t=>Math.max(0,+((t.payment||{}).totalAmount??(t.payment||{}).paidAmount??t.totalValue??t.total??t.value??0)||0),money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(+v||0),cpf=p=>String(p?.cpf||p?.document||p?.identity?.cpf||'');function player(id){return currentTournamentPlayers().find(p=>String(p.id)===String(id))}function rows(){const tx=(state.transactions||[]).filter(t=>String(t.eventId||'')===String(state.eventId||'')&&t.status!=='cancelled'&&t.status!=='void'),g=new Map();for(const t of tx){const k=String(t.playerId||t.directoryId||t.cpf||t.playerName||'SEM_ID');let r=g.get(k);if(!r){r={player:player(t.playerId),name:t.playerName||'',cpf:t.playerCpf||t.cpf||'',total:0,items:{}};g.set(k,r)}r.total+=amount(t);for(const d of kinds)if(d.f(t)){r.items[d.c]=(r.items[d.c]||0)+qty(t);break}}return[...g.values()].sort((a,b)=>String(a.player?.name||a.name).localeCompare(String(b.player?.name||b.name),'pt-BR'))}function render(){const list=rows();$('eventName').textContent=(state.tournamentName||'TORNEIO')+' • '+list.length+' JOGADORES';$('root').innerHTML=list.length?list.map(r=>{const p=r.player||{name:r.name,cpf:r.cpf};const compras=kinds.map(d=>r.items[d.c]?`${String(r.items[d.c]).padStart(2,'0')} ${d.c}`:'').filter(Boolean).join(' • ');return `<div class="row"><div class="name">${esc(p.name||'JOGADOR')}</div><div class="meta">CPF ${esc(cpf(p)||r.cpf||'—')}</div><div class="purchases">COMPRAS: ${esc(compras||'—')}</div><div class="total">VALOR GASTO: ${money(r.total)}</div></div>`}).join(''):'<div class="empty">NENHUMA TRANSAÇÃO REGISTRADA NESTE TORNEIO.</div>'}$('backBtn').onclick=()=>location.href='control.html';window.addEventListener('storage',render);render()})();</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STAFF • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.ey{color:#8DFC3B;letter-spacing:.14em}.card{background:transparent!important;border:0!important;border-radius:0!important;padding:0!important;margin:10px 0!important;box-shadow:none!important}.section{color:#8DFC3B;letter-spacing:.14em;margin:16px 2px 7px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}input,select,button{width:100%;min-height:44px;padding:10px;border-radius:9px;box-sizing:border-box}input,select{background:#060907;color:#fff;border:1px solid #27342D!important}input:focus,select:focus{border-color:#8DFC3B!important}.primary{background:#8DFC3B;color:#020302}.access-note{color:#9CA69F;margin:8px 2px 0;line-height:1.45}.history{margin-top:8px}.historyRow{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid #27342D}.historyRow:last-child{border-bottom:0}.historyRow>.pick{width:18px!important;height:18px!important;min-height:18px!important;margin-top:4px;padding:0!important}.historyInfo{min-width:0}.meta{color:#AEB8B1;line-height:1.5}.badge{display:inline-block;padding:3px 7px;border:1px solid #27342D!important;border-radius:999px;color:#8DFC3B;margin-right:4px}.historyActions,.inlineActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.inlineGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.inlineGrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}.inlineEditor{grid-column:1/-1}.danger{color:#ff858d!important}.hidden{display:none!important}@media(max-width:700px){.grid,.grid3,.inlineGrid,.inlineGrid3{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="top"><div><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 id="pageTitle">STAFF</h1></div></div><div id="staffFormSection"><div class="section">CADASTRO DE STAFF</div><div class="card" id="staffFormCard"><div class="grid"><input id="staffNameInput" placeholder="NOME COMPLETO"><input id="cpf" placeholder="CPF"></div><div class="grid3" style="margin-top:8px"><input id="birth" type="text" inputmode="numeric" maxlength="14" placeholder="DD / MM / AAAA" aria-label="DATA DE NASCIMENTO"><input id="phone" placeholder="TELEFONE"><input id="whatsapp" placeholder="WHATSAPP"></div><div class="grid" style="margin-top:8px"><input id="email" type="email" placeholder="E-MAIL"><input id="instagram" placeholder="INSTAGRAM"></div><div class="grid3" style="margin-top:8px"><select id="club" aria-label="AMBIENTE"></select><select id="role" aria-label="FUNÇÃO"></select><input id="pin" type="password" inputmode="numeric" autocomplete="new-password" placeholder="PIN DE ACESSO" aria-label="PIN DE ACESSO"></div><div class="access-note" id="accessNote"></div><button class="primary" id="save" type="button" style="margin-top:10px">CONFIRMAR</button><div id="staffNotice" class="meta" role="status" style="margin-top:8px"></div></div></div><div id="staffHistory" class="history hidden"><div id="list"></div><div class="historyActions"><button id="editSelected" type="button">EDITAR</button><button id="deleteSelected" class="danger" type="button">APAGAR</button></div></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script src="app-theme.js"></script><script>ensureOperationalState();StackupAuth.ensure();const $=id=>document.getElementById(id),VIEW=new URLSearchParams(location.search).get('view')||'',BASE_ROLES=['DEALER','FLOOR','TD','CASHIER','VIEWER','GESTOR'];let inlineEditingId='';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const permissionsFor=r=>[...(StackupAuth.ROLE_ACCESS?.[r]||[])];function formatBirth(v){const d=String(v||'').replace(/\D/g,'').slice(0,8);return d.length<=2?d:d.length<=4?d.slice(0,2)+' / '+d.slice(2):d.slice(0,2)+' / '+d.slice(2,4)+' / '+d.slice(4)}function normalizeBirth(v){if(/^\d{4}-\d{2}-\d{2}$/.test(v||'')){const[y,m,d]=String(v).split('-');return`${d} / ${m} / ${y}`}return formatBirth(v)}function validBirth(v){const m=String(v||'').match(/^(\d{2}) \/ (\d{2}) \/ (\d{4})$/);if(!m)return false;const day=+m[1],month=+m[2],year=+m[3],dt=new Date(year,month-1,day);return dt.getFullYear()===year&&dt.getMonth()===month-1&&dt.getDate()===day}function canAssignOwner(existing=''){const current=StackupAuth.current?.();return existing==='OWNER'||current?.role==='OWNER'||!(state.staffUsers||[]).some(s=>s.active!==false)}function rolesFor(existing=''){const x=[...BASE_ROLES];if(canAssignOwner(existing))x.push('OWNER');return x}function roleOptions(selected='DEALER'){return rolesFor(selected).map(r=>`<option value="${r}" ${r===selected?'selected':''}>${r}</option>`).join('')}function accessText(r){return r==='DEALER'?'DEALER STATION E AÇÕES AUTORIZADAS DA MESA.':r==='FLOOR'?'OPERAÇÃO, JOGADORES, CHECK-IN E BALANCING.':r==='TD'?'CONTROLE, CONFIGURAÇÃO E DIREÇÃO DO TORNEIO.':r==='CASHIER'?'FINANCEIRO, PLAYER CREDIT, PAGAMENTOS, CHECK-IN E JOGADORES.':r==='VIEWER'?'SOMENTE CONSULTA DAS TELAS AUTORIZADAS.':r==='OWNER'?'PROPRIETÁRIO • ACESSO TOTAL.':'GESTÃO COMPLETA DO AMBIENTE.'}function applyRoleAccess(){const r=$('role'),note=$('accessNote');if(r&&note)note.textContent=accessText(r.value)}function populateRole(selected){const r=$('role');if(!r)return;const keep=selected||r.value||'DEALER';r.innerHTML=roleOptions(keep);r.value=[...r.options].some(o=>o.value===keep)?keep:'DEALER';r.onchange=applyRoleAccess;applyRoleAccess()}function renderClubs(){const club=$('club'),save=$('save'),notice=$('staffNotice');if(!club)return false;const keep=club.value;StackupAuth.ensure();const clubs=(state.authClubs||[]).filter(c=>c.active!==false);if(!clubs.length){club.innerHTML='<option value="">CADASTRE UM AMBIENTE PRIMEIRO</option>';club.disabled=true;if(save)save.disabled=true;if(notice)notice.textContent='NENHUM AMBIENTE CADASTRADO. USE O MÓDULO AMBIENTES ANTES DE CADASTRAR STAFF.';return false}club.disabled=false;club.innerHTML=clubs.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} • ${c.type==='HOME_GAME'?'HOME GAME':c.type==='LEAGUE'?'LIGA':'CLUBE'}</option>`).join('');if(keep&&[...club.options].some(o=>o.value===keep))club.value=keep;else{const currentId=StackupAuth.current?.()?.clubId||'';if(currentId&&[...club.options].some(o=>o.value===currentId))club.value=currentId}if(save)save.disabled=false;if(notice?.textContent.startsWith('NENHUM AMBIENTE'))notice.textContent='';return true}function viewStaff(s){return{...s,role:String(s.role||'VIEWER').toUpperCase(),cpf:s.cpf||'',birth:normalizeBirth(s.birth||''),email:s.email||'',instagram:s.instagram||'',whatsapp:s.whatsapp||s.phone||'',clubId:s.clubId||state.clubId||''}}function selectedIds(){return [...document.querySelectorAll('[data-pick]:checked')].map(x=>x.dataset.pick)}function clubName(id){return(state.authClubs||[]).find(c=>c.id===id)?.name||id||'-'}function clubOptions(selected){return(state.authClubs||[]).filter(c=>c.active!==false).map(c=>`<option value="${esc(c.id)}" ${String(c.id)===String(selected)?'selected':''}>${esc(c.name)} • ${c.type==='HOME_GAME'?'HOME GAME':c.type==='LEAGUE'?'LIGA':'CLUBE'}</option>`).join('')}function displayRow(s){return `<div class="historyRow" data-row="${esc(s.id)}"><input class="pick" type="checkbox" data-pick="${esc(s.id)}"><div class="historyInfo"><b>${esc(s.name)}</b> <span class="badge">${esc(s.role)}</span><span class="badge">${esc(clubName(s.clubId))}</span><div class="meta">CPF: ${esc(s.cpf||'-')} • NASCIMENTO: ${esc(s.birth||'-')}<br>TELEFONE: ${esc(s.phone||'-')} • WHATSAPP: ${esc(s.whatsapp||'-')}<br>${esc(s.email||'-')} • ${esc(s.instagram||'-')}</div></div></div>`}function editorRow(s){return `<div class="historyRow" data-row="${esc(s.id)}"><input class="pick" type="checkbox" data-pick="${esc(s.id)}" checked><div class="historyInfo inlineEditor"><div class="inlineGrid"><input data-f="name" value="${esc(s.name)}" placeholder="NOME COMPLETO"><input data-f="cpf" value="${esc(s.cpf)}" placeholder="CPF"></div><div class="inlineGrid3"><input data-f="birth" inputmode="numeric" maxlength="14" value="${esc(s.birth)}" placeholder="DD / MM / AAAA"><input data-f="phone" value="${esc(s.phone)}" placeholder="TELEFONE"><input data-f="whatsapp" value="${esc(s.whatsapp)}" placeholder="WHATSAPP"></div><div class="inlineGrid"><input data-f="email" type="email" value="${esc(s.email)}" placeholder="E-MAIL"><input data-f="instagram" value="${esc(s.instagram)}" placeholder="INSTAGRAM"></div><div class="inlineGrid3"><select data-f="clubId">${clubOptions(s.clubId)}</select><select data-f="role">${roleOptions(s.role)}</select><input data-f="pin" type="password" inputmode="numeric" autocomplete="new-password" placeholder="NOVO PIN • OPCIONAL"></div><div class="inlineActions"><button class="primary" type="button" data-inline-confirm="${esc(s.id)}">CONFIRMAR</button><button type="button" data-inline-cancel="${esc(s.id)}">CANCELAR</button></div></div></div>`}function renderHistory(){const list=$('list');if(!list)return;const arr=(state.staffUsers||[]).map(viewStaff).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'pt-BR')||clubName(a.clubId).localeCompare(clubName(b.clubId),'pt-BR'));list.innerHTML=arr.length?arr.map(s=>String(s.id)===String(inlineEditingId)?editorRow(s):displayRow(s)).join(''):'<div class="meta">NENHUM STAFF CADASTRADO.</div>';document.querySelectorAll('[data-f="birth"]').forEach(i=>i.oninput=()=>{i.value=formatBirth(i.value)});document.querySelectorAll('[data-inline-confirm]').forEach(b=>b.onclick=()=>confirmInline(b.dataset.inlineConfirm));document.querySelectorAll('[data-inline-cancel]').forEach(b=>b.onclick=()=>{inlineEditingId='';renderHistory()})}function clearForm(){['staffNameInput','cpf','birth','phone','whatsapp','email','instagram','pin'].forEach(id=>{const el=$(id);if(el)el.value=''});populateRole('DEALER');renderClubs()}function confirmInline(id){const row=document.querySelector(`[data-row="${CSS.escape(String(id))}"]`),s=(state.staffUsers||[]).find(x=>String(x.id)===String(id));if(!row||!s)return;const get=f=>row.querySelector(`[data-f="${f}"]`),birthVal=get('birth').value,name=get('name').value.trim(),cpfVal=get('cpf').value.trim(),clubId=get('clubId').value,newRole=get('role').value,pinVal=get('pin').value.trim();if(!name)return alert('INFORME O NOME.');if(!cpfVal)return alert('INFORME O CPF.');if(!clubId)return alert('SELECIONE O AMBIENTE.');if(birthVal&&!validBirth(birthVal))return alert('INFORME A DATA DE NASCIMENTO NO FORMATO DD / MM / AAAA.');const duplicate=(state.staffUsers||[]).find(x=>String(x.id)!==String(id)&&String(x.cpf||'').replace(/\D/g,'')===cpfVal.replace(/\D/g,'')&&String(x.clubId||'')===String(clubId));if(duplicate)return alert('ESTA PESSOA JÁ POSSUI UM VÍNCULO NESTE AMBIENTE.');Object.assign(s,{name,cpf:cpfVal,birth:birthVal,phone:get('phone').value.trim(),whatsapp:get('whatsapp').value.trim(),email:get('email').value.trim(),instagram:get('instagram').value.trim(),clubId,role:newRole,permissions:permissionsFor(newRole),active:true});if(pinVal)s.pin=pinVal;saveState();StackupAuth.ensure();inlineEditingId='';const notice=$('staffNotice');if(notice)notice.textContent='STAFF ATUALIZADO.';renderHistory()}function bind(){const birth=$('birth');if(birth)birth.oninput=()=>{birth.value=formatBirth(birth.value)};const edit=$('editSelected');if(edit)edit.onclick=()=>{const ids=selectedIds();if(ids.length!==1)return alert('SELECIONE APENAS UM STAFF PARA EDITAR.');inlineEditingId=ids[0];renderHistory();document.querySelector(`[data-row="${CSS.escape(String(inlineEditingId))}"] [data-f="name"]`)?.focus()};const del=$('deleteSelected');if(del)del.onclick=()=>{const ids=selectedIds();if(!ids.length)return alert('SELECIONE AO MENOS UM STAFF.');state.staffUsers=(state.staffUsers||[]).filter(s=>!ids.includes(String(s.id)));(state.authMemberships||[]).forEach(m=>{if(ids.includes(String(m.staffId)))m.active=false});if(ids.includes(String(inlineEditingId)))inlineEditingId='';saveState();StackupAuth.ensure();renderHistory()};const save=$('save');if(save)save.onclick=()=>{if(!renderClubs())return;const name=$('staffNameInput').value.trim(),cpfVal=$('cpf').value.trim(),pinVal=$('pin').value.trim(),clubId=$('club').value,newRole=$('role').value,birthVal=$('birth').value;if(!name)return alert('INFORME O NOME.');if(!cpfVal)return alert('INFORME O CPF.');if(!pinVal)return alert('INFORME O PIN DE ACESSO.');if(!clubId)return alert('SELECIONE O AMBIENTE.');if(birthVal&&!validBirth(birthVal))return alert('INFORME A DATA DE NASCIMENTO NO FORMATO DD / MM / AAAA.');const duplicate=(state.staffUsers||[]).find(s=>String(s.cpf||'').replace(/\D/g,'')===cpfVal.replace(/\D/g,'')&&String(s.clubId||'')===String(clubId));if(duplicate)return alert('ESTA PESSOA JÁ POSSUI UM VÍNCULO NESTE AMBIENTE. EDITE O VÍNCULO EXISTENTE.');state.staffUsers=Array.isArray(state.staffUsers)?state.staffUsers:[];state.staffUsers.push({id:'staff-'+Date.now(),name,cpf:cpfVal,birth:birthVal,phone:$('phone').value.trim(),whatsapp:$('whatsapp').value.trim(),email:$('email').value.trim(),instagram:$('instagram').value.trim(),role:newRole,pin:pinVal,clubId,permissions:permissionsFor(newRole),active:true,createdAt:Date.now()});saveState();StackupAuth.ensure();clearForm();$('staffNotice').textContent='STAFF CADASTRADO.';renderHistory()}}function applyView(){if(VIEW==='register'){$('pageTitle').textContent='CADASTRAR STAFF';$('staffHistory')?.remove()}else if(VIEW==='registered'){$('pageTitle').textContent='STAFF CADASTRADO';$('staffFormSection')?.remove();$('staffHistory')?.classList.remove('hidden')}else $('staffHistory')?.classList.remove('hidden')}applyView();if($('staffFormSection')){populateRole('DEALER');renderClubs()}bind();renderHistory();</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATIVAÇÃO DE TORNEIOS</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.ey,.section{color:#8DFC3B;letter-spacing:.12em}.title{margin:5px 0 24px}.section{margin:26px 2px 10px;font-size:12px}.selectorRow,.actions{display:grid;gap:8px}.selectorRow{grid-template-columns:minmax(0,1fr)}#chooseTournament{width:100%}.tournamentList{display:none;gap:8px;margin-top:10px}.tournamentList.open{display:grid}.tournamentChoice{width:100%;min-height:50px;justify-content:flex-start!important;text-align:left!important}.selectedInfo,.current,.pending{padding:0;border:0;background:transparent;color:#AEB8B1;line-height:1.5}.selectedInfo .name,.current .activeName{color:#8DFC3B;font-size:18px}.selectedInfo .meta,.current .meta{margin-top:4px}.actions{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:12px}.actions button{width:100%;min-height:44px}.actions button.active{background:#8DFC3B!important;color:#020302!important;border-color:#8DFC3B!important}.confirmRow{margin-top:10px}.confirmRow button{width:100%;min-height:48px}.pending{margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid a{text-decoration:none}.grid button{width:100%;min-height:64px;text-align:left;padding:12px}.disabled{opacity:.4;pointer-events:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">ATIVAÇÃO DE TORNEIOS</h1><div class="section">SELECIONAR TORNEIO</div><div class="selectorRow"><button id="chooseTournament" type="button">SELECIONAR TORNEIO</button><div id="tournamentList" class="tournamentList"></div></div><div class="section">TORNEIO SELECIONADO</div><div id="selected" class="selectedInfo">NENHUM TORNEIO SELECIONADO.</div><div id="selectedActions" class="disabled"><div class="actions"><button type="button" data-action="activate">ATIVAR</button><button type="button" data-action="deactivate">DESATIVAR</button><button type="button" data-action="edit">EDITAR</button><button type="button" data-action="delete">APAGAR</button></div><div id="pending" class="pending">SELECIONE UMA AÇÃO.</div><div class="confirmRow"><button id="confirmAction" type="button">CONFIRMAR</button></div></div><div class="section">TORNEIO ATIVO</div><div id="current" class="current">NENHUM TORNEIO ATIVO.</div><div id="ops" class="disabled"><div class="section">OPERAÇÃO DO TORNEIO</div><div class="grid"><a href="checkin.html"><button>INSCRIÇÕES / CHECK-IN</button></a><a href="players.html"><button>MOVIMENTAÇÕES E GESTÃO</button></a><a href="dealer.html"><button>DEALER STATION</button></a><a href="final-table-access.html"><button>TD / FLOOR STATION</button></a><a href="control.html"><button>CONTROLE DO TORNEIO</button></a><a href="screen.html"><button>TRANSMISSÃO DO TORNEIO</button></a><a href="tournament-close.html"><button>ENCERRAMENTO</button></a></div></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let selectedId='',pendingAction='';const CONFIG_KEYS=['clubName','clubId','clubType','language','tournamentFormat','gameType','seatsPerTable','buyin','buyinChips','earlyBonusValue','earlyBonusChips','rebuyValue','rebuyChips','doubleRebuyValue','doubleRebuyChips','reentryValue','reentryChips','addonValue','addonChips','specialAddonValue','specialAddonChips','addonBonusValue','addonBonusChips','bountyValue','bountyRecurring','bountyDoubleSecond','bountyOnReentry','fee','guaranteed','paidPlaces','lateRegLevel','startingStack','structure','selectedStructureId','selectedStructureName','finalTableStructureMode','finalTableHandsPerLevel','announcements'];const cloneConfig=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));function sourceList(){if(Array.isArray(state.savedTournaments)&&state.savedTournaments.length)return state.savedTournaments;if(Array.isArray(state.events)&&state.events.length)return state.events;if(Array.isArray(state.tournaments)&&state.tournaments.length)return state.tournaments;if(!Array.isArray(state.savedTournaments))state.savedTournaments=[];return state.savedTournaments}function definitionData(t){return t?.data&&typeof t.data==='object'?t.data:t?.raw?.data&&typeof t.raw.data==='object'?t.raw.data:t?.raw&&typeof t.raw==='object'?t.raw:t||{}}function normalize(t){const d=definitionData(t);return{id:String(t?.id||t?.eventId||d.id||d.eventId||'').trim(),name:String(t?.name||t?.tournamentName||d.name||d.tournamentName||'').trim()||'TORNEIO SEM NOME',status:String(t?.status||d.status||d.tournamentStatus||''),raw:t,data:d}}function candidates(){const out=[],seen=new Set();for(const t of sourceList()){const n=normalize(t);if(!n.id||seen.has(n.id))continue;seen.add(n.id);out.push(n)}if(state.eventId&&!seen.has(String(state.eventId))){out.push({id:String(state.eventId),name:String(state.tournamentName||'').trim()||'TORNEIO SEM NOME',status:String(state.status||state.tournamentStatus||''),raw:null,data:state})}return out}function persistActive(id){try{if(id)localStorage.setItem('stackupActiveTournamentId',id);else localStorage.removeItem('stackupActiveTournamentId')}catch(_){}}function applyDefinition(t){const d=definitionData(t);CONFIG_KEYS.forEach(k=>{if(Object.prototype.hasOwnProperty.call(d,k))state[k]=cloneConfig(d[k])});state.selectedTournamentId=t.id;state.selectedTournamentName=t.name;return d}function activate(t){applyDefinition(t);state.eventId=t.id;state.tournamentName=t.name;state.status='VALIDADO';state.prepared=true;state.tournamentStatus='VALIDATED';persistActive(t.id);saveState()}function deactivate(t){if(String(state.eventId||'')!==t.id)return;state.prepared=false;state.status='INATIVO';state.tournamentStatus='INACTIVE';persistActive('');saveState()}function editTournament(t){try{sessionStorage.setItem('stackupEditTournamentId',t.id)}catch(_){}location.href='setup.html?edit='+encodeURIComponent(t.id)}function deleteTournament(t){if(Array.isArray(state.savedTournaments)){state.savedTournaments=state.savedTournaments.filter(x=>String(x.id||x.eventId||'')!==t.id)}if(Array.isArray(state.events))state.events=state.events.filter(x=>String(x.id||x.eventId||'')!==t.id);if(Array.isArray(state.tournaments))state.tournaments=state.tournaments.filter(x=>String(x.id||x.eventId||'')!==t.id);if(String(state.eventId||'')===t.id){state.eventId='';state.tournamentName='';state.prepared=false;persistActive('')}selectedId='';saveState()}function setPending(action){if(!selectedId)return;pendingAction=action;document.querySelectorAll('#selectedActions [data-action]').forEach(b=>b.classList.toggle('active',b.dataset.action===action));const labels={activate:'ATIVAR TORNEIO',deactivate:'DESATIVAR TORNEIO',edit:'EDITAR TORNEIO',delete:'APAGAR TORNEIO'};pending.textContent='AÇÃO SELECIONADA: '+(labels[action]||'')}function runConfirmed(){const t=candidates().find(x=>x.id===selectedId);if(!t||!pendingAction)return;if(pendingAction==='activate')activate(t);else if(pendingAction==='deactivate')deactivate(t);else if(pendingAction==='edit')return editTournament(t);else if(pendingAction==='delete'){if(!confirm(`APAGAR ${t.name}?`))return;deleteTournament(t)}pendingAction='';render()}function render(){const arr=candidates(),active=String(state.eventId||''),t=arr.find(x=>x.id===selectedId),a=arr.find(x=>x.id===active);tournamentList.innerHTML=arr.length?arr.map(x=>`<button type="button" class="tournamentChoice" data-id="${esc(x.id)}">${esc(x.name)}${x.id===active&&state.prepared?' • ATIVO':''}</button>`).join(''):'<div>NENHUM TORNEIO CADASTRADO.</div>';tournamentList.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selectedId=b.dataset.id;pendingAction='';tournamentList.classList.remove('open');render()});selected.innerHTML=t?`<div class="name">${esc(t.name)}</div><div class="meta">${esc(t.status||'TORNEIO CADASTRADO')} • ID ${esc(t.id)}</div>`:'NENHUM TORNEIO SELECIONADO.';selectedActions.classList.toggle('disabled',!t);current.innerHTML=a&&state.prepared?`<div class="activeName">${esc(a.name)}</div><div class="meta">${esc(state.tournamentStatus||a.status||'ATIVO')} • ID ${esc(a.id)}</div>`:'NENHUM TORNEIO ATIVO.';ops.classList.toggle('disabled',!(a&&state.prepared));document.querySelectorAll('#selectedActions [data-action]').forEach(b=>b.classList.toggle('active',b.dataset.action===pendingAction));pending.textContent=pendingAction?'AÇÃO SELECIONADA: '+({activate:'ATIVAR TORNEIO',deactivate:'DESATIVAR TORNEIO',edit:'EDITAR TORNEIO',delete:'APAGAR TORNEIO'}[pendingAction]):'SELECIONE UMA AÇÃO.'}chooseTournament.onclick=()=>tournamentList.classList.toggle('open');document.querySelectorAll('#selectedActions [data-action]').forEach(b=>b.onclick=()=>setPending(b.dataset.action));confirmAction.onclick=runConfirmed;const requested=new URLSearchParams(location.search).get('id');if(requested&&candidates().some(x=>x.id===requested))selectedId=requested;render();window.onPokerStateChange=render;</script><script src="app-theme.js"></script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IMPORTAR ESTRUTURA • ASSISTÊNCIA IA</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff;min-height:100vh}.app{width:min(900px,92vw);margin:0 auto;padding:24px 0}.ey{color:#8DFC3B;font-size:12px!important;letter-spacing:.08em}.title{font-size:20px!important;margin:5px 0 8px}.sub,.status{color:#9CA69F!important;font-size:12px!important;line-height:1.5}.actions,.editorActions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}.actions button,.editorActions button{min-height:46px}.hidden{display:none!important}.result{margin-top:14px}.meta{color:#AEB8B1;font-size:12px;margin:8px 0 14px}.nameRow{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:10px}.levelsWrap{overflow-x:auto}.head,.row{display:grid;grid-template-columns:64px 86px 96px 96px 96px 62px;gap:8px;min-width:620px;align-items:center}.head{color:#8DFC3B;font-size:11px;letter-spacing:.06em;margin-bottom:6px}.row{margin-bottom:8px}.row input{width:100%;box-sizing:border-box;text-align:center}.row button{min-width:0!important;padding:8px 4px!important}.notice{padding:12px;border:1px solid #27342D;border-radius:10px;background:linear-gradient(#0B100D,#060907);margin-top:12px}.back{margin-top:16px;width:100%;min-height:44px}@media(max-width:700px){.actions,.editorActions{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE • ASSISTÊNCIA IA</div><div class="title">IMPORTAR ESTRUTURA</div><p class="sub">IMPORTE UMA FOTO OU ARQUIVO. O SISTEMA EXTRAI OS NÍVEIS, ABRE O EDITOR PARA CONFERÊNCIA E, AO SALVAR, ENVIA A ESTRUTURA DIRETAMENTE PARA CONFIGURAÇÕES &gt; ESTRUTURAS.</p><div class="actions"><button id="cameraBtn" type="button">ABRIR CÂMERA</button><button id="fileBtn" type="button">ESCOLHER FOTO / ARQUIVO</button></div><input id="cameraInput" class="hidden" type="file" accept="image/*" capture="environment"><input id="fileInput" class="hidden" type="file" accept="image/*,.txt,.csv,.pdf,.xlsx,.xls"><div id="status" class="status"></div><section id="resultBox" class="result hidden"><div class="notice"><b style="color:#8DFC3B">EDITOR DE ESTRUTURA</b><div id="resultMeta" class="meta"></div><div class="nameRow"><input id="structureName" placeholder="NOME DA ESTRUTURA"></div><div class="levelsWrap"><div class="head"><div>NÍVEL</div><div>MIN</div><div>SB</div><div>BB</div><div>ANTE</div><div>DEL</div></div><div id="levels"></div></div><div class="editorActions"><button id="addLevel" type="button">ADICIONAR NÍVEL</button><button id="optimizeBtn" type="button">OTIMIZAR COM IA</button><button id="saveBtn" class="primary" type="button">SALVAR EM CONFIGURAÇÕES</button><button id="openSetupBtn" type="button">ABRIR CONFIGURAÇÕES</button></div><div id="saveStatus" class="status"></div></div></section><button class="back" type="button" onclick="location.href='ai-link.html'">ANTERIOR</button></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>(()=>{const $=id=>document.getElementById(id),statusEl=$('status'),saveStatusEl=$('saveStatus');let imported=null;const safe=v=>String(v??'').replace(/[<>]/g,'').trim();const num=v=>Math.max(0,Number(String(v??'').replace(/\./g,'').replace(',','.').replace(/[^0-9.-]/g,''))||0);function parse(text){const u=text.toUpperCase(),def=((u.match(/\b(\d{1,3})\s*(?:MIN|MINUTOS)\b/)||[])[1]||20),bbAnte=/BB\s*ANTE|BIG\s*BLIND\s*ANTE/.test(u),out=[];for(const raw of text.split(/\r?\n/)){const line=raw.trim();if(!line)continue;if(/BREAK|INTERVALO|PAUSA/i.test(line))continue;const slash=line.match(/([\d.,]+)\s*[\/xX-]\s*([\d.,]+)/);let sb=0,bb=0,ante=0,time=+def||20;if(slash){sb=num(slash[1]);bb=num(slash[2]);const after=line.slice((slash.index||0)+slash[0].length);ante=((after.match(/[\d.,]+/g)||[]).map(num).filter(Boolean)[0])||0;const mins=(line.match(/(\d{1,3})\s*(?:MIN|M)\b/i)||[])[1];if(mins)time=+mins}else{let nums=(line.match(/[\d.,]+/g)||[]).map(num).filter(v=>v>0);if(nums.length<2)continue;const lvl=line.match(/^\s*(?:N[IÍ]VEL|LEVEL|LVL)?\s*(\d{1,3})\b/i);if(lvl&&nums[0]===+lvl[1])nums=nums.slice(1);if(nums.length>=4&&nums[0]<=180){time=nums[0];sb=nums[1];bb=nums[2];ante=nums[3]||0}else{sb=nums[0];bb=nums[1];ante=nums[2]||0}}if(sb>0&&bb>=sb){if(bbAnte&&!ante)ante=bb;out.push({level:out.length+1,time:Math.max(1,time),sb,bb,ante})}}return out}function validate(rows){if(rows.length<2)return'A ESTRUTURA PRECISA TER PELO MENOS 2 NÍVEIS.';for(let i=0;i<rows.length;i++){const r=rows[i];if(!(r.time>0))return`NÍVEL ${i+1}: TEMPO INVÁLIDO.`;if(!(r.sb>0&&r.bb>=r.sb))return`NÍVEL ${i+1}: BLINDS INVÁLIDOS.`;if(i&&r.bb<rows[i-1].bb)return`NÍVEL ${i+1}: BB MENOR QUE O NÍVEL ANTERIOR.`}return''}function guessedName(text,file){const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);return safe(lines.find(x=>x.length>3&&x.length<70&&!/^\d/.test(x)&&!/(BLIND|ANTE|LEVEL|N[IÍ]VEL|SB|BB|MIN)/i.test(x))||file?.name?.replace(/\.[^.]+$/,'')||'ESTRUTURA IMPORTADA').toUpperCase()}async function extract(file){const ext=(file.name.split('.').pop()||'').toLowerCase();if(file.type.startsWith('image/')){if(!window.Tesseract)throw new Error('MOTOR OCR INDISPONÍVEL.');const r=await Tesseract.recognize(file,'por+eng',{logger:m=>{if(m.status==='recognizing text')statusEl.textContent=`ANALISANDO • ${Math.round((m.progress||0)*100)}%`}});return r?.data?.text||''}if(['xlsx','xls'].includes(ext)){if(!window.XLSX)throw new Error('LEITOR DE PLANILHA INDISPONÍVEL.');const buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_csv(ws)}if(ext==='pdf')throw new Error('PDF AINDA PRECISA SER CONVERTIDO PARA IMAGEM NESTA VERSÃO. USE FOTO, XLS/XLSX, CSV OU TXT.');return await file.text()}async function analyze(file){if(!file)return;statusEl.textContent='LENDO ESTRUTURA...';$('resultBox').classList.add('hidden');try{const text=await extract(file),rows=parse(text),err=validate(rows);if(err)throw new Error(err+' CONFIRA A QUALIDADE DO ARQUIVO.');imported={id:'ai-struct-'+Date.now(),name:guessedName(text,file),rows};$('structureName').value=imported.name;render();$('resultMeta').textContent=`${rows.length} NÍVEIS RECONHECIDOS • EDITE ANTES DE SALVAR`;$('resultBox').classList.remove('hidden');statusEl.textContent='ESTRUTURA RECONHECIDA. CONFIRA NO EDITOR.'}catch(e){statusEl.textContent='NÃO FOI POSSÍVEL IMPORTAR: '+safe(e.message||e)}}function render(){if(!imported)return;$('levels').innerHTML=imported.rows.map((r,i)=>`<div class="row"><input value="${i+1}" readonly><input data-k="time" data-i="${i}" type="number" min="1" value="${r.time}"><input data-k="sb" data-i="${i}" type="number" min="0" value="${r.sb}"><input data-k="bb" data-i="${i}" type="number" min="0" value="${r.bb}"><input data-k="ante" data-i="${i}" type="number" min="0" value="${r.ante}"><button data-del="${i}" type="button">DEL</button></div>`).join('');$('levels').querySelectorAll('input[data-k]').forEach(el=>el.oninput=()=>{imported.rows[+el.dataset.i][el.dataset.k]=Math.max(0,+el.value||0)});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{imported.rows.splice(+b.dataset.del,1);render()})}function optimize(){if(!imported)return;for(let i=1;i<imported.rows.length;i++){const p=imported.rows[i-1],r=imported.rows[i];if(r.bb<p.bb)r.bb=p.bb;if(r.sb>r.bb)r.sb=Math.floor(r.bb/2);if(r.ante>r.bb*2)r.ante=r.bb}render();saveStatusEl.textContent='SUGESTÕES APLICADAS NO EDITOR. REVISE ANTES DE SALVAR.'}function save(){if(!imported)return;imported.name=safe($('structureName').value||'ESTRUTURA IMPORTADA').toUpperCase();const err=validate(imported.rows);if(err){saveStatusEl.textContent=err;return}state.savedStructures=Array.isArray(state.savedStructures)?state.savedStructures:[];const item={id:imported.id,name:imported.name,bbAnte:imported.rows.every(r=>r.ante===r.bb),bbMode:0,rows:imported.rows.map((r,i)=>({level:i+1,time:+r.time,sb:+r.sb,bb:+r.bb,ante:+r.ante,locked:true})),source:'ASSISTÊNCIA IA',updatedAt:Date.now()};state.savedStructures=state.savedStructures.filter(x=>x.id!==item.id);state.savedStructures.unshift(item);saveState();saveStatusEl.textContent='ESTRUTURA SALVA EM CONFIGURAÇÕES > ESTRUTURAS.'}$('cameraBtn').onclick=()=>$('cameraInput').click();$('fileBtn').onclick=()=>$('fileInput').click();$('cameraInput').onchange=()=>analyze($('cameraInput').files?.[0]);$('fileInput').onchange=()=>analyze($('fileInput').files?.[0]);$('addLevel').onclick=()=>{if(!imported)imported={id:'ai-struct-'+Date.now(),name:'NOVA ESTRUTURA',rows:[]};const p=imported.rows.at(-1)||{time:20,sb:100,bb:200,ante:0};imported.rows.push({level:imported.rows.length+1,time:p.time,sb:p.sb,bb:p.bb,ante:p.ante});$('resultBox').classList.remove('hidden');render()};$('optimizeBtn').onclick=optimize;$('saveBtn').onclick=save;$('openSetupBtn').onclick=()=>location.href='setup.html';})();</script><script src="app-theme.js"></script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BOUNTY CONTROL</title><link rel="stylesheet" href="app-theme.css"><style>:root{--bg:#020302;--panel:#0a0f0c;--line:#29362e;--green:#8DFC3B;--muted:#9ca69f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff}.app{max-width:760px;margin:auto;padding:18px}.ey,.section{color:var(--green);letter-spacing:.12em}.ey{font-size:10px}.title{font-size:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.section{font-size:11px;margin:18px 2px 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#070b09;border:1px solid #253229;border-radius:11px;padding:10px}.k{font-size:9px;color:#9fa9a2}.v{font-size:19px;margin-top:3px}.green{color:var(--green)}.meta{font-size:11px;color:var(--muted);line-height:1.5}.label{font-size:10px;color:#b5beb8;margin-bottom:5px}select,input,button{width:100%;min-height:44px;border-radius:9px;padding:10px;background:#070b09;color:#fff;border:1px solid #34463b}.primary{border-color:var(--green);color:var(--green)}.row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #1d2721}.row:last-child{border:0}@media(max-width:620px){.grid,.stats{grid-template-columns:1fr}.title{font-size:20px}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE • KNOCKOUT LEDGER</div><div class="title">BOUNTY CONTROL</div><div class="card"><div id="format" class="meta"></div></div><div class="section">REGISTRAR KNOCKOUT</div><div class="card"><div class="grid"><div><div class="label">QUEM ELIMINOU</div><select id="winner"></select></div><div><div class="label">JOGADOR ALVO</div><select id="eliminated"></select></div><div><div class="label">BOUNTY DA ELIMINAÇÃO</div><input id="value" type="number"></div><div><div class="label">RESPONSÁVEL AUTENTICADO</div><select id="staff" disabled></select></div></div><button class="primary" id="award" type="button" style="margin-top:8px">REGISTRAR KNOCKOUT + BOUNTY</button><div id="feedback" class="meta" style="margin-top:8px"></div></div><div class="section">RESUMO</div><div class="stats"><div class="stat"><div class="k">ARRECADADO</div><div class="v green" id="collected"></div></div><div class="stat"><div class="k">PAGO</div><div class="v green" id="paid"></div></div><div class="stat"><div class="k">RESERVA</div><div class="v" id="reserve"></div></div></div><div class="section">HISTÓRICO</div><div class="card" id="bountyHistory"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script src="operations.js"></script><script src="bounty-engine.js"></script><script src="tournament-engine.js"></script><script>const bountyHistory=document.getElementById('bountyHistory'),BOUNTY_STAFF=StackupAuth.staffForSession(),requestedTarget=new URLSearchParams(location.search).get('target')||new URLSearchParams(location.search).get('eliminated')||'';let initialTarget=requestedTarget;const eventOf=p=>String(p?.eventId||p?.validationEventId||'');function currentPlayers(){const e=String(state.eventId||'');return e?(state.players||[]).filter(p=>eventOf(p)===e):[]}function txs(){const e=String(state.eventId||'');return e?(state.transactions||[]).filter(t=>String(t.eventId||'')===e):[]}function target(){return currentPlayers().find(p=>String(p.id)===String(eliminated.value))||null}function syncBountyValue(){const p=target();value.value=Math.max(0,+p?.currentBounty||+state.bountyValue||0);value.readOnly=state.tournamentFormat==='PKO'}function canOperate(){return !!BOUNTY_STAFF?.id&&['OWNER','GESTOR','TD','FLOOR'].includes(BOUNTY_STAFF.role)}function render(){PokerOperations.ensure();state.pkoCashPercent=Number.isFinite(+state.pkoCashPercent)?+state.pkoCashPercent:50;const enabled=!!state.eventId&&state.prepared&&PokerOperations.bountyEnabled(),players=currentPlayers(),oldWinner=winner.value,oldTarget=initialTarget||eliminated.value;initialTarget='';format.innerHTML=!state.eventId?'NENHUM TORNEIO SELECIONADO.':enabled?`<b>${state.tournamentName||'TORNEIO'} • ${state.tournamentFormat}</b> • BOUNTY INICIAL ${fmtCurrency(state.bountyValue)}${state.tournamentFormat==='PKO'?` • ${state.pkoCashPercent}% PAGO / ${100-state.pkoCashPercent}% ADICIONADO AO BOUNTY DO VENCEDOR`:''}`:'ESTE TORNEIO NÃO POSSUI BOUNTY ATIVO.';const targetRows=players.filter(p=>p.status==='active'||(+p.currentBounty||0)>0);eliminated.innerHTML='<option value="">SELECIONE</option>'+targetRows.map(p=>`<option value="${p.id}">${p.name} • ${p.status==='active'?'ATIVO':'ELIMINADO / PENDENTE'} • BOUNTY ${fmtCurrency(+p.currentBounty||+state.bountyValue||0)}</option>`).join('');if(oldTarget&&targetRows.some(p=>String(p.id)===String(oldTarget)))eliminated.value=oldTarget;const tid=eliminated.value;winner.innerHTML='<option value="">SELECIONE</option>'+players.filter(p=>p.status==='active'&&String(p.id)!==String(tid)).map(p=>`<option value="${p.id}">${p.name} • BOUNTY ATUAL ${fmtCurrency(+p.currentBounty||0)}</option>`).join('');if(oldWinner&&players.some(p=>String(p.id)===String(oldWinner)&&p.status==='active'&&String(p.id)!==String(tid)))winner.value=oldWinner;staff.innerHTML=BOUNTY_STAFF?`<option value="${BOUNTY_STAFF.id}">${BOUNTY_STAFF.name} • ${BOUNTY_STAFF.role}</option>`:'<option value="">SEM SESSÃO AUTENTICADA</option>';syncBountyValue();const inBounty=txs().reduce((a,t)=>a+(t.breakdown?.classification==='CLASSIFIED'?(+t.breakdown.bounty||0):0),0),out=txs().filter(t=>t.type==='BOUNTY_PAYOUT').reduce((a,t)=>a+(+t.value||0),0);collected.textContent=fmtCurrency(inBounty);paid.textContent=fmtCurrency(out);reserve.textContent=fmtCurrency(inBounty-out);bountyHistory.innerHTML=txs().filter(t=>t.type==='BOUNTY_PAYOUT').slice(0,40).map(t=>`<div class="row"><div><b>${t.playerName}</b> ELIMINOU <b>${t.eliminatedPlayerName}</b><div class="meta">${new Date(t.createdAt).toLocaleString('pt-BR')}${t.pkCarry?` • PKO CARRY ${fmtCurrency(t.pkCarry)}`:''}${t.pkoCashPercent!=null?` • ${t.pkoCashPercent}% CASH`:''}</div></div><b class="green">${fmtCurrency(t.value)}</b></div>`).join('')||'<div class="meta">NENHUM BOUNTY REGISTRADO NESTE TORNEIO.</div>';award.disabled=!enabled||!canOperate()||!winner.value||!eliminated.value}eliminated.onchange=()=>render();winner.onchange=()=>{award.disabled=!state.prepared||!canOperate()||!winner.value||!eliminated.value};award.onclick=()=>{if(!canOperate()){feedback.textContent='RESPONSÁVEL AUTENTICADO SEM PERMISSÃO PARA REGISTRAR BOUNTY.';return}const p=target();if(!p)return;let r;if(p.status==='active'){r=PokerOperations.eliminatePlayer({playerId:p.id,killerId:winner.value,staff:BOUNTY_STAFF,source:'BOUNTY_CONTROL'});if(r.ok&&r.bounty)r={...r,...r.bounty,winner:r.bounty.winner}}else r=PokerOperations.awardBounty({winnerId:winner.value,eliminatedId:p.id,value:state.tournamentFormat==='PKO'?null:(+value.value||null),staff:BOUNTY_STAFF,source:'BOUNTY_CONTROL'});feedback.textContent=r.ok?`${r.winner.name}: ${fmtCurrency(r.paid)} REGISTRADO${r.carry?` • ${fmtCurrency(r.carry)} ADICIONADOS AO BOUNTY PKO`:''}`:r.error;render()};window.onPokerStateChange=render;window.addEventListener('storage',render);render();</script></body></html>

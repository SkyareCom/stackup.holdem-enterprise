<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MOVIMENTAÇÕES • STACKUP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caacupe+One:wght@400&display=swap');
*{box-sizing:border-box}html,body,body *,button,input,select,option{font-family:'Caacupe One',system-ui,sans-serif!important;font-style:normal!important;font-weight:400!important;letter-spacing:1px!important;text-transform:uppercase}body{margin:0;background:#020302;color:#fff;font-size:12px}.app{max-width:980px;margin:auto;padding:18px}.ey{color:#8DFC3B;font-size:12px}.title{font-size:20px;margin:5px 0 0}.section{color:#8DFC3B;margin:18px 2px 8px;font-size:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.fullGrid{display:grid;grid-template-columns:1fr;gap:8px}.block{margin-top:8px}button,select,input{width:100%;min-height:44px;padding:10px;border-radius:9px;font-size:12px;line-height:1.45;box-sizing:border-box}input,select{background:#060907;color:#fff;border:1px solid #27342D}input:focus,select:focus{border-color:#8DFC3B;outline:none}input::placeholder{color:#AEB8B1;opacity:1}button{background:#060907;color:#8DFC3B;border:1px solid #8DFC3B;cursor:pointer}button.active,.primary{background:#8DFC3B;color:#020302}button:disabled{opacity:.45;cursor:not-allowed}.infoField{min-height:44px;padding:10px;border:1px solid #27342D;border-radius:9px;background:#060907;display:flex;align-items:center;justify-content:space-between;gap:10px;overflow:hidden}.infoLabel{color:#AEB8B1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.infoValue{color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}.infoValue:empty{display:none}.meta,.statusLine{color:#9CA69F;line-height:1.45;margin:8px 2px 0}.hidden{display:none!important}.list{margin-top:8px}.listRow{padding:10px 0;border-bottom:1px solid #27342D;line-height:1.45}.listRow:last-child{border-bottom:0}.empty{color:#AEB8B1;padding:8px 2px}.tableList{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.rebuyList{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}.rebuyRequest{text-align:left;white-space:normal}.rebuyRequest span{display:block;color:#AEB8B1;margin-top:3px}@media(max-width:700px){.grid4,.grid5,.tableList,.actions{grid-template-columns:1fr}}
</style>
</head>
<body><main class="app">
<div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">MOVIMENTAÇÕES E GESTÃO</h1>
<div class="section">RESUMO DO TORNEIO</div><div id="summaryGrid" class="grid4"></div>
<div class="section">MESAS E BALANCING</div><div id="tableList" class="tableList"></div><div class="actions"><button id="recalculateBalancing" type="button">RECALCULAR BALANCING</button><button id="confirmBalancing" type="button">CONFIRMAR MOVIMENTAÇÕES</button></div><div id="balancingStatus" class="statusLine"></div>
<div class="section">JOGADOR</div><select id="playerSelect"><option value="">SELECIONE O JOGADOR</option></select><div id="seatInfo" class="fullGrid block"></div><div id="playerInfo" class="grid4 block"></div><div class="actions"><button id="eliminatePlayer" type="button">ELIMINAÇÃO</button><button id="bountyPlayer" type="button">BOUNTY / PKO</button></div><div id="playerStatus" class="statusLine"></div>
<button id="chipCountAi" class="block" type="button">CHIP COUNT IA / SIDE POT</button>
<button id="registeredPlayers" class="block" type="button">JOGADORES INSCRITOS</button><div id="registeredList" class="list hidden"></div>
<div class="section">TRANSAÇÕES</div><div class="grid5"><button class="txItem" data-item="REBUY_I" data-type="REBUY" type="button">REBUY I</button><button class="txItem" data-item="REBUY_II" data-type="DOUBLE_REBUY" type="button">REBUY II</button><button class="txItem" data-item="REENTRY" data-type="REENTRY" type="button">RE-ENTRY</button><button class="txItem" data-item="ADDON_I" data-type="ADDON" type="button">ADD-ON I</button><button class="txItem" data-item="ADDON_II" data-type="ADDON" type="button">ADD-ON II</button></div>
<div class="section">VALOR</div><input id="transactionValue" readonly placeholder="VALOR AUTOPREENCHIDO">
<div class="section">SOLICITAÇÕES DE REBUY</div><div id="rebuyRequests" class="rebuyList"></div>
<div class="section">FORMA DE PAGAMENTO</div><div class="grid5" data-internal-controls><button class="payment" data-pay="CASH" type="button">DINHEIRO</button><button class="payment" data-pay="PIX" type="button">PIX</button><button class="payment" data-pay="DEBIT" type="button">DÉBITO</button><button class="payment" data-pay="CREDIT" type="button">CRÉDITO</button><button class="payment" data-pay="PLAYER_CREDIT" type="button">PLAYER CREDIT</button></div>
<div class="section">MOEDA</div><select id="transactionCurrency"><option value="BRL">REAL</option><option value="PYG">GUARANI</option><option value="USD">DÓLAR</option><option value="ARS">PESO ARGENTINO</option><option value="EUR">EURO</option></select>
<div class="section">VALOR FINAL</div><div class="infoField"><span class="infoLabel">VALOR FINAL (+ TAXA OU NÃO)</span><span id="finalValue" class="infoValue"></span></div><div id="feeInfo" class="meta">SELECIONE JOGADOR, ITEM E FORMA DE PAGAMENTO.</div><button id="registerTransaction" class="primary block" type="button">REGISTRAR TRANSAÇÃO</button>
<button id="historyButton" class="block" type="button">HISTÓRICO FINANCEIRO</button><div id="historyList" class="list hidden"></div>
</main>
<script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script src="validation.js"></script><script src="operations.js"></script><script src="tournament-engine.js"></script><script src="finance-config.js"></script><script src="wallet-engine.js"></script>
<script>
ensureOperationalState();PokerOperations.ensure();ValidationCodes.ensureValidationState();
const UI_STAFF=StackupAuth.staffForSession();let selectedItem='',selectedType='',selectedPayment='',selectedRequestId='';
const byId=id=>document.getElementById(id),eventOf=p=>String(p?.eventId||p?.validationEventId||''),currentPlayers=()=>{const e=String(state.eventId||'');return e?(state.players||[]).filter(p=>eventOf(p)===e):[]},currentPlayer=()=>currentPlayers().find(p=>String(p.id)===String(byId('playerSelect').value))||null,playerForFee=p=>p?{...p,directoryId:p.directoryId||p.id}:null,fmtBRL=v=>StackupFinance.format(v||0,'BRL'),activeEventTransactions=()=>state.transactions.filter(t=>String(t.eventId||'')===String(state.eventId||'')&&!['cancelled','void'].includes(String(t.status||'').toLowerCase())),itemCode=t=>String(t.itemCode||t.payment?.reference||'').toUpperCase();
function authorized(){if(!UI_STAFF?.id){byId('playerStatus').textContent='É NECESSÁRIA UMA SESSÃO DE STAFF AUTENTICADA.';return false}return true}function ensureEvent(){if(!state.eventId||!state.prepared){byId('playerStatus').textContent='SELECIONE E ATIVE UM TORNEIO ANTES DE OPERAR.';return false}return true}function ensureRebuyRequests(){if(!Array.isArray(state.rebuyRequests))state.rebuyRequests=[]}function field(label,value=''){return `<div class="infoField"><span class="infoLabel">${label}</span><span class="infoValue">${value||''}</span></div>`}function paymentMethod(){if(selectedPayment==='PIX')return'PIX';if(selectedPayment==='DEBIT'||selectedPayment==='CREDIT')return'CARD';return selectedPayment}function configuredValue(){return selectedType?PokerOperations.defaultTransactionValue(selectedType):0}function renderSummary(){const tx=activeEventTransactions(),players=currentPlayers();const metrics=[['BUY INS',tx.filter(t=>t.type==='ENTRY').length],['CHECK INS',new Set(state.seatCheckins.filter(x=>String(x.eventId||'')===String(state.eventId||'')&&x.status==='SEATED').map(x=>String(x.playerId))).size],['REBUYS I',tx.filter(t=>itemCode(t)==='REBUY_I'||(!itemCode(t)&&t.type==='REBUY')).length],['REBUYS II',tx.filter(t=>itemCode(t)==='REBUY_II'||(!itemCode(t)&&t.type==='DOUBLE_REBUY')).length],['RE-ENTRIES',tx.filter(t=>t.type==='REENTRY').length],['ADD ON I',tx.filter(t=>itemCode(t)==='ADDON_I').length],['ADD ON II',tx.filter(t=>itemCode(t)==='ADDON_II').length],['ELIMINAÇÕES',players.filter(p=>p.status!=='active').length]];byId('summaryGrid').innerHTML=metrics.map(([k,v])=>field(k,String(v))).join('')}function renderTables(){const groups=tournamentTableGroups();const ids=Object.keys(groups).map(Number).sort((a,b)=>a-b);byId('tableList').innerHTML=ids.length?ids.map(t=>field(`MESA ${t}`,`${groups[t].length} / ${state.seatsPerTable||9}`)).join(''):'<div class="empty">SEM MESAS ATIVAS.</div>'}function renderPlayerSelect(){const select=byId('playerSelect'),current=select.value,players=currentPlayers(),options=players.slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'pt-BR')).map(p=>`<option value="${p.id}">${p.name}</option>`).join('');select.innerHTML='<option value="">SELECIONE O JOGADOR</option>'+options;if(current&&players.some(p=>String(p.id)===String(current)))select.value=current}function renderPlayer(){const p=currentPlayer(),bountyOn=PokerOperations.bountyEnabled();if(!p){byId('seatInfo').innerHTML=field('MESA')+field('POSIÇÃO');byId('playerInfo').innerHTML=field('NOME COMPLETO')+field('CPF')+field('WHATSAPP')+field('STATUS');byId('eliminatePlayer').disabled=true;byId('bountyPlayer').disabled=true;byId('playerStatus').textContent='';return}const table=p.table??'',seat=p.seat??'',cpf=p.directoryCpf||p.cpf||p.document||p.identity?.cpf||'',whatsapp=p.directoryWhatsapp||p.whatsapp||p.phone||p.identity?.whatsapp||'';byId('seatInfo').innerHTML=field('MESA',table!==''?`MESA ${table}`:'')+field('POSIÇÃO',seat!==''?String(seat):'');byId('playerInfo').innerHTML=field('NOME COMPLETO',p.name||'')+field('CPF',cpf)+field('WHATSAPP',whatsapp)+field('STATUS',p.status==='active'?'ATIVO':'ELIMINADO');byId('eliminatePlayer').disabled=p.status!=='active'||bountyOn;byId('bountyPlayer').disabled=!bountyOn||!(p.status==='active'||(+p.currentBounty||0)>0);byId('playerStatus').textContent=bountyOn&&p.status==='active'?'TORNEIO COM BOUNTY: REGISTRE O KNOCKOUT EM BOUNTY / PKO.':p.status==='active'?'JOGADOR ATIVO.':'JOGADOR ELIMINADO.'}function renderRegistered(){const box=byId('registeredList'),players=currentPlayers().slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'pt-BR'));box.innerHTML=players.length?players.map(p=>`<div class="listRow"><b>${p.name}</b><div class="meta">${p.status==='active'?`MESA ${p.table} • POSIÇÃO ${p.seat}`:(p.finishPosition?`ELIMINADO • POSIÇÃO FINAL ${p.finishPosition}º`:'ELIMINADO')}</div></div>`).join(''):'<div class="empty">NENHUM JOGADOR INSCRITO NESTE TORNEIO.</div>'}function renderRebuyRequests(){ensureRebuyRequests();const rows=state.rebuyRequests.filter(r=>String(r.eventId||'')===String(state.eventId||'')&&r.status==='PENDING').sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));byId('rebuyRequests').innerHTML=rows.length?rows.map(r=>`<button class="rebuyRequest" type="button" data-request="${r.id}"><b>${r.kind==='II'?'REBUY II':'REBUY I'} • ${r.playerName||'JOGADOR'}</b><span>MESA ${r.table??''} • POSIÇÃO ${r.seat??''} • DEALER ${r.dealerName||''}</span></button>`).join(''):'<div class="empty">NENHUMA SOLICITAÇÃO PENDENTE.</div>';document.querySelectorAll('.rebuyRequest').forEach(b=>b.onclick=()=>selectRebuyRequest(b.dataset.request))}function selectRebuyRequest(id){ensureRebuyRequests();const r=state.rebuyRequests.find(x=>x.id===id&&String(x.eventId||'')===String(state.eventId||'')&&x.status==='PENDING');if(!r)return;selectedRequestId=r.id;byId('playerSelect').value=String(r.playerId);selectedItem=r.itemCode;selectedType=r.type;selectedPayment='';renderPlayer();markSelections();renderTransactionValue()}function markSelections(){document.querySelectorAll('.txItem').forEach(b=>b.classList.toggle('active',b.dataset.item===selectedItem));document.querySelectorAll('.payment').forEach(b=>b.classList.toggle('active',b.dataset.pay===selectedPayment))}function paymentPreview(){const base=configuredValue(),p=currentPlayer(),method=paymentMethod(),currency=byId('transactionCurrency').value;if(!p||!selectedItem||!selectedPayment||base<=0)return null;if(method==='PLAYER_CREDIT'){const q=StackupWallet.feeQuote(playerForFee(p),base,{eventId:state.eventId,type:selectedType});return{credit:true,ok:!!q,total:q.totalDebitBRL,fee:q.feeBRL,currency:'BRL',base}}const amount=StackupFinance.convert(base,'BRL',currency);if(amount===null)return{ok:false,error:'COTAÇÃO NÃO CONFIGURADA PARA ESTA MOEDA.'};const proc=StackupFinance.processingFee(method,currency,playerForFee(p),StackupFinance.load(),amount);if(proc.amount===null)return{ok:false,error:'COTAÇÃO DO DÓLAR NECESSÁRIA PARA CALCULAR A TAXA PIX / CARTÃO.'};return{ok:true,credit:false,base,amount,fee:proc.amount,total:amount+proc.amount,currency,method}}function renderTransactionValue(){const base=configuredValue();byId('transactionValue').value=base>0?fmtBRL(base):'';const prev=paymentPreview();if(!prev){byId('finalValue').textContent='';byId('feeInfo').textContent='SELECIONE JOGADOR, ITEM E FORMA DE PAGAMENTO.';return}if(!prev.ok){byId('finalValue').textContent='';byId('feeInfo').textContent=prev.error;return}byId('finalValue').textContent=StackupFinance.format(prev.total,prev.currency);byId('feeInfo').textContent=prev.credit?`VALOR BASE ${fmtBRL(prev.base)} • TAXA PLAYER CREDIT ${fmtBRL(prev.fee)}`:`VALOR BASE ${StackupFinance.format(prev.amount,prev.currency)} • TAXA ${prev.method==='CARD'?'CARTÃO':prev.method}: ${StackupFinance.format(prev.fee,prev.currency)}`}function renderHistory(){const rows=activeEventTransactions().slice(0,100);byId('historyList').innerHTML=rows.length?rows.map(t=>`<div class="listRow"><b>${t.playerName||'JOGADOR'} • ${t.itemCode||t.type||'TRANSAÇÃO'}</b><div class="meta">${new Date(t.createdAt).toLocaleString('pt-BR')} • ${fmtBRL(t.value||0)}${t.payment?.method?` • ${t.payment.method}`:''}${t.payment?.processingFeeAmount?` • TAXA ${StackupFinance.format(t.payment.processingFeeAmount,t.payment.currency)}`:''}</div></div>`).join(''):'<div class="empty">SEM TRANSAÇÕES NESTE TORNEIO.</div>'}function renderAll(){ensureRebuyRequests();renderSummary();renderTables();renderPlayerSelect();renderPlayer();renderRegistered();renderRebuyRequests();markSelections();renderTransactionValue();renderHistory()}
byId('playerSelect').onchange=()=>{selectedRequestId='';renderPlayer();renderTransactionValue()};document.querySelectorAll('.txItem').forEach(b=>b.onclick=()=>{selectedRequestId='';selectedItem=b.dataset.item;selectedType=b.dataset.type;markSelections();renderTransactionValue()});document.querySelectorAll('.payment').forEach(b=>b.onclick=()=>{selectedPayment=b.dataset.pay;markSelections();renderTransactionValue()});byId('transactionCurrency').onchange=renderTransactionValue;byId('registeredPlayers').onclick=()=>{byId('registeredList').classList.toggle('hidden');if(!byId('registeredList').classList.contains('hidden'))renderRegistered()};byId('historyButton').onclick=()=>{byId('historyList').classList.toggle('hidden');if(!byId('historyList').classList.contains('hidden'))renderHistory()};byId('chipCountAi').onclick=()=>{const p=currentPlayer(),q=new URLSearchParams({return:'players.html'});if(p)q.set('player',p.id);location.href='chip-count-ai.html?'+q.toString()};byId('eliminatePlayer').onclick=()=>{const p=currentPlayer();if(!p||p.status!=='active'||!authorized()||!ensureEvent())return;if(PokerOperations.bountyEnabled()){location.href=`bounty.html?target=${encodeURIComponent(p.id)}`;return}if(!confirm(`CONFIRMAR ELIMINAÇÃO DE ${p.name}?`))return;const r=PokerOperations.eliminatePlayer({playerId:p.id,staff:UI_STAFF,source:'MOVEMENTS_ELIMINATION'});byId('playerStatus').textContent=r.ok?`ELIMINAÇÃO DE ${p.name} REGISTRADA.`:(r.error||'NÃO FOI POSSÍVEL REGISTRAR A ELIMINAÇÃO.');renderAll()};byId('bountyPlayer').onclick=()=>{const p=currentPlayer();if(p&&PokerOperations.bountyEnabled())location.href=`bounty.html?target=${encodeURIComponent(p.id)}`};byId('recalculateBalancing').onclick=()=>{if(!authorized()||!ensureEvent())return;recomputeBalancePlan();saveState();byId('balancingStatus').textContent=state.balancePlan.length?`${state.balancePlan.length} MOVIMENTAÇÃO(ÕES) PENDENTE(S).`:'MESAS EQUILIBRADAS.';renderTables()};byId('confirmBalancing').onclick=()=>{if(!authorized()||!ensureEvent())return;const r=PokerOperations.applyBalancePlan({source:'MOVEMENTS'});byId('balancingStatus').textContent=r.ok?`${r.count} MOVIMENTAÇÃO(ÕES) CONFIRMADA(S).`:(r.error||'NÃO FOI POSSÍVEL CONFIRMAR.');renderAll()};byId('registerTransaction').onclick=()=>{const p=currentPlayer();if(!p||!selectedItem||!selectedPayment)return alert('SELECIONE JOGADOR, ITEM E FORMA DE PAGAMENTO.');if(!authorized()||!ensureEvent())return;const base=configuredValue();if(base<=0)return alert('VALOR DESTA OPERAÇÃO NÃO ESTÁ CONFIGURADO.');if(selectedType==='REENTRY'&&p.status==='active')return alert('RE-ENTRY SÓ PODE SER REGISTRADA PARA JOGADOR ELIMINADO.');if(selectedType!=='REENTRY'&&p.status!=='active')return alert('REBUY / ADD-ON EXIGE JOGADOR ATIVO.');const prev=paymentPreview();if(!prev?.ok)return alert(prev?.error||'NÃO FOI POSSÍVEL CALCULAR O PAGAMENTO.');let result,purchase=null;if(prev.credit){purchase=StackupWallet.purchase(playerForFee(p),base,{reference:selectedItem,eventId:state.eventId,type:selectedType,source:'MOVEMENTS_PANEL',operator:UI_STAFF.id});if(!purchase.ok)return alert(purchase.error);const payment={method:'CREDIT',currency:'BRL',amount:base,totalAmount:base,closingCurrency:'BRL',closingValue:base,totalClosingValue:base,context:selectedType,reference:selectedItem,recordedAt:Date.now(),creditFeeBRL:purchase.feeBRL,creditFeeRate:purchase.feeRate,totalDebitBRL:purchase.totalDebitBRL};result=PokerOperations.registerTransaction({playerId:p.id,type:selectedType,staff:UI_STAFF,payment,value:base,source:'MOVEMENTS_PANEL'});if(!result.ok){StackupWallet.move(playerForFee(p),{kind:'REFUND',valueBRL:purchase.totalDebitBRL,reference:`ESTORNO ${selectedItem}`,eventId:state.eventId,source:'MOVEMENTS_PANEL',meta:{operator:UI_STAFF.id}});return alert(result.error||'NÃO FOI POSSÍVEL REGISTRAR.')}}else{const payment=StackupFinance.paymentRecord({method:prev.method,currency:prev.currency,amount:prev.amount,context:selectedType,reference:selectedItem,player:playerForFee(p)});if(payment.processingFeeAmount===null)return alert('COTAÇÃO DO DÓLAR NECESSÁRIA PARA CALCULAR A TAXA.');payment.cardType=prev.method==='CARD'?selectedPayment:'';result=PokerOperations.registerTransaction({playerId:p.id,type:selectedType,staff:UI_STAFF,payment,value:base,source:'MOVEMENTS_PANEL'});if(!result.ok)return alert(result.error||'NÃO FOI POSSÍVEL REGISTRAR.')}result.transaction.itemCode=selectedItem;result.transaction.baseValue=base;if(selectedRequestId){const req=state.rebuyRequests.find(r=>r.id===selectedRequestId&&r.status==='PENDING'&&String(r.eventId||'')===String(state.eventId||''));if(req){req.status='CONFIRMED';req.confirmedAt=Date.now();req.confirmedBy=UI_STAFF.name;req.transactionId=result.transaction.id;auditEvent('REBUY_REQUEST_CONFIRMED',{source:'MOVEMENTS_PANEL',operator:UI_STAFF.id,requestId:req.id,playerId:req.playerId,playerName:req.playerName,rebuyKind:req.kind,transactionId:req.transactionId})}}saveState();selectedRequestId='';selectedItem='';selectedType='';selectedPayment='';renderAll()};
window.onPokerStateChange=renderAll;window.addEventListener('storage',renderAll);ensureRebuyRequests();renderAll();
</script></body></html>

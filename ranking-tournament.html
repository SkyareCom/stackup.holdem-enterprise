<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RANKING POR TORNEIOS</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.ey,.section{color:#8DFC3B;letter-spacing:.12em}.title{margin:5px 0 8px}.sub,.muted{color:#AEB8B1;font-size:12px;line-height:1.5}.section{font-size:12px;margin:18px 2px 8px}.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.current,.row,.empty{border:1px solid #27342D;border-radius:10px;background:linear-gradient(#0B100D,#060907);padding:12px}.crumb{color:#8DFC3B;font-size:12px;margin-bottom:4px}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center}.pos,.pts{color:#8DFC3B}.stageMeta{margin-top:3px}@media(max-width:700px){.filters{grid-template-columns:1fr}.row{grid-template-columns:42px minmax(0,1fr) auto}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">RANKING POR TORNEIOS</h1><div class="sub">HIERARQUIA: CLUBE / LIGA → TORNEIO → ETAPA. SELECIONE UMA ETAPA PARA VER O RANKING DELA OU TODAS AS ETAPAS PARA O ACUMULADO DO TORNEIO.</div><div class="section">HIERARQUIA</div><div class="filters"><select id="environment"></select><select id="tournament"></select><select id="stage"></select></div><div class="section">SELEÇÃO ATUAL</div><div id="current" class="current"></div><div class="section">CLASSIFICAÇÃO</div><div id="list" class="list"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script src="ranking-engine.js"></script><script>(()=>{if(!StackupAuth.guard())return;StackupRanking.ensure();const envEl=document.getElementById('environment'),tournamentEl=document.getElementById('tournament'),stageEl=document.getElementById('stage'),current=document.getElementById('current'),list=document.getElementById('list');const esc=v=>String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function envs(){return StackupRanking.environments()}function stages(){const tid=tournamentEl.value;return StackupRanking.stages().filter(s=>String(s.environmentId)===String(envEl.value)&&String(s.tournamentId)===String(tid))}function fillEnv(){const arr=envs();envEl.innerHTML='<option value="">CLUBE / LIGA</option>'+arr.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} • ${x.type==='LEAGUE'?'LIGA':'CLUBE'}</option>`).join('');const preferred=state.activeEnvironmentId||state.clubId||arr[0]?.id||'';if(arr.some(x=>String(x.id)===String(preferred)))envEl.value=preferred}function fillTournament(){const arr=StackupRanking.tournaments(envEl.value);tournamentEl.innerHTML='<option value="">TORNEIO</option>'+arr.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');if(!tournamentEl.value&&arr.length)tournamentEl.value=arr[0].id}function fillStage(){const arr=stages();stageEl.innerHTML='<option value="ALL">TODAS AS ETAPAS</option>'+arr.map(x=>`<option value="${esc(x.stageId)}">${esc(x.stageName)}</option>`).join('')}function render(){const env=envs().find(x=>String(x.id)===String(envEl.value)),tour=StackupRanking.tournaments(envEl.value).find(x=>String(x.id)===String(tournamentEl.value)),all=stages(),selected=stageEl.value==='ALL'?all:all.filter(x=>String(x.stageId)===String(stageEl.value));if(!env||!tour){current.innerHTML='<div class="muted">SELECIONE CLUBE / LIGA E TORNEIO.</div>';list.innerHTML='<div class="empty muted">NENHUMA CLASSIFICAÇÃO DISPONÍVEL.</div>';return}const rule=StackupRanking.findRule(env.id,tour.id);current.innerHTML=`<div class="crumb">${esc(env.name)} → ${esc(tour.name)}${stageEl.value==='ALL'?' → TODAS AS ETAPAS':` → ${esc(selected[0]?.stageName||'ETAPA')}`}</div><div class="muted">${selected.length} ETAPA(S) CONSIDERADA(S)${rule?.bestStages?` • MELHORES ${rule.bestStages} ETAPA(S)`:''}</div>`;const rows=StackupRanking.aggregate(selected,rule);list.innerHTML=rows.length?rows.map((p,i)=>`<div class="row"><div class="pos">${i+1}º</div><div><b>${esc(p.name)}</b><div class="muted stageMeta">${p.countedStages||p.stages} ETAPA(S) • ${p.wins} VITÓRIA(S)</div></div><div class="pts">${p.points} PTS</div></div>`).join(''):'<div class="empty muted">SEM JOGADORES/PONTUAÇÃO PARA A SELEÇÃO ATUAL.</div>'}envEl.onchange=()=>{fillTournament();fillStage();render()};tournamentEl.onchange=()=>{fillStage();render()};stageEl.onchange=render;fillEnv();fillTournament();fillStage();render();window.onPokerStateChange=()=>{fillEnv();fillTournament();fillStage();render()};window.addEventListener('storage',()=>{fillEnv();fillTournament();fillStage();render()})})();</script><script src="app-theme.js"></script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>TESTE VOZ NEURAL • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:760px;margin:auto;padding:18px}.ey{color:#8DFC3B;letter-spacing:.14em}.card{margin-top:18px;padding:14px;border:1px solid #27342D;border-radius:9px;background:linear-gradient(#0B100D,#060907)}button{width:100%!important;margin-top:12px}.status{margin-top:14px;white-space:pre-wrap;color:#8DFC3B}.bad{color:#ff6b6b}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1>TESTE DE VOZ NEURAL</h1><div class="card"><div>ESTE TESTE NÃO USA A VOZ ROBÓTICA DO NAVEGADOR. ELE CHAMA DIRETAMENTE O WORKER TTS.</div><button id="test">TESTAR VOZ NEURAL</button><div id="status" class="status">AGUARDANDO TESTE.</div></div></main><script src="app-language.js?v=9864a67"></script><script src="app-language-extra.js?v=2b08a68"></script><script src="app-language-final.js?v=9fbc2cd"></script><script>const ENDPOINT='https://throbbing-voice-b4e2.celsomurakami.workers.dev/speak';const btn=document.getElementById('test'),statusEl=document.getElementById('status');btn.onclick=async()=>{btn.disabled=true;statusEl.className='status';statusEl.textContent='SOLICITANDO VOZ NEURAL...';try{const lang=window.StackupAppLanguage?.get?.()||'pt';const sample=lang==='en'?'Attention players, new blinds level in one minute.':lang==='es'?'Atención jugadores, nuevo nivel de blinds en un minuto.':'Atenção jogadores, novo nível de blinds em um minuto.';const res=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:sample,voice:'cedar',language:lang,style:'tournament',speed:0.96})});const ct=res.headers.get('content-type')||'';if(!res.ok){const txt=await res.text();throw new Error('HTTP '+res.status+'\n'+txt)}if(!ct.includes('audio')){const txt=await res.text();throw new Error('RESPOSTA NÃO É ÁUDIO\n'+txt)}const blob=await res.blob();statusEl.textContent='HTTP 200 • ÁUDIO NEURAL RECEBIDO • REPRODUZINDO...';const url=URL.createObjectURL(blob),audio=new Audio(url);audio.onended=()=>{URL.revokeObjectURL(url);statusEl.textContent='SUCESSO • VOZ NEURAL REPRODUZIDA.'};audio.onerror=()=>{URL.revokeObjectURL(url);statusEl.className='status bad';statusEl.textContent='ÁUDIO RECEBIDO, MAS O NAVEGADOR NÃO CONSEGUIU REPRODUZIR.'};await audio.play()}catch(err){statusEl.className='status bad';statusEl.textContent='FALHA NO TTS\n'+(err&&err.message?err.message:String(err))}finally{btn.disabled=false}};</script><script src="app-theme.js"></script></body></html>

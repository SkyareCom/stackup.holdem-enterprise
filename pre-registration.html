<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PRÉ-INSCRIÇÃO • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:720px;margin:auto;padding:18px}.ey,.section{color:#8DFC3B;letter-spacing:.14em}.ey{font-size:10px}.title{font-size:24px;font-weight:800;margin:4px 0}.section{margin:18px 2px 8px}.btn,.primary{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;padding:10px 12px;border:1px solid #8DFC3B;border-radius:9px;background:#060907;color:#8DFC3B;text-decoration:none;font-weight:700}.primary:disabled{opacity:.45}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.field{width:100%;height:44px;min-height:44px;padding:10px;border:1px solid #27342D;border-radius:9px;background:linear-gradient(#0B100D,#060907);color:#AEB8B1;white-space:nowrap}.fieldCard{width:100%;height:44px;min-height:44px;display:flex;align-items:center;padding:10px;border:1px solid #27342D;border-radius:9px;background:linear-gradient(#0B100D,#060907);color:#AEB8B1;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.selectedSummary{margin:8px 2px 0;font-size:11px;color:#AEB8B1;line-height:1.6}.meta{font-size:11px;color:#AEB8B1;line-height:1.5}.money{font-size:20px;font-weight:800;color:#8DFC3B}.hidden{display:none!important}.status{margin-top:10px;font-size:11px}@media(max-width:620px){.grid{grid-template-columns:1fr}.title{font-size:20px}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><div class="title">PRÉ-INSCRIÇÃO</div><div class="section">JOGADOR</div><a class="btn" href="checkin-players.html?return=pre-registration.html">JÁ SOU CADASTRADO</a><button class="btn" id="newToggle" type="button" style="margin-top:8px">NOVO CADASTRO</button><div id="newBlock" class="hidden"><div class="section">CADASTRO</div><div class="grid"><input class="field" id="newName" placeholder="NOME"><input class="field" id="newCpf" placeholder="CPF"><input class="field" id="newPhone" placeholder="TELEFONE"><input class="field" id="newWhatsapp" placeholder="WHATSAPP"></div><button class="primary" id="createPlayer" type="button" style="margin-top:8px">CADASTRAR E CONTINUAR</button></div><div class="section">DADOS</div><div class="grid"><div class="fieldCard">NOME</div><div class="fieldCard">CPF</div><div class="fieldCard">TELEFONE</div><div class="fieldCard">WHATSAPP</div></div><div id="selectedSummary" class="selectedSummary"></div><div class="section">COMPRA ANTECIPADA</div><div class="grid"><div class="fieldCard">VALOR</div><div class="fieldCard">STATUS</div></div><div id="purchaseSummary" class="selectedSummary"></div><div class="section">PAGAMENTO</div><div class="grid"><select class="field" id="paymentMethod"><option value="PIX">PIX</option><option value="CARD">CARTÃO</option><option value="CREDIT">PLAYER CREDIT</option></select><select class="field" id="paymentCurrency"><option value="BRL">REAL</option><option value="PYG">GUARANI</option><option value="USD">DÓLAR</option><option value="ARS">PESO ARGENTINO</option><option value="EUR">EURO</option></select></div><div class="meta" style="margin-top:8px">VALOR NA MOEDA ESCOLHIDA</div><div class="money" id="paymentAmount">-</div><div class="meta" id="conversionInfo"></div><div class="meta" id="walletInfo"></div><button class="primary" id="confirmPrepay" type="button" disabled style="margin-top:10px">CONFIRMAR COMPRA ANTECIPADA</button><div id="result" class="status"></div></main><script src="shared.js"></script><script src="operations.js"></script><script src="finance-config.js"></script><script src="wallet-engine.js"></script><script>PokerOperations.ensure();const DIRECTORY_KEY='stackup-player-directory-v1',SELECTED_KEY='stackup-checkin-selected-player',PRE_KEY='stackup-pre-registrations-v1';let players=[],selected=null,pre=[];function load(){try{players=JSON.parse(localStorage.getItem(DIRECTORY_KEY)||'[]');if(!Array.isArray(players))players=[]}catch(e){players=[]}try{pre=JSON.parse(localStorage.getItem(PRE_KEY)||'[]');if(!Array.isArray(pre))pre=[]}catch(e){pre=[]}const id=localStorage.getItem(SELECTED_KEY);selected=id?players.find(p=>String(p.id)===String(id))||null:null}function persistPlayers(){localStorage.setItem(DIRECTORY_KEY,JSON.stringify(players))}function persistPre(){localStorage.setItem(PRE_KEY,JSON.stringify(pre))}function currentPre(){return selected?pre.find(x=>x.eventId===state.eventId&&String(x.directoryId)===String(selected.id)&&x.status!=='CANCELLED')||null:null}function creditPlayer(){return selected?{...selected,directoryId:selected.id}:null}function convertedAmount(){const total=PokerOperations.defaultTransactionValue('ENTRY');if(paymentMethod.value==='CREDIT')return total;return StackupFinance.convert(total,'BRL',paymentCurrency.value)}function render(){const cfg=StackupFinance.load(),amount=convertedAmount(),p=currentPre(),wallet=selected?StackupWallet.account(creditPlayer()):null,creditMode=paymentMethod.value==='CREDIT',total=PokerOperations.defaultTransactionValue('ENTRY'),quote=selected&&creditMode?StackupWallet.feeQuote(creditPlayer(),total,{eventId:state.eventId,type:'ENTRY'}):null,proc=selected&&!creditMode?StackupFinance.processingFee(paymentMethod.value,paymentCurrency.value,creditPlayer(),cfg):null;paymentCurrency.disabled=creditMode;selectedSummary.textContent=selected?`${selected.name||'-'} • CPF ${selected.cpf||'-'} • TEL ${selected.phone||'-'} • WHATSAPP ${selected.whatsapp||'-'}`:'';const shown=creditMode?amount:(amount===null||proc?.amount===null?null:amount+(proc?.amount||0));purchaseSummary.textContent=selected?`${shown===null?'COTAÇÃO NÃO CONFIGURADA':StackupFinance.format(shown,creditMode?'BRL':paymentCurrency.value)} • ${p?.status==='CHECKED_IN'?'CHECK-IN REALIZADO':p?'PAGO / CHECK-IN PENDENTE':'AGUARDANDO PAGAMENTO'}`:'';paymentAmount.textContent=shown===null?'COTAÇÃO NÃO CONFIGURADA':StackupFinance.format(shown,creditMode?'BRL':paymentCurrency.value);conversionInfo.textContent=creditMode&&quote?`${quote.reason} • CREDIT FEE ${Math.round(quote.rate*100)}% • DÉBITO TOTAL ${StackupFinance.format(quote.totalDebitBRL,'BRL')}`:`${proc?.amount?`PAYMENT FEE ${StackupFinance.format(proc.amount,paymentCurrency.value)} • `:''}FECHAMENTO: ${StackupFinance.CURRENCIES[cfg.closingCurrency].label}`;walletInfo.textContent=selected?`PLAYER CREDIT: ${StackupFinance.format(wallet?.balanceBRL||0,'BRL')}`:'';confirmPrepay.disabled=!selected||!!p||shown===null||(creditMode&&(+wallet?.balanceBRL||0)<(quote?.totalDebitBRL||total));result.textContent=p?.status==='CHECKED_IN'?'PRÉ-INSCRIÇÃO CONCLUÍDA E CHECK-IN REALIZADO.':p?`PAGAMENTO ${p.payment?.method||''} REGISTRADO • CHECK-IN PENDENTE.`:''}newToggle.onclick=()=>newBlock.classList.toggle('hidden');createPlayer.onclick=()=>{const name=newName.value.trim();if(!name)return alert('INFORME O NOME.');const p={id:'player-'+Date.now(),name,cpf:newCpf.value.trim(),phone:newPhone.value.trim(),whatsapp:newWhatsapp.value.trim(),email:'',instagram:'',birth:'',type:'REC',customerClass:'STANDART',team:'',info:[],createdAt:Date.now()};players.push(p);persistPlayers();localStorage.setItem(SELECTED_KEY,p.id);selected=p;StackupWallet.ensureAccount({...p,directoryId:p.id});newBlock.classList.add('hidden');[newName,newCpf,newPhone,newWhatsapp].forEach(x=>x.value='');render()};confirmPrepay.onclick=()=>{if(!selected||currentPre())return;const total=PokerOperations.defaultTransactionValue('ENTRY'),amount=convertedAmount(),creditMode=paymentMethod.value==='CREDIT';if(amount===null)return alert('CONFIGURE A COTAÇÃO DESTA MOEDA EM FINANÇAS.');let payment;if(creditMode){const debit=StackupWallet.purchase(creditPlayer(),total,{reference:'PRÉ-INSCRIÇÃO / BUY-IN',eventId:state.eventId,source:'PRE_REGISTRATION',type:'ENTRY'});if(!debit.ok)return alert(debit.error);payment={method:'CREDIT',currency:'BRL',amount:total,closingCurrency:'BRL',closingValue:total,context:'PRE_REGISTRATION',recordedAt:Date.now(),creditFeeBRL:debit.feeBRL,creditFeeRate:debit.feeRate,totalDebitBRL:debit.totalDebitBRL}}else{payment=StackupFinance.paymentRecord({method:paymentMethod.value,currency:paymentCurrency.value,amount,context:'PRE_REGISTRATION',player:creditPlayer()});if(payment.processingFeeAmount===null)return alert('CONFIGURE A COTAÇÃO DO DÓLAR PARA CALCULAR A TAXA PIX / CARTÃO.')}const breakdown=PokerOperations.transactionBreakdown('ENTRY',total);pre.unshift({id:'pre-'+Date.now(),eventId:state.eventId,directoryId:selected.id,playerName:selected.name||'',value:total,breakdown,payment,status:'PAID_CHECKIN_PENDING',paidAt:Date.now(),source:'ADVANCE_PURCHASE'});persistPre();render()};paymentCurrency.onchange=render;paymentMethod.onchange=render;window.addEventListener('storage',e=>{if([DIRECTORY_KEY,SELECTED_KEY,PRE_KEY,StackupFinance.KEY,StackupWallet.KEY,StackupWallet.CREDIT_FEES_KEY].includes(e.key)){load();render()}});window.addEventListener('stackup-wallet-change',render);load();render();</script></body></html>

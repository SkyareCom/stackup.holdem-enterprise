<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>SALA DE TRANSMISSÃO • STACKUP</title><link rel="stylesheet" href="app-theme.css"><link rel="stylesheet" href="typography-global.css"><style>body{margin:0;background:#020302;color:#fff;min-height:100vh}.app{width:min(980px,92vw);margin:0 auto;padding:24px 0}.ey{color:#8DFC3B;font-size:12px!important;letter-spacing:.08em}.title{font-size:20px!important;margin:5px 0 24px}.room{border:1px solid #27342D;border-radius:14px;background:linear-gradient(#0B100D,#060907);padding:18px}.label{color:#9CA69F;font-size:12px}.code{color:#8DFC3B;font-size:28px;letter-spacing:.16em;margin:8px 0}.status{color:#9CA69F;font-size:12px}.actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}.actions button,.actions a{width:100%;min-height:44px;padding:10px 12px;border:1px solid #8DFC3B;border-radius:9px;background:#060907;color:#8DFC3B;text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center}@media(max-width:700px){.app{width:calc(100vw - 24px);padding:18px 0}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><div class="title">SALA DE TRANSMISSÃO</div><section class="room"><div class="label">CÓDIGO DA SALA</div><div id="roomCode" class="code">------</div><div id="roomStatus" class="status">PREPARANDO SALA...</div><div class="actions"><button id="copyRoom" type="button">COPIAR CÓDIGO</button><button id="newRoom" type="button">NOVA SALA</button><a href="cast-connect.html">CONECTAR TELA</a></div></section></main><script src="shared.js"></script><script>const roomCode=document.getElementById('roomCode'),roomStatus=document.getElementById('roomStatus');const ROOM_KEY='stackup-cast-room-v1';const makeRoom=()=>String(100000+Math.floor(Math.random()*900000));function ensureRoom(){let room=String(localStorage.getItem(ROOM_KEY)||'').replace(/\D/g,'').slice(0,6);if(room.length!==6){room=makeRoom();localStorage.setItem(ROOM_KEY,room)}roomCode.textContent=room;roomStatus.textContent='SALA PRONTA';return room}const room=ensureRoom();copyRoom.onclick=async()=>{try{await navigator.clipboard.writeText(room);roomStatus.textContent='CÓDIGO COPIADO'}catch(_){roomStatus.textContent='CÓDIGO: '+room}};newRoom.onclick=()=>{localStorage.setItem(ROOM_KEY,makeRoom());location.reload()};</script></body></html>

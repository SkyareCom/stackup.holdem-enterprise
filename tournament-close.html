<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FECHAMENTO DO TORNEIO</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:820px;margin:auto;padding:18px}.ey,.section{color:#8DFC3B;letter-spacing:.14em}.ey{font-size:10px}.title{font-size:24px;font-weight:800;margin:4px 0}.section{margin:18px 2px 8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{padding:10px;border:1px solid #27342D;border-radius:9px;background:linear-gradient(#0B100D,#060907)}.k{font-size:10px;color:#AEB8B1}.v{font-size:18px;font-weight:800;margin-top:4px}.meta{font-size:11px;color:#AEB8B1;line-height:1.5}.row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #27342D}.row:last-child{border:0}.badge{font-size:9px;border:1px solid #27342D;border-radius:999px;padding:4px 7px}select,button{width:100%;min-height:44px;padding:10px;border-radius:9px;border:1px solid #27342D;background:#060907;color:#fff}.primary{background:#8DFC3B;color:#020302;border-color:#8DFC3B;font-weight:700}button:disabled{opacity:.4}.green{color:#8DFC3B}.red{color:#ff858d}@media(max-width:680px){.grid{grid-template-columns:1fr}.title{font-size:20px}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><div class="title">FECHAMENTO DO TORNEIO</div><button type="button" onclick="location.href='finance.html'">CAIXA</button><div class="section">REFERÊNCIA</div><div class="meta" id="closingInfo"></div><div class="section">RECONCILIAÇÃO</div><div class="grid"><div class="stat"><div class="k">SALDO PRIZE</div><div class="v" id="prizeBalance"></div></div><div class="stat"><div class="k">SALDO BOUNTY</div><div class="v" id="bountyBalance"></div></div><div class="stat"><div class="k">NÃO CLASSIFICADO</div><div class="v" id="unknown"></div></div></div><div class="section">CHECKLIST DE ENCERRAMENTO</div><div id="checks"></div><div class="section">RESPONSÁVEL AUTENTICADO</div><select id="staff" disabled></select><button id="settleBounty" type="button" style="margin-top:8px">LIQUIDAR SALDO FINAL DE BOUNTY PARA O VENCEDOR</button><button id="closeEvent" type="button" class="primary" style="margin-top:8px">ENCERRAR TORNEIO E GRAVAR SNAPSHOT</button><div id="feedback" class="meta" style="margin-top:8px"></div><div class="section">ÚLTIMO FECHAMENTO</div><div id="lastClose"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script src="operations.js"></script><script src="timer-engine.js"></script><script src="finance-config.js"></script><script>const PRE_KEY='stackup-pre-registrations-v1',funding=['ENTRY','REENTRY','REBUY','DOUBLE_REBUY','ADDON'],SESSION_STAFF=StackupAuth.staffForSession();function ensureClose(){ensureOperationalState();state.eventClosures=Array.isArray(state.eventClosures)?state.eventClosures:[]}function eventTx(){const e=String(state.eventId||'');return e?(state.transactions||[]).filter(t=>String(t.eventId||'')===e):[]}function currentPlayers(){return typeof currentTournamentPlayers==='function'?currentTournamentPlayers():[]}function currentActive(){return typeof activeTournamentPlayers==='function'?activeTournamentPlayers():currentPlayers().filter(p=>p.status==='active')}function preRegs(){let a=[];try{a=JSON.parse(localStorage.getItem(PRE_KEY)||'[]')}catch(e){}return Array.isArray(a)?a.filter(x=>String(x.eventId||'')===String(state.eventId||'')&&x.status==='PAID_CHECKIN_PENDING'):[]}function financeBRL(){let prize=0,bounty=0,payout=0,bountyPayout=0,unknown=0;for(const t of eventTx()){const v=+t.value||0,b=t.breakdown;if(b?.classification==='CLASSIFIED'){prize+=+b.prize||0;bounty+=+b.bounty||0}else if(funding.includes(t.type))unknown+=Math.abs(v);if(t.type==='PAYOUT')payout+=v;if(t.type==='BOUNTY_PAYOUT')bountyPayout+=v}for(const r of preRegs()){const b=r.breakdown;if(b?.classification==='CLASSIFIED'){prize+=+b.prize||0;bounty+=+b.bounty||0}else unknown+=Math.abs(+r.value||0)}return{prize,bounty,payout,bountyPayout,unknown,prizeBalance:prize-payout,bountyBalance:bounty-bountyPayout}}function cv(v){const cfg=StackupFinance.load();return StackupFinance.convert(v,'BRL',cfg.closingCurrency,cfg)}function fmt(v){const cfg=StackupFinance.load(),n=cv(v);return n===null?'COTAÇÃO PENDENTE':StackupFinance.format(n,cfg.closingCurrency)}function currentBalanceCount(){const event=String(state.eventId||'');return(state.balancePlan||[]).filter(m=>!m.eventId||String(m.eventId)===event).length}function checklist(){const f=financeBRL(),active=currentActive(),balance=currentBalanceCount(),cfg=StackupFinance.load(),ratesOk=['BRL',cfg.closingCurrency].every(c=>c==='BRL'||(+cfg.ratesToBRL[c]||0)>0),configured=!!state.eventId&&!!state.tournamentName,alreadyClosed=(state.eventClosures||[]).some(c=>String(c.eventId||'')===String(state.eventId||''));return[{name:'TORNEIO ATIVO',ok:configured&&!alreadyClosed,detail:alreadyClosed?'ESTE TORNEIO JÁ FOI ENCERRADO.':configured?state.tournamentName:'NENHUM TORNEIO SELECIONADO.'},{name:'COTAÇÃO DE FECHAMENTO',ok:ratesOk,detail:ratesOk?`${StackupFinance.CURRENCIES[cfg.closingCurrency].label} CONFIGURADO.`:'COTAÇÃO DA MOEDA DE FECHAMENTO NÃO CONFIGURADA.'},{name:'TIMER PARADO',ok:!state.running,detail:state.running?'PAUSE O RELÓGIO ANTES DO FECHAMENTO.':'RELÓGIO PARADO.'},{name:'FIELD FINAL',ok:active.length<=1,detail:`${active.length} JOGADOR(ES) ATIVO(S) NESTE TORNEIO.`},{name:'BALANCING',ok:balance===0,detail:balance?`${balance} MOVIMENTAÇÃO(ÕES) PENDENTE(S).`:'SEM BALANCING PENDENTE.'},{name:'LEDGER CLASSIFICADO',ok:f.unknown===0,detail:f.unknown?`${fmt(f.unknown)} SEM CLASSIFICAÇÃO.`:'NENHUM VALOR NÃO CLASSIFICADO.'},{name:'PRIZE LIQUIDADO',ok:Math.abs(f.prizeBalance)<0.01,detail:`SALDO ${fmt(f.prizeBalance)}.`},{name:'BOUNTY LIQUIDADO',ok:!PokerOperations.bountyEnabled()||Math.abs(f.bountyBalance)<0.01,detail:PokerOperations.bountyEnabled()?`SALDO ${fmt(f.bountyBalance)}.`:'NÃO APLICÁVEL.'}]}function selectedStaff(){return SESSION_STAFF||null}function canClose(s){return !!s&&['GESTOR','OWNER','TD'].includes(s.role)}function settle(){const s=selectedStaff(),f=financeBRL(),winner=currentActive()[0]||null;if(!canClose(s)){feedback.textContent='RESPONSÁVEL AUTENTICADO SEM PERMISSÃO PARA LIQUIDAÇÃO.';return}if(!state.eventId){feedback.textContent='NENHUM TORNEIO SELECIONADO.';return}if(!PokerOperations.bountyEnabled()||!winner||f.bountyBalance<=0){feedback.textContent='NÃO HÁ SALDO DE BOUNTY DISPONÍVEL PARA LIQUIDAÇÃO.';return}const payout=f.bountyBalance,now=Date.now(),tx={id:'tx-'+now+'-'+Math.random().toString(36).slice(2,7),eventId:state.eventId,operator:s.id,playerId:winner.id,playerName:winner.name,type:'BOUNTY_PAYOUT',value:payout,breakdown:{prize:0,fee:0,bounty:0,bountyPayout:payout,payout:0,total:payout,classification:'BOUNTY_PAYOUT'},createdAt:now,source:'TOURNAMENT_CLOSE'};state.transactions.unshift(tx);winner.bountyWinnings=(+winner.bountyWinnings||0)+payout;winner.currentBounty=0;auditEvent('BOUNTY_FINAL_SETTLED',{operator:s.id,playerId:winner.id,value:payout,source:'TOURNAMENT_CLOSE'});saveState();feedback.textContent=`${fmt(payout)} DE BOUNTY FINAL LIQUIDADOS PARA ${winner.name}.`;render()}function closeTournament(){ensureClose();const s=selectedStaff(),rows=checklist();if(!canClose(s)){feedback.textContent='APENAS GESTOR / OWNER / TD AUTENTICADO PODE ENCERRAR O TORNEIO.';return}if(!rows.every(r=>r.ok)){feedback.textContent='EXISTEM BLOQUEIOS NO CHECKLIST.';return}if(!confirm('CONFIRMAR ENCERRAMENTO DEFINITIVO DESTE TORNEIO?'))return;const raw=financeBRL(),cfg=StackupFinance.load(),active=currentActive(),winner=active[0]||null,players=currentPlayers(),now=Date.now(),converted={prize:cv(raw.prize),bounty:cv(raw.bounty),payout:cv(raw.payout),bountyPayout:cv(raw.bountyPayout),unknown:cv(raw.unknown),prizeBalance:cv(raw.prizeBalance),bountyBalance:cv(raw.bountyBalance)},snapshot={id:'close-'+now,eventId:state.eventId,tournamentName:state.tournamentName,format:state.tournamentFormat,environmentId:state.activeEnvironmentId||state.clubId||'',environmentName:state.activeEnvironmentName||state.clubName||'',environmentType:state.activeEnvironmentType||'',closedAt:now,closedBy:s.id,closedByName:s.name,winnerId:winner?.id||null,winnerName:winner?.name||'',playerCount:players.length,financeBRL:raw,finance:converted,closingCurrency:cfg.closingCurrency,centralBank:cfg.centralBank,rateDate:cfg.rateDate,rateSnapshot:{...cfg.ratesToBRL},paymentCount:eventTx().filter(t=>t.payment).length+preRegs().filter(r=>r.payment).length,transactionCount:eventTx().length};state.eventClosures.unshift(snapshot);state.tournamentStatus='CLOSED';state.status='CLOSED';state.closedAt=now;state.closedBy=s.id;state.running=false;state.prepared=false;state.balancePlan=[];try{localStorage.removeItem('stackupActiveTournamentId')}catch(_){}auditEvent('TOURNAMENT_CLOSED',{operator:s.id,closedByName:s.name,eventId:state.eventId,source:'TOURNAMENT_CLOSE'});saveState();feedback.textContent='TORNEIO ENCERRADO E SNAPSHOT FINANCEIRO GRAVADO.';render()}function render(){ensureClose();PokerOperations.ensure();const cfg=StackupFinance.load(),f=financeBRL();closingInfo.textContent=state.eventId?`${state.tournamentName||'TORNEIO'} • MOEDA: ${StackupFinance.CURRENCIES[cfg.closingCurrency].label} • BANCO CENTRAL: ${StackupFinance.BANKS[cfg.centralBank].label}${cfg.rateDate?' • '+cfg.rateDate:''}`:'NENHUM TORNEIO SELECIONADO.';prizeBalance.textContent=fmt(f.prizeBalance);bountyBalance.textContent=fmt(f.bountyBalance);unknown.textContent=fmt(f.unknown);const rows=checklist();checks.innerHTML=rows.map(r=>`<div class="row"><div class="${r.ok?'green':'red'}">${r.ok?'✓':'×'}</div><div><b>${r.name}</b><div class="meta">${r.detail}</div></div><div class="badge">${r.ok?'OK':'BLOQUEIO'}</div></div>`).join('');staff.innerHTML=SESSION_STAFF?`<option value="${SESSION_STAFF.id}">${SESSION_STAFF.name} • ${SESSION_STAFF.role}</option>`:'<option value="">SEM SESSÃO AUTENTICADA</option>';settleBounty.disabled=!canClose(SESSION_STAFF)||!state.eventId||!PokerOperations.bountyEnabled()||f.bountyBalance<=0||state.tournamentStatus==='CLOSED';closeEvent.disabled=!canClose(SESSION_STAFF)||!rows.every(r=>r.ok)||state.tournamentStatus==='CLOSED';const c=(state.eventClosures||[]).find(x=>String(x.eventId||'')===String(state.eventId||''))||(state.eventClosures||[])[0];lastClose.innerHTML=c?`<b>${c.tournamentName}</b><div class="meta">${new Date(c.closedAt).toLocaleString('pt-BR')} • ${c.closedByName} • ${StackupFinance.CURRENCIES[c.closingCurrency||'BRL']?.label||'REAL'} • ${c.paymentCount||0} PAGAMENTOS</div>`:'<div class="meta">NENHUM FECHAMENTO REGISTRADO.</div>'}settleBounty.onclick=settle;closeEvent.onclick=closeTournament;window.addEventListener('storage',render);window.onPokerStateChange=render;render();</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>TV • STACKUP</title><style>@import url('https://fonts.googleapis.com/css2?family=Caacupe+One:wght@400&display=swap');*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020302;color:#fff;font-family:'Caacupe One',system-ui,sans-serif;text-transform:uppercase}.app{width:min(620px,calc(100vw - 24px));margin:auto;padding:24px 0}.ey{color:#8DFC3B;font-size:12px;font-weight:400;letter-spacing:.14em}.title{font-size:20px;font-weight:400;margin:5px 0 18px}.box{border:1px solid #27342D;border-radius:9px;background:linear-gradient(#0B100D,#060907);padding:14px}.label{color:#8DFC3B;font-size:12px;font-weight:400;letter-spacing:.08em;margin-bottom:8px}.code{width:100%;height:64px;border:1px solid #27342D;border-radius:9px;background:#020302;color:#fff;text-align:center;font:400 30px 'Caacupe One',system-ui,sans-serif;letter-spacing:.18em;outline:none}.code:focus{border-color:#8DFC3B}.hint,.status{color:#9CA69F;font-size:12px;line-height:1.4;margin:8px 0 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.actions button{min-height:44px;border:1px solid #8DFC3B;border-radius:9px;background:#060907;color:#8DFC3B;font:400 12px 'Caacupe One',system-ui,sans-serif;text-transform:uppercase;cursor:pointer}.actions button.primary{background:#060907;color:#8DFC3B}.error{min-height:18px;color:#ff858d;font-size:12px;margin-top:8px}@media(max-width:560px){.actions{grid-template-columns:1fr}.app{padding:18px 0}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><div class="title">CONECTAR TELA</div><section class="box"><div class="label">CÓDIGO DA SALA</div><input id="room" class="code" inputmode="numeric" maxlength="6" autocomplete="off" autofocus placeholder="000000"><div class="hint">DIGITE OS 6 DÍGITOS MOSTRADOS NO CELULAR DO GESTOR.</div><div class="actions"><button id="cast" class="primary" type="button">CONFIRMAR CAST OFICIAL</button><button id="ft" type="button">CONFIRMAR MESA FINAL</button></div><div id="error" class="error"></div></section></main><script src="ui-standard.js?v=707265684f91c0a577ab56d2a6da22b6c2be5441"></script><script>const input=document.getElementById('room'),error=document.getElementById('error');const clean=v=>String(v||'').replace(/\D/g,'').slice(0,6);input.value=clean(new URLSearchParams(location.search).get('room'));input.oninput=()=>{input.value=clean(input.value);error.textContent=''};function go(file){const room=clean(input.value);if(room.length!==6){error.textContent='INFORME OS 6 DÍGITOS DA SALA.';input.focus();return}try{localStorage.setItem('stackup-cast-room-v1',room)}catch(_){}input.readOnly=true;const cb=Date.now();location.href=file+'?room='+encodeURIComponent(room)+'&role=viewer&cb='+cb}document.getElementById('cast').onclick=()=>go('cast-10px.html');document.getElementById('ft').onclick=()=>go('cast-ft-live.html');input.onkeydown=e=>{if(e.key==='Enter')go('cast-10px.html')};</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM DE JOGADORES • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:820px;margin:auto;padding:18px}.card{background:#0a0f0c;border:1px solid #26342c;border-radius:14px;padding:12px;margin:10px 0}.section{color:#8DFC3B;font-size:12px;letter-spacing:.12em;margin:18px 2px 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select,textarea,button{width:100%;min-height:44px;padding:10px;border-radius:9px;font-size:12px}input,select,textarea{background:#060907;border:1px solid #304038;color:#fff}.row{padding:10px 0;border-bottom:1px solid #1d2721}.row:last-child{border-bottom:0}.meta{font-size:11px;color:#AEB8B1;line-height:1.45}.badge{display:inline-block;padding:3px 6px;border:1px solid #35513d;border-radius:999px;color:#8DFC3B;font-size:9px}.preview{white-space:pre-wrap;background:#060907;border:1px solid #223027;border-radius:10px;padding:10px;margin-top:8px;font-size:11px}@media(max-width:620px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">CRM DE JOGADORES</h1><div class="card"><div class="meta">RANKING, DESEMPENHO, FIDELIDADE E CAMPANHAS PROMOCIONAIS USAM A MESMA BASE GERAL DE JOGADORES.</div></div><div class="section">PERFIL / FEEDBACK</div><div class="card" id="players"></div><div class="section">NOVA CAMPANHA</div><div class="card"><div class="grid"><input id="campaignTitle" placeholder="TÍTULO DA CAMPANHA"><select id="campaignKind"><option value="TOURNAMENT">NOVO TORNEIO</option><option value="BUYIN_PROMO">PROMOÇÃO BUY-IN</option><option value="LOYALTY">CLUBE DE FIDELIDADE</option><option value="RANKING">RANKING / DESEMPENHO</option></select></div><textarea id="campaignBody" placeholder="MENSAGEM" style="margin-top:8px"></textarea><button class="primary" id="createCampaign" type="button" style="margin-top:8px">CONFIRMAR CAMPANHA</button></div><div class="section">CAMPANHAS</div><div class="card" id="campaigns"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script src="player-profile-engine.js"></script><script>const DIRECTORY_KEY='stackup-player-directory-v1';const esc=v=>String(v??'').replace(/[<>]/g,'');function directory(){return StackupPlayerProfile?.directory?.()||[]}function linked(d){return StackupPlayerProfile?.tournamentPlayersForDirectory?.(d)||[]}function transactions(d){const ids=new Set(linked(d).map(p=>String(p.id)));return(state.transactions||[]).filter(t=>ids.has(String(t.playerId))&&!['CANCELLED','VOID'].includes(String(t.status||'').toUpperCase()))}function performance(d){const tx=transactions(d),invested=tx.filter(t=>!['PAYOUT','BOUNTY_PAYOUT','REFUND','ADJUSTMENT_CREDIT','BONUS'].includes(String(t.type||''))).reduce((a,t)=>a+(+t.value||0),0),payout=tx.filter(t=>['PAYOUT','BOUNTY_PAYOUT'].includes(String(t.type||''))).reduce((a,t)=>a+(+t.value||0),0),profit=payout-invested,events=new Set(tx.map(t=>String(t.eventId||'')).filter(Boolean));const ranks=(state.rankings||[]).filter(r=>linked(d).some(p=>String(r.playerId||'')===String(p.id))||String(r.directoryId||'')===String(d.id)).sort((a,b)=>(+a.position||999999)-(+b.position||999999));return{invested,payout,profit,roi:invested?profit/invested*100:0,entries:events.size,rankingPoints:ranks.reduce((a,r)=>a+(+r.points||0),0),rankingPosition:+ranks[0]?.position||0}}function loyalty(d){state.loyaltyAccounts=Array.isArray(state.loyaltyAccounts)?state.loyaltyAccounts:[];let x=state.loyaltyAccounts.find(a=>String(a.directoryId||'')===String(d.id));if(!x){x={directoryId:d.id,points:0,tier:'BASE',updatedAt:Date.now()};state.loyaltyAccounts.push(x)}return x}function phone(d){return String(d.whatsapp||d.phone||'').trim()}function feedbackMsg(d){const p=performance(d),l=loyalty(d);return `${state.activeEnvironmentName||state.clubName||'STACKUP'}\nOLÁ, ${d.name||'JOGADOR'}.\n\nRANKING: ${p.rankingPosition?p.rankingPosition+'º':'-'} • ${p.rankingPoints} PTS\nTORNEIOS: ${p.entries}\nINVESTIDO: ${fmtCurrency(p.invested)}\nPREMIAÇÕES: ${fmtCurrency(p.payout)}\nROI: ${p.roi.toFixed(1)}%\nFIDELIDADE: ${l.points} PTS • ${l.tier}`}
function persistDirectory(arr){localStorage.setItem(DIRECTORY_KEY,JSON.stringify(arr))}function setMarketing(id,value){const arr=directory(),d=arr.find(x=>String(x.id)===String(id));if(!d)return;d.marketingConsent=!!value;d.marketingConsentAt=value?Date.now():null;linked(d).forEach(p=>{p.marketingConsent=!!value;p.marketingConsentAt=d.marketingConsentAt});persistDirectory(arr);auditEvent('PLAYER_MARKETING_CONSENT',{directoryId:d.id,value:!!value});saveState()}
function renderPlayers(){const arr=directory();players.innerHTML='';if(!arr.length){players.innerHTML='<div class="meta">NENHUM JOGADOR CADASTRADO NA BASE GERAL.</div>';return}arr.slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'pt-BR')).forEach(d=>{const p=performance(d),l=loyalty(d),row=document.createElement('div');row.className='row';row.innerHTML=`<b>${esc(d.name||'JOGADOR')}</b> <span class="badge">${d.marketingConsent?'MARKETING OK':'SEM OPT-IN'}</span><div class="meta">RANKING ${p.rankingPosition||'-'} • ${p.rankingPoints} PTS • ROI ${p.roi.toFixed(1)}% • FIDELIDADE ${l.points} PTS</div><div class="grid" style="margin-top:8px"><label class="meta"><input type="checkbox" data-marketing="${esc(d.id)}" ${d.marketingConsent?'checked':''}> ACEITA PROMOÇÕES E NOVIDADES</label><button type="button" data-feedback="${esc(d.id)}">GERAR FEEDBACK</button></div><div class="preview" data-preview="${esc(d.id)}" style="display:none"></div>`;players.appendChild(row)});players.querySelectorAll('[data-marketing]').forEach(i=>i.onchange=()=>{setMarketing(i.dataset.marketing,i.checked);renderPlayers()});players.querySelectorAll('[data-feedback]').forEach(b=>b.onclick=()=>{const d=directory().find(x=>String(x.id)===String(b.dataset.feedback));if(!d)return;const box=players.querySelector(`[data-preview="${CSS.escape(String(d.id))}"]`),text=feedbackMsg(d);box.style.display='block';box.textContent=text;enqueueMessage({playerId:linked(d)[0]?.id||null,recipient:phone(d),kind:'PLAYER_FEEDBACK',body:text,category:'TRANSACTIONAL',source:'CRM',dedupeKey:'feedback-'+d.id+'-'+Date.now()});saveState()})}
function renderCampaigns(){state.campaigns=Array.isArray(state.campaigns)?state.campaigns:[];campaigns.innerHTML='';if(!state.campaigns.length){campaigns.innerHTML='<div class="meta">NENHUMA CAMPANHA CRIADA.</div>';return}const eligible=directory().filter(d=>d.marketingConsent&&phone(d)).length;state.campaigns.slice().reverse().forEach(c=>{const row=document.createElement('div');row.className='row';row.innerHTML=`<b>${esc(c.title)}</b> <span class="badge">${esc(c.kind)}</span><div class="meta">${eligible} JOGADOR(ES) ELEGÍVEL(IS) POR OPT-IN</div><div class="preview">${esc(c.body)}</div><button type="button" data-queue="${esc(c.id)}" style="margin-top:8px">ENFILEIRAR PARA JOGADORES COM OPT-IN</button>`;campaigns.appendChild(row)});campaigns.querySelectorAll('[data-queue]').forEach(b=>b.onclick=()=>{const c=state.campaigns.find(x=>String(x.id)===String(b.dataset.queue));if(!c)return;let n=0;directory().filter(d=>d.marketingConsent&&phone(d)).forEach(d=>{if(enqueueMessage({playerId:linked(d)[0]?.id||null,recipient:phone(d),kind:c.kind,body:c.body,category:'MARKETING',source:'CRM',dedupeKey:`campaign-${c.id}-${d.id}`}))n++});c.queuedAt=Date.now();c.queuedCount=n;auditEvent('CAMPAIGN_QUEUED',{campaignId:c.id,count:n});saveState();renderCampaigns()})}
createCampaign.onclick=()=>{const title=campaignTitle.value.trim(),body=campaignBody.value.trim();if(!title||!body)return alert('INFORME TÍTULO E MENSAGEM DA CAMPANHA.');state.campaigns=Array.isArray(state.campaigns)?state.campaigns:[];state.campaigns.push({id:'camp-'+Date.now(),title,kind:campaignKind.value,body,createdAt:Date.now(),status:'draft'});auditEvent('CAMPAIGN_CREATED',{title,kind:campaignKind.value});saveState();campaignTitle.value='';campaignBody.value='';renderCampaigns()};function render(){renderPlayers();renderCampaigns()}render();window.onPokerStateChange=render;window.addEventListener('storage',render);</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOGADORES • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.ey{color:#8DFC3B;letter-spacing:.14em}.card{background:transparent!important;border:0!important;border-radius:0!important;padding:0!important;margin:10px 0!important;box-shadow:none!important}.section{color:#8DFC3B;letter-spacing:.14em;margin:16px 2px 7px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}input,select,button{width:100%;padding:10px;border-radius:9px}input,select{background:linear-gradient(#0B100D,#060907);border:1px solid #27342D;color:#fff;box-sizing:border-box}.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;align-items:stretch}.check{display:flex;align-items:center;justify-content:flex-start;gap:10px;width:100%;min-height:44px;margin:0;padding:10px 12px;border:1px solid #27342D!important;border-radius:9px;background:linear-gradient(#0B100D,#060907)!important;color:#fff!important;box-sizing:border-box}.check input{appearance:none;-webkit-appearance:none;flex:0 0 18px!important;width:18px!important;height:18px!important;min-width:18px!important;margin:0!important;padding:0!important;border:1px solid #8DFC3B!important;border-radius:4px!important;background:#060907!important}.check input:checked{background:#8DFC3B!important;box-shadow:inset 0 0 0 4px #060907!important}.historyBtn{margin-top:18px;min-height:44px}.history{margin-top:8px}.historyRow{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid #27342D}.historyRow:last-child{border-bottom:0}.historyRow>.pick{width:18px!important;height:18px!important;margin-top:4px}.historyInfo{min-width:0}.meta{color:#AEB8B1;line-height:1.5}.badge{display:inline-block;padding:3px 7px;border:1px solid #27342D;border-radius:999px;color:#8DFC3B;margin-right:4px}.historyActions,.inlineActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.inlineGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.inlineGrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}.inlineChecks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}.inlineEditor{grid-column:1/-1}.danger{color:#ff858d!important}.hidden{display:none!important}.directoryBtn{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;margin-top:8px;padding:10px 12px;border:1px solid #8DFC3B;border-radius:9px;color:#8DFC3B;text-decoration:none;background:#060907;box-sizing:border-box}@media(max-width:700px){.grid,.grid3,.inlineGrid,.inlineGrid3{grid-template-columns:minmax(0,1fr)}.checks,.inlineChecks{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:390px){.checks,.inlineChecks{grid-template-columns:minmax(0,1fr)}}</style></head><body><main class="app"><div class="top"><div><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1>JOGADORES</h1></div></div><div class="section">CADASTRO DE JOGADORES</div><div class="card"><a class="directoryBtn" href="smart-registration.html?return=players-directory.html">CADASTRAR POR DOCUMENTO • IA</a><div class="grid" style="margin-top:8px"><input id="playerNameInput" placeholder="NOME COMPLETO"><input id="cpf" placeholder="CPF"></div><div class="grid3" style="margin-top:8px"><input id="birth" type="text" inputmode="numeric" maxlength="14" placeholder="DD / MM / AAAA" aria-label="DATA DE NASCIMENTO"><input id="phone" placeholder="TELEFONE"><input id="whatsapp" placeholder="WHATSAPP"></div><div class="grid" style="margin-top:8px"><input id="email" type="email" placeholder="E-MAIL"><input id="instagram" placeholder="INSTAGRAM"></div><div class="grid" style="margin-top:8px"><select id="type"><option value="PRO">PRO</option><option value="REG">REG</option><option value="REC">REC</option></select><input id="team" placeholder="TIME / EQUIPE"></div><div class="section">RECEBIMENTO DE INFORMAÇÕES</div><div class="checks"><label class="check"><input id="infoWhats" type="checkbox"><span>WHATSAPP</span></label><label class="check"><input id="infoSms" type="checkbox"><span>SMS</span></label><label class="check"><input id="infoEmail" type="checkbox"><span>E-MAIL</span></label></div><button class="primary" id="save" type="button" style="margin-top:10px">CONFIRMAR</button></div><button class="historyBtn" id="historyBtn" type="button">CADASTRO GERAL DE JOGADORES</button><div id="playerHistory" class="history hidden"><div id="list"></div><div class="historyActions"><button id="editSelected" type="button">EDITAR</button><button id="deleteSelected" class="danger" type="button">APAGAR</button></div></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script src="app-theme.js?v=4a85dc79db89d35869d25d9d3ed55cc6f0b86569"></script><script>const KEY='stackup-player-directory-v1',playerNameInput=document.getElementById('playerNameInput'),playerHistory=document.getElementById('playerHistory');let players=[],inlineEditingId='';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));try{players=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(players))players=[]}catch(e){players=[]}function persist(){localStorage.setItem(KEY,JSON.stringify(players))}function formatBirth(v){const d=String(v||'').replace(/\D/g,'').slice(0,8);return d.length<=2?d:d.length<=4?d.slice(0,2)+' / '+d.slice(2):d.slice(0,2)+' / '+d.slice(2,4)+' / '+d.slice(4)}function validBirth(v){const m=String(v||'').match(/^(\d{2}) \/ (\d{2}) \/ (\d{4})$/);if(!m)return false;const day=+m[1],month=+m[2],year=+m[3],dt=new Date(year,month-1,day);return dt.getFullYear()===year&&dt.getMonth()===month-1&&dt.getDate()===day}birth.oninput=()=>{birth.value=formatBirth(birth.value)};function displayBirth(v){if(/^\d{4}-\d{2}-\d{2}$/.test(v||'')){const[y,m,d]=v.split('-');return`${d} / ${m} / ${y}`}return v||'-'}function selectedIds(){return [...document.querySelectorAll('[data-pick]:checked')].map(x=>x.dataset.pick)}function typeOptions(selected){return['PRO','REG','REC'].map(t=>`<option value="${t}" ${t===selected?'selected':''}>${t}</option>`).join('')}function check(label,key,checked){return `<label class="check"><input data-f="${key}" type="checkbox" ${checked?'checked':''}><span>${label}</span></label>`}function displayRow(p){return `<div class="historyRow" data-row="${esc(p.id)}"><input class="pick" type="checkbox" data-pick="${esc(p.id)}"><div class="historyInfo"><b>${esc(p.name)}</b> <span class="badge">${esc(p.type)}</span>${p.team?`<span class="badge">${esc(p.team)}</span>`:''}<div class="meta">CPF: ${esc(p.cpf||'-')} • NASCIMENTO: ${esc(displayBirth(p.birth))}<br>TELEFONE: ${esc(p.phone||'-')} • WHATSAPP: ${esc(p.whatsapp||'-')}<br>${esc(p.email||'-')} • ${esc(p.instagram||'-')}<br>RECEBE: ${esc((p.info||[]).join(', ')||'NÃO DEFINIDO')}</div></div></div>`}function editorRow(p){const info=p.info||[];return `<div class="historyRow" data-row="${esc(p.id)}"><input class="pick" type="checkbox" data-pick="${esc(p.id)}" checked><div class="historyInfo inlineEditor"><div class="inlineGrid"><input data-f="name" value="${esc(p.name)}" placeholder="NOME COMPLETO"><input data-f="cpf" value="${esc(p.cpf||'')}" placeholder="CPF"></div><div class="inlineGrid3"><input data-f="birth" inputmode="numeric" maxlength="14" value="${esc(displayBirth(p.birth)==='-'?'':displayBirth(p.birth))}" placeholder="DD / MM / AAAA"><input data-f="phone" value="${esc(p.phone||'')}" placeholder="TELEFONE"><input data-f="whatsapp" value="${esc(p.whatsapp||'')}" placeholder="WHATSAPP"></div><div class="inlineGrid"><input data-f="email" type="email" value="${esc(p.email||'')}" placeholder="E-MAIL"><input data-f="instagram" value="${esc(p.instagram||'')}" placeholder="INSTAGRAM"></div><div class="inlineGrid"><select data-f="type">${typeOptions(p.type||'PRO')}</select><input data-f="team" value="${esc(p.team||'')}" placeholder="TIME / EQUIPE"></div><div class="inlineChecks">${check('WHATSAPP','infoWhats',info.includes('WHATSAPP'))}${check('SMS','infoSms',info.includes('SMS'))}${check('E-MAIL','infoEmail',info.includes('EMAIL'))}</div><div class="inlineActions"><button class="primary" type="button" data-inline-confirm="${esc(p.id)}">CONFIRMAR</button><button type="button" data-inline-cancel="${esc(p.id)}">CANCELAR</button></div></div></div>`}function bindInline(){document.querySelectorAll('[data-f="birth"]').forEach(i=>i.oninput=()=>{i.value=formatBirth(i.value)});document.querySelectorAll('[data-inline-confirm]').forEach(b=>b.onclick=()=>confirmInline(b.dataset.inlineConfirm));document.querySelectorAll('[data-inline-cancel]').forEach(b=>b.onclick=()=>{inlineEditingId='';render()})}function render(){const arr=players.slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'pt-BR'));list.innerHTML=arr.length?arr.map(p=>p.id===inlineEditingId?editorRow(p):displayRow(p)).join(''):'<div class="meta">NENHUM JOGADOR CADASTRADO.</div>';bindInline()}function clearForm(){[playerNameInput,cpf,birth,phone,whatsapp,email,instagram,team].forEach(x=>x.value='');[infoWhats,infoSms,infoEmail].forEach(x=>x.checked=false);type.value='PRO'}function confirmInline(id){const row=document.querySelector(`[data-row="${CSS.escape(id)}"]`),p=players.find(x=>String(x.id)===String(id));if(!row||!p)return;const get=f=>row.querySelector(`[data-f="${f}"]`),birthVal=get('birth').value;if(!get('name').value.trim())return alert('INFORME O NOME.');if(birthVal&&!validBirth(birthVal))return alert('INFORME A DATA DE NASCIMENTO NO FORMATO DD / MM / AAAA.');Object.assign(p,{name:get('name').value.trim(),cpf:get('cpf').value.trim(),birth:birthVal,phone:get('phone').value.trim(),whatsapp:get('whatsapp').value.trim(),email:get('email').value.trim(),instagram:get('instagram').value.trim(),type:get('type').value,team:get('team').value.trim(),info:[get('infoWhats').checked?'WHATSAPP':'',get('infoSms').checked?'SMS':'',get('infoEmail').checked?'EMAIL':''].filter(Boolean)});persist();inlineEditingId='';render()}historyBtn.onclick=()=>{playerHistory.classList.toggle('hidden');if(!playerHistory.classList.contains('hidden'))render()};editSelected.onclick=()=>{const ids=selectedIds();if(ids.length!==1)return alert('SELECIONE APENAS UM JOGADOR PARA EDITAR.');inlineEditingId=ids[0];render();document.querySelector(`[data-row="${CSS.escape(inlineEditingId)}"] [data-f="name"]`)?.focus()};deleteSelected.onclick=()=>{const ids=selectedIds();if(!ids.length)return alert('SELECIONE AO MENOS UM JOGADOR.');players=players.filter(p=>!ids.includes(String(p.id))&&!ids.includes(p.id));if(ids.includes(inlineEditingId))inlineEditingId='';persist();render()};save.onclick=()=>{if(!playerNameInput.value.trim())return alert('INFORME O NOME.');if(birth.value&&!validBirth(birth.value))return alert('INFORME A DATA DE NASCIMENTO NO FORMATO DD / MM / AAAA.');players.push({id:'player-'+Date.now(),name:playerNameInput.value.trim(),cpf:cpf.value.trim(),birth:birth.value,phone:phone.value.trim(),whatsapp:whatsapp.value.trim(),email:email.value.trim(),instagram:instagram.value.trim(),type:type.value,team:team.value.trim(),info:[infoWhats.checked?'WHATSAPP':'',infoSms.checked?'SMS':'',infoEmail.checked?'EMAIL':''].filter(Boolean),createdAt:Date.now()});persist();clearForm();render()};render();</script><script src="finance-config.js?v=524a18d68c1dd94b1beaca8dd2018f2708f88afe"></script><script src="wallet-engine.js?v=a69484d645c6f11c0b033ae0fc15eed94ffc3c3a"></script><script src="player-profile-engine.js"></script><script data-player-history src="player-directory-history.js"></script></body></html>

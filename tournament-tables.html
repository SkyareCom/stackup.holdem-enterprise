<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>LISTA DE MESAS • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.ey{color:#8DFC3B;letter-spacing:.14em}.title{margin:4px 0 6px}.sub{color:#AEB8B1;margin-bottom:18px}.topActions{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:18px}.topActions button{width:100%;min-height:44px;padding:10px;border:1px solid #8DFC3B;border-radius:9px;background:#060907;color:#8DFC3B}.tables{display:grid;gap:10px}.tableCard{border:1px solid #27342D;border-radius:10px;background:linear-gradient(#0B100D,#060907);overflow:hidden}.tableHead{padding:12px 14px;border-bottom:1px solid #27342D;color:#8DFC3B;display:flex;align-items:center;justify-content:space-between;gap:12px}.tableHead .meta{color:#fff;text-align:right}.players{display:grid}.playerRow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #18201B}.playerRow:last-child{border-bottom:0}.seat{min-width:34px;color:#8DFC3B}.name{flex:1}.empty{padding:18px;color:#AEB8B1;text-align:center}@media(max-width:700px){.tableHead{align-items:flex-start;flex-direction:column}.tableHead .meta{text-align:left}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">LISTA DE MESAS</h1><div id="eventName" class="sub"></div><div class="topActions"><button id="backBtn" type="button">VOLTAR À GESTÃO DE TORNEIOS</button></div><div id="tablesRoot" class="tables"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard('control.html')</script><script>(()=>{const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),pad=v=>String(Math.max(0,+v||0)).padStart(2,'0');function grouped(){const g={};for(const p of currentTournamentPlayers()){if(String(p.status||'').toLowerCase()!=='active'||!p.seatedAt||!p.table)continue;const t=String(+p.table||p.table);(g[t]??=[]).push(p)}return g}function render(){const g=grouped(),keys=Object.keys(g).sort((a,b)=>(+a||0)-(+b||0));$('eventName').textContent=state.tournamentName||'TORNEIO';$('tablesRoot').innerHTML=keys.length?keys.map(k=>{const ps=g[k].slice().sort((a,b)=>(+a.seat||0)-(+b.seat||0));return `<section class="tableCard"><div class="tableHead"><b>MESA ${pad(k)} - ATIVA - ${pad(ps.length)} JOGADORES</b><span class="meta"></span></div><div class="players">${ps.map(p=>`<div class="playerRow"><span class="seat">${pad(p.seat)}</span><span class="name">${esc(p.name||'JOGADOR')}</span></div>`).join('')}</div></section>`}).join(''):'<div class="empty">NENHUMA MESA ATIVA.</div>'}document.getElementById('backBtn').onclick=()=>location.href='control.html';window.addEventListener('storage',render);const prior=window.onPokerStateChange;window.onPokerStateChange=s=>{if(typeof prior==='function')prior(s);render()};render()})();</script></body></html>

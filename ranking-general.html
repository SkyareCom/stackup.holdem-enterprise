<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RANKING POR LIGAS • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.ey,.section{color:#8DFC3B;letter-spacing:.12em}.title{margin:5px 0 8px}.sub,.muted{color:#AEB8B1;font-size:12px;line-height:1.5}.section{font-size:12px;margin:18px 2px 8px}.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.summary,.row,.empty{border:1px solid #27342D;border-radius:10px;background:linear-gradient(#0B100D,#060907);padding:12px}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center}.pos,.pts,.crumb{color:#8DFC3B}.crumb{margin-bottom:4px}.meta{margin-top:3px}@media(max-width:700px){.filters{grid-template-columns:1fr}.row{grid-template-columns:42px minmax(0,1fr) auto}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">RANKING POR LIGAS</h1><div class="sub">UMA LIGA PODE AGRUPAR VÁRIOS TORNEIOS, E CADA TORNEIO PODE TER MÚLTIPLAS ETAPAS. O RANKING DA LIGA CONSOLIDA ESSA HIERARQUIA SEM MISTURAR OUTROS AMBIENTES.</div><div class="section">LIGA / PERÍODO</div><div class="filters"><select id="league"></select><select id="tournament"><option value="ALL">TODOS OS TORNEIOS</option></select><select id="period"><option value="ALL">TODO O HISTÓRICO</option><option value="YEAR">ANO ATUAL</option><option value="SEMESTER">SEMESTRE ATUAL</option></select></div><div class="section">ESCOPO</div><div id="summary" class="summary"></div><div class="section">CLASSIFICAÇÃO</div><div id="list" class="list"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script src="ranking-engine.js"></script><script>(()=>{if(!StackupAuth.guard())return;StackupRanking.ensure();const leagueEl=document.getElementById('league'),tourEl=document.getElementById('tournament'),periodEl=document.getElementById('period'),summary=document.getElementById('summary'),list=document.getElementById('list');const esc=v=>String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function leagues(){return StackupRanking.environments().filter(x=>x.type==='LEAGUE')}function fillLeague(){const arr=leagues();leagueEl.innerHTML='<option value="">SELECIONE A LIGA</option>'+arr.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');const preferred=String(state.activeEnvironmentType||'').toUpperCase()==='LEAGUE'?(state.activeEnvironmentId||state.clubId||''):'';if(arr.some(x=>String(x.id)===String(preferred)))leagueEl.value=preferred;else if(arr.length)leagueEl.value=arr[0].id}function fillTournaments(){const current=tourEl.value,arr=StackupRanking.tournaments(leagueEl.value);tourEl.innerHTML='<option value="ALL">TODOS OS TORNEIOS</option>'+arr.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');tourEl.value=arr.some(x=>String(x.id)===String(current))?current:'ALL'}function inPeriod(s){const d=new Date(+s.at||Date.now()),now=new Date();if(periodEl.value==='YEAR')return d.getFullYear()===now.getFullYear();if(periodEl.value==='SEMESTER')return d.getFullYear()===now.getFullYear()&&Math.floor(d.getMonth()/6)===Math.floor(now.getMonth()/6);return true}function render(){const league=leagues().find(x=>String(x.id)===String(leagueEl.value));if(!league){summary.innerHTML='<div class="muted">NENHUMA LIGA CADASTRADA OU SELECIONADA.</div>';list.innerHTML='<div class="empty muted">SEM CLASSIFICAÇÃO.</div>';return}const all=StackupRanking.stages().filter(s=>String(s.environmentId)===String(league.id)&&inPeriod(s)),selected=tourEl.value==='ALL'?all:all.filter(s=>String(s.tournamentId)===String(tourEl.value)),leagueRule=StackupRanking.findRule(league.id,'');const tournaments=new Set(selected.map(s=>s.tournamentId));summary.innerHTML=`<div class="crumb">${esc(league.name)} → ${tourEl.value==='ALL'?'TODOS OS TORNEIOS':esc(StackupRanking.tournaments(league.id).find(x=>String(x.id)===String(tourEl.value))?.name||'TORNEIO')} → ${selected.length} ETAPA(S)</div><div class="muted">${tournaments.size} TORNEIO(S) CONSIDERADO(S)${leagueRule?.bestStages?` • MELHORES ${leagueRule.bestStages} ETAPA(S) POR JOGADOR`:''}</div>`;const rows=StackupRanking.aggregate(selected,leagueRule);list.innerHTML=rows.length?rows.map((p,i)=>`<div class="row"><div class="pos">${i+1}º</div><div><b>${esc(p.name)}</b><div class="muted meta">${p.countedStages||p.stages} ETAPA(S) • ${p.wins} VITÓRIA(S) • ${p.podiums} PÓDIO(S)</div></div><div class="pts">${p.points} PTS</div></div>`).join(''):'<div class="empty muted">SEM PONTUAÇÃO REGISTRADA PARA A LIGA E O PERÍODO SELECIONADOS.</div>'}leagueEl.onchange=()=>{fillTournaments();render()};tourEl.onchange=render;periodEl.onchange=render;fillLeague();fillTournaments();render();window.onPokerStateChange=()=>{fillLeague();fillTournaments();render()};window.addEventListener('storage',()=>{fillLeague();fillTournaments();render()})})();</script><script src="app-theme.js"></script></body></html>

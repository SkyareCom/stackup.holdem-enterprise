<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>CADASTRAR AMBIENTE • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>@import url('https://fonts.googleapis.com/css2?family=Caacupe+One:wght@400&display=swap');*{box-sizing:border-box}html,body,body *,button,input,select,option{font-family:'Caacupe One',system-ui,sans-serif!important;font-style:normal!important;font-weight:400!important;letter-spacing:1px!important;text-transform:uppercase}body{margin:0;background:#020302;color:#fff;min-height:100vh}.app{width:min(980px,92vw);margin:0 auto;padding:24px 0}.ey{color:#8DFC3B;font-size:12px!important;letter-spacing:.08em}.title{font-size:20px!important;margin:5px 0 24px}.section{color:#8DFC3B;font-size:14px;margin:0 2px 8px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select,button{width:100%;min-height:44px;padding:10px 12px;border-radius:9px;font-size:12px}input,select{background:linear-gradient(#0B100D,#060907);color:#fff;border:1px solid #27342D}button{background:#060907;color:#8DFC3B;border:1px solid #8DFC3B}.primary{background:#8DFC3B;color:#020302;margin-top:8px}.notice{margin-top:8px;color:#AEB8B1;font-size:12px;line-height:1.45}.notice.error{color:#ffb1b6}@media(max-width:700px){.app{width:calc(100vw - 24px);padding:18px 0}.formGrid{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><div class="title" id="environmentTitle">CADASTRAR AMBIENTE</div><div class="section">DADOS DO AMBIENTE</div><div class="formGrid"><input id="newClubName" placeholder="NOME DO CLUBE / HOME GAME / LIGA" autocomplete="organization"><select id="newClubType" aria-label="TIPO DE AMBIENTE"><option value="CLUB">CLUBE</option><option value="HOME_GAME">HOME GAME</option><option value="LEAGUE">LIGA</option></select></div><button id="createClub" class="primary" type="button">CONFIRMAR</button><div id="environmentNotice" class="notice" role="status" aria-live="polite"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script src="inline-interactions-v1.js"></script><script>if(StackupAuth.guard()){ensureOperationalState();StackupAuth.ensure();const q=new URLSearchParams(location.search),editId=q.get('edit')||'',slug=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'ambiente',key=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLocaleUpperCase('pt-BR'),editing=editId?(state.authClubs||[]).find(c=>String(c.id)===String(editId)&&c.active!==false):null;const show=(text,error=false)=>{environmentNotice.textContent=text;environmentNotice.className='notice'+(error?' error':'')};if(editId&&!editing){show('AMBIENTE NÃO ENCONTRADO.',true);createClub.disabled=true}else if(editing){environmentTitle.textContent='EDITAR AMBIENTE';newClubName.value=editing.name||'';newClubType.value=editing.type||'CLUB'}createClub.onclick=()=>{const n=newClubName.value.trim(),type=newClubType.value;if(!n){show('INFORME O NOME DO AMBIENTE.',true);newClubName.focus();return}const duplicate=(state.authClubs||[]).find(c=>c.active!==false&&String(c.id)!==String(editId)&&key(c.name)===key(n));if(duplicate){show('JÁ EXISTE UM AMBIENTE ATIVO COM ESTE NOME.',true);newClubName.focus();return}if(editing){editing.name=n;editing.type=type;editing.updatedAt=Date.now();let pinnedId='';try{pinnedId=localStorage.getItem('stackup-active-environment-v1')||''}catch(_){ }if(String(state.activeEnvironmentId||'')===String(editing.id)||String(pinnedId)===String(editing.id)){state.activeEnvironmentId=editing.id;state.activeEnvironmentName=n;state.activeEnvironmentType=type;state.clubId=editing.id;state.clubName=n;try{localStorage.setItem('stackup-active-environment-v1',String(editing.id))}catch(_){ }}saveState();location.href='environment-registered.html';return}const id='club-'+slug(n)+'-'+Date.now().toString(36).slice(-4);state.authClubs=Array.isArray(state.authClubs)?state.authClubs:[];state.authClubs.push({id,name:n,type,active:true,createdAt:Date.now()});saveState();location.href='environment-registered.html'}};</script><script src="app-theme.js"></script></body></html>

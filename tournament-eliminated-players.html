<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>JOGADORES ELIMINADOS • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.ey{color:#8DFC3B;letter-spacing:.14em}.title{margin:4px 0 6px}.sub{color:#AEB8B1;margin-bottom:18px}.topActions{margin-bottom:18px}.topActions button{width:100%}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border:1px solid #27342D;border-radius:9px;background:linear-gradient(#0B100D,#060907)}.pos{color:#8DFC3B}.name{color:#fff}.meta{color:#AEB8B1;text-align:right}.empty{padding:18px;color:#AEB8B1;text-align:center}@media(max-width:700px){.row{grid-template-columns:48px 1fr}.meta{grid-column:2;text-align:left}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">JOGADORES ELIMINADOS</h1><div id="eventName" class="sub"></div><div class="topActions"><button id="backBtn" type="button">VOLTAR À GESTÃO DE TORNEIOS</button></div><div id="root" class="list"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard('control.html')</script><script>(()=>{const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),pad=v=>String(Math.max(0,+v||0)).padStart(2,'0'),cpf=p=>String(p?.cpf||p?.document||p?.identity?.cpf||'');function rows(){return currentTournamentPlayers().filter(p=>['eliminated','out','busted'].includes(String(p.status||'').toLowerCase())).sort((a,b)=>(+a.finishPosition||999999)-(+b.finishPosition||999999)||(+b.eliminatedAt||0)-(+a.eliminatedAt||0))}function render(){const list=rows();$('e

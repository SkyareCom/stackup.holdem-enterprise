<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STACKUP TV</title><link href="https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020302;color:#fff;font-family:'Caacupe One',sans-serif;overflow:hidden}.pair{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle,#14200f 0,#080b07 45%,#020302 80%)}.box{display:flex;align-items:center;gap:5vw}.brand{color:#8dfc3b;font-size:3.2vw}.title{font-size:2.2vw;margin:1vw 0}.code{font-size:8vw;letter-spacing:1vw;color:#8dfc3b}.hint{font-size:1.5vw;opacity:.85}.status{font-size:1.4vw;color:#8dfc3b;margin-top:1vw}.qr{background:#fff;padding:16px;border-radius:12px}#cast{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;background:#020302}</style></head><body><div class="pair" id="pair"><div class="box"><div><div class="brand">STACKUP HOLD'EM ENTERPRISE</div><div class="title">CONECTAR TELÃO</div><div class="code" id="code">------</div><div class="hint">ESCANEIE O QR CODE COM O CELULAR</div><div class="status" id="status">AGUARDANDO CONEXÃO...</div></div><div class="qr" id="qr"></div></div></div><iframe id="cast" src="../cast-10px.html?tv=1" allow="fullscreen"></iframe><script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>const KEY='poker-club-state-v4';const code=String(Math.floor(100000+Math.random()*900000));document.getElementById('code').textContent=code;const connectUrl=new URL('../tv-connect.html',location.href);connectUrl.searchParams.set('code',code);new QRCode(document.getElementById('qr'),{text:connectUrl.href,width:220,height:220});const status=document.getElementById('status'),pair=document.getElementById('pair'),cast=document.getElementById('cast');function unlockCast(){try{const d=cast.contentDocument;const enter=d&&d.getElementById('enter');if(enter)enter.style.setProperty('display','none','important');const rotate=d&&d.querySelector('.rotate');if(rotate)rotate.style.setProperty('display','none','important')}catch(_){}}cast.addEventListener('load',unlockCast);const peer=new Peer('stackup-tv-'+code);peer.on('open',()=>status.textContent='AGUARDANDO CONEXÃO...');peer.on('connection',conn=>{status.textContent='CONECTANDO...';conn.on('data',data=>{if(!data||data.type!=='state'||!data.state)return;localStorage.setItem(KEY,JSON.stringify(data.state));unlockCast();if(cast.style.display!=='block'){cast.style.display='block';pair.style.display='none'}try{cast.contentWindow.postMessage({type:'STACKUP_TV_STATE',state:data.state},location.origin)}catch(_){}});conn.on('open',()=>{status.textContent='CONECTADO';conn.send({type:'ready'})});conn.on('close',()=>{cast.style.display='none';pair.style.display='flex';status.textContent='CONEXÃO ENCERRADA — ESCANEIE NOVAMENTE'})});peer.on('error',()=>status.textContent='RECONECTANDO...');</script></body></html>

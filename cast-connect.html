<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>CONECTAR CAST • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff;min-height:100vh}.app{width:min(620px,92vw);margin:0 auto;padding:28px 0}.ey{color:#8DFC3B;font-size:12px!important;font-weight:600!important;letter-spacing:.08em}.title{font-size:22px!important;font-weight:600!important;margin:6px 0 26px}.box{border:1px solid #27342D;border-radius:14px;background:linear-gradient(#0B100D,#060907);padding:20px}.label{color:#8DFC3B;font-size:11px!important;font-weight:600!important;letter-spacing:.08em;margin-bottom:10px}.code{width:100%;height:64px;border:1px solid #3A4A40;border-radius:10px;background:#020302;color:#fff;text-align:center;font-size:32px!important;letter-spacing:.22em;box-sizing:border-box;outline:none}.code:focus{border-color:#8DFC3B}.hint{color:#9CA69F;font-size:12px!important;line-height:1.4;margin:10px 0 18px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{width:100%;min-height:50px;border:1px solid #8DFC3B;border-radius:9px;background:linear-gradient(#0B100D,#060907);color:#8DFC3B;font-size:13px!important;font-weight:600!important}.actions button.primary{background:#8DFC3B;color:#020302}.error{min-height:20px;color:#ff7a7a;font-size:12px!important;margin-top:12px;text-align:center}@media(max-width:560px){.actions{grid-template-columns:1fr}.app{padding:18px 0}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">CONECTAR TELA</h1><section class="box"><div class="label">CÓDIGO DA SALA</div><input id="room" class="code" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000"><div class="hint">DIGITE O CÓDIGO DE 6 DÍGITOS MOSTRADO NO CELULAR DO GESTOR.</div><div class="actions"><button id="cast" class="primary" type="button">CONFIRMAR CAST OFICIAL</button><button id="ft" type="button">CONFIRMAR MESA FINAL</button></div><div id="error" class="error"></div></section></main><script src="ui-standard.js?v=707265684f91c0a577ab56d2a6da22b6c2be5441"></script><script>const input=document.getElementById('room'),error=document.getElementById('error');input.value=(new URLSearchParams(location.search).get('room')||localStorage.getItem('stackup-cast-room-v1')||'').replace(/\D/g,'').slice(0,6);input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,6);error.textContent=''});function go(file){const room=input.value.replace(/\D/g,'');if(room.length!==6){error.textContent='INFORME OS 6 DÍGITOS DA SALA.';input.focus();return}localStorage.setItem('stackup-cast-room-v1',room);location.href=file+'?room='+encodeURIComponent(room)+'&role=viewer&cb='+Date.now()}document.getElementById('cast').onclick=()=>go('cast-10px.html');document.getElementById('ft').onclick=()=>go('cast-ft-live.html');input.addEventListener('keydown',e=>{if(e.key==='Enter')go('cast-10px.html')});</script></body></html>

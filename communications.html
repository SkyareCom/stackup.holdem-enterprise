<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COMUNICAÇÃO COM JOGADORES • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>:root{--bg:#020302;--panel:#0a0f0c;--line:#26342c;--text:#f5f7f5;--muted:#96a099;--green:#8DFC3B;--red:#ff6069}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.app{max-width:760px;margin:auto;padding:18px}.ey{font-size:10px;color:var(--green);letter-spacing:.14em}.title{font-size:24px;margin-top:3px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.section{font-size:11px;color:var(--green);letter-spacing:.13em;margin:18px 2px 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.label{font-size:10px;color:#b3bcb6;margin-bottom:5px}.meta{font-size:11px;color:#aab3ad;line-height:1.45}input,select,button{width:100%;min-height:44px;border-radius:9px;padding:10px;font-size:12px}input,select{background:#060907;border:1px solid #304038;color:#fff}.player{padding:11px 0;border-bottom:1px solid #1d2721}.player:last-child{border:0}.head{display:flex;justify-content:space-between;gap:10px;align-items:start}.name{font-size:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.preview{white-space:pre-wrap;background:#060907;border:1px solid #223027;border-radius:10px;padding:10px;margin-top:8px;font-size:11px;color:#dfe6e1;line-height:1.45}.log{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #1d2721}.badge{display:inline-block;padding:3px 6px;border-radius:999px;border:1px solid #35513d;color:var(--green);font-size:9px}@media(max-width:620px){.grid,.actions{grid-template-columns:1fr}.title{font-size:20px}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE • MENSAGENS</div><div class="title">COMUNICAÇÃO</div><div class="card"><div class="meta">A POSIÇÃO E O EXTRATO USAM O TORNEIO ATIVO. ALTERAÇÕES DE TELEFONE SÃO SINCRONIZADAS COM A BASE GERAL DO JOGADOR.</div></div><div class="section">JOGADORES / CONTATO</div><div class="card" id="players"></div><div class="section">HISTÓRICO DE MENSAGENS</div><div class="card" id="logs"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script>const DIRECTORY_KEY='stackup-player-directory-v1';state.players=Array.isArray(state.players)?state.players:[];state.transactions=Array.isArray(state.transactions)?state.transactions:[];state.messageLog=Array.isArray(state.messageLog)?state.messageLog:[];const eventOf=p=>String(p?.eventId||p?.validationEventId||'');function currentPlayers(){const e=String(state.eventId||'');if(!e)return[];return state.players.filter(p=>eventOf(p)===e)}function eventTx(pid){return state.transactions.filter(t=>String(t.eventId||'')===String(state.eventId||'')&&String(t.playerId||'')===String(pid))}function fin(pid){const tx=eventTx(pid),invested=tx.filter(t=>!['PAYOUT','BOUNTY_PAYOUT'].includes(t.type)).reduce((a,t)=>a+(+t.value||0),0),payout=tx.filter(t=>['PAYOUT','BOUNTY_PAYOUT'].includes(t.type)).reduce((a,t)=>a+(+t.value||0),0),profit=payout-invested,roi=invested?profit/invested*100:0;return{invested,payout,profit,roi,tx}}function typeLabel(t){return({ENTRY:'ENTRADA',REENTRY:'REENTRADA',REBUY:'REBUY',DOUBLE_REBUY:'REBUY DUPLO',ADDON:'ADD-ON',PAYOUT:'PREMIAÇÃO',BOUNTY_PAYOUT:'BOUNTY'})[t]||t}function seatingMsg(p){return `${state.clubName||'STACKUP'}\n${state.tournamentName||'TORNEIO'}\n\nOLÁ, ${p.nickname||p.name}.\nSUA POSIÇÃO ATUAL É:\nMESA ${p.table||'-'} • ASSENTO ${p.seat||'-'}\n\nBOA SORTE!`}function accountMsg(p){const f=fin(p.id),lines=f.tx.slice().reverse().map(t=>`${typeLabel(t.type)}: ${fmtCurrency(t.value)}`);return `${state.clubName||'STACKUP'}\n${state.tournamentName||'TORNEIO'}\n\n${p.nickname||p.name}, SEU EXTRATO ATUALIZADO:\n${lines.length?lines.join('\n'):'NENHUMA COMPRA REGISTRADA.'}\n\nTOTAL INVESTIDO: ${fmtCurrency(f.invested)}\nPREMIAÇÕES: ${fmtCurrency(f.payout)}\nRESULTADO: ${fmtCurrency(f.profit)}\nROI: ${f.roi.toFixed(1)}%`}function fullMsg(p){return seatingMsg(p)+'\n\n----------------\n\n'+accountMsg(p)}function cleanPhone(v){return String(v||'').replace(/\D/g,'')}function syncDirectoryPhone(p,value){let arr=[];try{arr=JSON.parse(localStorage.getItem(DIRECTORY_KEY)||'[]');if(!Array.isArray(arr))arr=[]}catch(_){return}const cpf=String(p.directoryCpf||'').replace(/\D/g,''),d=arr.find(x=>String(x.id)===String(p.directoryId||''))||arr.find(x=>cpf&&String(x.cpf||'').replace(/\D/g,'')===cpf);if(!d)return;d.phone=value;if(!d.whatsapp)d.whatsapp=value;localStorage.setItem(DIRECTORY_KEY,JSON.stringify(arr))}function logMessage(p,channel,kind,text){state.messageLog.unshift({id:'msg-'+Date.now(),eventId:state.eventId,playerId:p.id,playerName:p.name,channel,kind,text,createdAt:Date.now()});saveState();renderLogs()}function sendWhatsApp(p,kind){const phone=cleanPhone(p.phone);if(!phone){alert('CADASTRE O TELEFONE DO JOGADOR.');return}const text=kind==='seat'?seatingMsg(p):kind==='account'?accountMsg(p):fullMsg(p);logMessage(p,'WHATSAPP',kind,text);location.href=`https://wa.me/${phone}?text=${encodeURIComponent(text)}`}function sendSms(p,kind){const phone=cleanPhone(p.phone);if(!phone){alert('CADASTRE O TELEFONE DO JOGADOR.');return}const text=kind==='seat'?seatingMsg(p):kind==='account'?accountMsg(p):fullMsg(p);logMessage(p,'SMS',kind,text);location.href=`sms:${phone}?body=${encodeURIComponent(text)}`}function renderPlayers(){players.innerHTML='';const arr=currentPlayers();if(!arr.length){players.innerHTML='<div class="meta">NENHUM JOGADOR NO TORNEIO ATIVO.</div>';return}arr.slice().reverse().forEach(p=>{const d=document.createElement('div');d.className='player';d.innerHTML=`<div class="head"><div><div class="name">${p.name}${p.nickname?` • ${p.nickname}`:''}</div><div class="meta">${p.status==='active'?`MESA ${p.table} • ASSENTO ${p.seat}`:'ELIMINADO'} • ${fmtCurrency(fin(p.id).invested)} INVESTIDOS</div></div><span class="badge">${p.phone?'CONTATO OK':'SEM TELEFONE'}</span></div><div class="grid" style="margin-top:8px"><div><div class="label">TELEFONE / WHATSAPP</div><input data-phone="${p.id}" placeholder="(00) 00000-0000" value="${p.phone||''}"></div><div><div class="label">MENSAGEM</div><select data-kind="${p.id}"><option value="seat">MESA + ASSENTO</option><option value="account">EXTRATO ATUALIZADO</option><option value="full">POSIÇÃO + EXTRATO</option></select></div></div><div class="actions"><button type="button" data-wa="${p.id}">WHATSAPP</button><button type="button" data-sms="${p.id}">SMS</button></div><div class="preview" data-preview="${p.id}"></div>`;players.appendChild(d)});players.querySelectorAll('[data-phone]').forEach(i=>i.onchange=()=>{const p=state.players.find(x=>String(x.id)===String(i.dataset.phone));if(p){p.phone=i.value.trim();syncDirectoryPhone(p,p.phone);saveState();renderPlayers()}});players.querySelectorAll('[data-kind]').forEach(s=>s.onchange=()=>updatePreview(s.dataset.kind));players.querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>{const p=state.players.find(x=>String(x.id)===String(b.dataset.wa)),s=players.querySelector(`[data-kind="${CSS.escape(String(p.id))}"]`);sendWhatsApp(p,s.value)});players.querySelectorAll('[data-sms]').forEach(b=>b.onclick=()=>{const p=state.players.find(x=>String(x.id)===String(b.dataset.sms)),s=players.querySelector(`[data-kind="${CSS.escape(String(p.id))}"]`);sendSms(p,s.value)});arr.forEach(p=>updatePreview(p.id))}function updatePreview(id){const p=state.players.find(x=>String(x.id)===String(id));if(!p)return;const s=players.querySelector(`[data-kind="${CSS.escape(String(id))}"]`),box=players.querySelector(`[data-preview="${CSS.escape(String(id))}"]`);if(!s||!box)return;box.textContent=s.value==='seat'?seatingMsg(p):s.value==='account'?accountMsg(p):fullMsg(p)}function renderLogs(){logs.innerHTML='';const rows=state.messageLog.filter(m=>String(m.eventId||'')===String(state.eventId||''));if(!rows.length){logs.innerHTML='<div class="meta">NENHUMA MENSAGEM REGISTRADA PARA ESTE TORNEIO.</div>';return}rows.slice(0,80).forEach(m=>{const d=document.createElement('div');d.className='log';d.innerHTML=`<div><b>${m.playerName}</b><div class="meta">${m.channel} • ${m.kind==='seat'?'MESA/ASSENTO':m.kind==='account'?'EXTRATO':'POSIÇÃO + EXTRATO'} • ${new Date(m.createdAt).toLocaleString('pt-BR')}</div></div><span class="badge">REGISTRADO</span>`;logs.appendChild(d)})}function render(){renderPlayers();renderLogs()}window.onPokerStateChange=render;window.addEventListener('storage',render);render();</script></body></html>

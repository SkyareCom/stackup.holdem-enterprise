<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>ATIVAR DEALER • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.ey,.section{color:#8DFC3B;letter-spacing:.14em}.title{margin:4px 0 24px}.section{margin:18px 2px 7px}.infoCard{height:44px;min-height:44px;padding:10px;border:1px solid #27342D;border-radius:9px;background:linear-gradient(#0B100D,#060907);display:flex;align-items:center;justify-content:space-between;gap:10px;box-sizing:border-box}.label{color:#AEB8B1;white-space:nowrap}.value{margin-left:auto;white-space:nowrap}.dealerGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.dealerBtn{width:100%;height:44px!important;min-height:44px!important}.dealerBtn.active{background:#8DFC3B!important;color:#020302!important}.assignGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.assignGrid input{width:100%;min-height:44px}.toggleRow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.toggle.active{background:#8DFC3B!important;color:#020302!important}.release{width:100%;height:44px!important;min-height:44px!important}.result{margin-top:8px;color:#AEB8B1;line-height:1.5}.result.ok{color:#8DFC3B}.linkBox{display:none;margin-top:10px}.linkBox.show{display:grid;gap:8px}.linkValue{word-break:break-all;padding:10px;border:1px solid #27342D;border-radius:9px;background:#060907;color:#AEB8B1;font-size:12px}.topActions{margin-bottom:18px}.topActions button{width:100%}@media(max-width:700px){.dealerGrid,.assignGrid,.toggleRow{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">ATIVAR DEALER</h1><div class="topActions"><button id="backBtn" type="button">VOLTAR À GESTÃO DE TORNEIOS</button></div><div class="section">TORNEIO ATIVO</div><div class="infoCard"><span class="label">TORNEIO</span><span id="eventName" class="value"></span></div><div class="section">DEALERS CADASTRADOS NA ATIVAÇÃO</div><div id="dealerGrid" class="dealerGrid"></div><div class="section">DEALER SELECIONADO</div><div class="infoCard"><span class="label">DEALER</span><span id="selectedDealer" class="value">NENHUM</span></div><div class="section">MESA</div><div class="assignGrid"><input id="tableNumber" type="number" min="1" placeholder="NÚMERO DA MESA"><div class="infoCard"><span class="label">MESA FINAL</span><span id="ftState" class="value">NÃO</span></div></div><div class="section">LIBERAÇÃO</div><div class="toggleRow"><button id="regularAccess" class="toggle active" type="button">MESA REGULAR</button><button id="finalTableAccess" class="toggle" type="button">MESA FINAL</button></div><button id="releaseBtn" class="release" type="button" style="margin-top:8px">LIBERAR CELULAR DO DEALER</button><div id="status" class="result"></div><div id="linkBox" class="linkBox"><div class="section" style="margin-top:6px">LINK DE LIBERAÇÃO DO CELULAR</div><div id="accessLink" class="linkValue"></div><button id="copyBtn" type="button">COPIAR LINK DE LIBERAÇÃO</button><button id="shareBtn" type="button">COMPARTILHAR COM DEALER</button></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard('tournament-settings.html')</script><script>(()=>{const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),statusEl=$('status');let dealerId='',mode='REGULAR',generated='';function environmentId(){return String(state.activeEnvironmentId||state.clubId||StackupAuth.current()?.clubId||'')}function readyTournament(){try{const a=JSON.parse(localStorage.getItem('stackup-ready-tournaments-v1')||'[]');return(Array.isArray(a)?a:[]).find(x=>String(x.id)===String(state.eventId))||null}catch(_){return null}}function dealers(){const ready=readyTournament(),ids=new Set((ready?.dealerIds||ready?.staffDealerIds||[]).map(String)),env=environmentId();if(!env)return[];let rows=(state.staffUsers||[]).filter(s=>s&&s.active!==false&&String(s.role||'').toUpperCase()==='DEALER'&&String(s.clubId||'')===env);if(ids.size)rows=rows.filter(s=>ids.has(String(s.id)));return rows.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'pt-BR'))}function render(){const list=dealers();$('eventName').textContent=state.tournamentName||'NENHUM TORNEIO ATIVO';$('dealerGrid').innerHTML=list.length?list.map(d=>`<button type="button" class="dealerBtn ${String(d.id)===dealerId?'active':''}" data-dealer="${esc(d.id)}">${esc(d.name||'DEALER')}</button>`).join(''):'<div class="result">NENHUM DEALER CADASTRADO NESTE AMBIENTE.</div>';const d=list.find(x=>String(x.id)===dealerId);$('selectedDealer').textContent=d?.name||'NENHUM';$('regularAccess').classList.toggle('active',mode==='REGULAR');$('finalTableAccess').classList.toggle('active',mode==='FINAL_TABLE');$('ftState').textContent=mode==='FINAL_TABLE'?'SIM':'NÃO'}function payload(d){const env=environmentId();return{id:'dealer-grant-'+Date.now()+'-'+Math.random().toString(36).slice(2,10),eventId:String(state.eventId||''),tournamentName:String(state.tournamentName||''),clubId:env,clubName:String(state.clubName||''),staffId:String(d.id),dealerName:String(d.name||'DEALER'),table:Math.max(1,Math.floor(+$('tableNumber').value||1)),finalTableAllowed:mode==='FINAL_TABLE',createdAt:Date.now(),expiresAt:Date.now()+12*60*60*1000,nonce:crypto?.randomUUID?.()||Math.random().toString(36).slice(2)+Date.now().toString(36)}}function release(){const d=dealers().find(x=>String(x.id)===dealerId);if(!state.eventId||!state.prepared){statusEl.textContent='SELECIONE E INICIE UM TORNEIO VALIDADO ANTES DE LIBERAR O DEALER.';return}if(!d){statusEl.textContent='SELECIONE UM DEALER CADASTRADO NESTE AMBIENTE.';return}const p=payload(d);if(!Array.isArray(state.dealerAccessGrants))state.dealerAccessGrants=[];state.dealerAccessGrants=state.dealerAccessGrants.filter(g=>!(String(g.eventId)===p.eventId&&String(g.staffId)===p.staffId&&g.status==='AUTHORIZED'));state.dealerAccessGrants.unshift({...p,status:'AUTHORIZED',deviceId:'',releasedBy:StackupAuth.current()?.staffId||StackupAuth.current()?.personId||'',releasedAt:Date.now()});if(p.finalTableAllowed){if(!Array.isArray(state.finalTableAuthorizedDealers))state.finalTableAuthorizedDealers=[];state.finalTableAuthorizedDealers=state.finalTableAuthorizedDealers.filter(x=>String(x.id)!==String(d.id));state.finalTableAuthorizedDealers.push({id:d.id,name:d.name||'DEALER',cpf:d.cpf||'',clubId:p.clubId})}saveState();const token=btoa(unescape(encodeURIComponent(JSON.stringify(p)))).replace(/=+$/,'');generated=`${location.origin}${location.pathname.replace(/dealer-activation\.html$/,'dealer-access.html')}?grant=${encodeURIComponent(token)}`;$('accessLink').textContent=generated;$('linkBox').classList.add('show');statusEl.textContent=`CELULAR LIBERADO PARA ${d.name} • MESA ${String(p.table).padStart(2,'0')}${p.finalTableAllowed?' • MESA FINAL AUTORIZADA':''}.`;statusEl.className='result ok'}document.addEventListener('click',e=>{const b=e.target.closest('[data-dealer]');if(!b)return;dealerId=b.dataset.dealer;render()});$('regularAccess').onclick=()=>{mode='REGULAR';render()};$('finalTableAccess').onclick=()=>{mode='FINAL_TABLE';render()};$('releaseBtn').onclick=release;$('copyBtn').onclick=async()=>{if(!generated)return;try{await navigator.clipboard.writeText(generated);statusEl.textContent='LINK DE LIBERAÇÃO COPIADO.'}catch(_){statusEl.textContent='NÃO FOI POSSÍVEL COPIAR AUTOMATICAMENTE.'}};$('shareBtn').onclick=async()=>{if(!generated)return;if(navigator.share)await navigator.share({title:'STACKUP • DEALER STATION',text:'ACESSO AUTORIZADO À DEALER STATION',url:generated});else $('copyBtn').click()};$('backBtn').onclick=()=>location.href=

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run publication gate
        run: |
          node tests/tournament-smoke.js
          node tests/tournament-isolation-runtime.js
          node tests/balancing-scope-runtime.js
          node tests/tournament-detail-scope-audit.js
          node tests/control-hub-scope-audit.js
          node tests/readiness-scope-runtime.js
          node tests/tournament-manager-permission-audit.js
          node tests/communication-security-audit.js
          node tests/role-navigation-audit.js
          node tests/cash-security-audit.js
          node tests/wallet-read-safety-audit.js
          node tests/dealer-activation-audit.js
          node tests/final-table-settings-audit.js
          node tests/alert-save-audit.js
          node tests/ui-button-audit.js
          node tests/final-interaction-audit.js
          node tests/dom-global-collision-audit.js
          node tests/production-readiness.js
          node tests/cross-sector-integration-audit.js
          node tests/runtime-api-contract-audit.js
          node tests/staff-integrity-audit.js
          node tests/player-directory-integrity-audit.js
          node tests/auth-surface-audit.js
          node tests/tertiary-structure-audit.js
          node tests/in-app-drawer-audit.js
          node tests/secondary-screen-audit.js
          node tests/confirmation-standard-audit.js
          node tests/environment-context-audit.js
          node tests/ranking-hierarchy-audit.js
          node tests/save-persistence-audit.js
          node tests/input-mask-audit.js
          node tests/language-audit.js
          node tests/spanish-english-audit.js
          node tests/language-runtime-alerts-audit.js
          node tests/publication-gate-parity-audit.js
      - name: Build published artifact
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const skip=new Set(['.git','node_modules']);
          const authPages=new Set([
            'setup.html','ready-tournaments.html','pre-registration.html','presence.html',
            'tournament-players.html','balancing.html','screen-settings.html',
            'screen-alerts-operation.html','transmission-room.html','finance.html'
          ]);
          const protectedDisplays=new Set(['cast-10px.html','cast-v2.html','cast-ft-live.html','tv.html','tv-connect.html','dealer-access.html']);

          function scriptRegex(name){return new RegExp(`<script\\b[^>]*\\bsrc=["']${name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}[^"']*["'][^>]*><\\/script>`,'ig')}
          function canonicalize(s,name,tag){
            const re=scriptRegex(name);let kept=false;
            if(re.test(s)){re.lastIndex=0;s=s.replace(re,()=>kept?'':(kept=true,tag));}
            else s=s.replace(/<\/body>/i,tag+'</body>');
            return s;
          }
          function ensureAuth(s,file){
            if(!authPages.has(file))return s;
            const engineRe=scriptRegex('auth-engine.js');
            const hasEngine=engineRe.test(s);engineRe.lastIndex=0;
            if(!hasEngine){
              const sharedRe=/<script\b[^>]*\bsrc=["']shared\.js[^"']*["'][^>]*><\/script>/i;
              if(!sharedRe.test(s))throw new Error(`${file}: não há shared.js para inserir auth-engine antes da lógica da página`);
              s=s.replace(sharedRe,m=>m+'<script src="auth-engine.js?v=publication-auth0910"></script>');
            }
            if(!/StackupAuth\.guard\(\)/.test(s)){
              const re=scriptRegex('auth-engine.js');
              s=s.replace(re,m=>m+'<script>StackupAuth.guard()</script>');
            }
            return s;
          }
          function walk(dir){
            for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
              if(skip.has(ent.name))continue;
              const p=path.join(dir,ent.name);
              if(ent.isDirectory()){walk(p);continue}
              if(!ent.name.endsWith('.html'))continue;
              let s=fs.readFileSync(p,'utf8');
              const file=ent.name.toLowerCase();
              const isOfficialCast=file==='cast-10px.html'||file==='cast-v2.html';
              const isLegacyCast=/^cast-.*\.html$/i.test(ent.name)&&!isOfficialCast;
              const skipButtonStandard=isOfficialCast||isLegacyCast||['tv.html','tv-connect.html','dealer-access.html'].includes(file);
              const skipThemeStandard=skipButtonStandard;

              s=ensureAuth(s,file);

              if(file==='setup.html'&&!s.includes('setup-preinit-reset-v1.js')){
                s=s.replace(/<script src="shared\.js([^\"]*)"><\/script>/i,'<script src="setup-preinit-reset-v1.js?v=b5479e1c"></script><script src="shared.js$1"></script>');
              }
              if(file==='setup.html'){
                s=canonicalize(s,'setup-core-fix-v1.js','<script src="setup-core-fix-v1.js?v=98a44fc9"></script>');
                s=canonicalize(s,'setup-ui-standard-v1.js','<script src="setup-ui-standard-v1.js?v=d61d9d2e"></script>');
              }
              if(!isOfficialCast&&!s.includes('app-language-final.js'))s=s.replace(/<\/body>/i,'<script src="app-language-final.js?v=904063e6"></script></body>');
              if(!skipThemeStandard)s=canonicalize(s,'app-theme.js','<script src="app-theme.js?v=navfull0913"></script>');
              if(!skipButtonStandard)s=canonicalize(s,'app-button-layout-standard-v1.js','<script src="app-button-layout-standard-v1.js?v=fullrow0912"></script>');

              const appendIfMissing=(name,tag)=>{if(!s.includes(name))s=s.replace(/<\/body>/i,tag+'</body>')};
              if(file==='setup.html'){
                appendIfMissing('structure-history-select.js','<script src="structure-history-select.js?v=publication0915"></script>');
                appendIfMissing('tournament-history.js','<script src="tournament-history.js?v=publication0915"></script>');
                appendIfMissing('ranking-hierarchy-setup-v1.js','<script src="ranking-hierarchy-setup-v1.js?v=hierarchy0915"></script>');
                appendIfMissing('setup-confirm-dedupe.js','<script src="setup-confirm-dedupe.js?v=89fc740b"></script>');
                appendIfMissing('setup-ft-ui-fix.js','<script src="setup-ft-ui-fix.js?v=1a4d7862"></script>');
                appendIfMissing('setup-structure-actions-v2.js','<script src="setup-structure-actions-v2.js?v=920fbebb"></script>');
                appendIfMissing('setup-new-tournament-reset-v1.js','<script src="setup-new-tournament-reset-v1.js?v=c3cade35"></script>');
                appendIfMissing('setup-structure-owner-v1.js','<script src="setup-structure-owner-v1.js?v=1d543795"></script>');
              }
              if(file==='staff.html')appendIfMissing('staff-role-list-fix.js','<script src="staff-role-list-fix.js?v=roles-native0910"></script>');
              if(file==='tournament-manager.html')s=canonicalize(s,'tournament-manager-audit-v1.js','<script src="tournament-manager-audit-v1.js?v=dealer-snapshot0911"></script>');
              if(['checkin.html','pre-registration.html','smart-registration.html'].includes(file))appendIfMissing('tournament-validation-gate-v1.js','<script src="tournament-validation-gate-v1.js?v=publication0914"></script>');
              if(file!=='dealer-access.html')appendIfMissing('dealer-device-lock-v1.js','<script src="dealer-device-lock-v1.js?v=dealerlock0909"></script>');
              if(file==='dealer.html')appendIfMissing('dealer-device-sync-v1.js','<script src="dealer-device-sync-v1.js?v=dealersync0909"></script>');
              if(isLegacyCast)appendIfMissing('cast-mobile-fit.js','<script src="cast-mobile-fit.js?v=2"></script>');

              fs.writeFileSync(p,s);
            }
          }
          walk('.');
          NODE
      - name: Audit final published artifact
        env:
          STACKUP_DEPLOY_ARTIFACT: "1"
        run: |
          node tests/tournament-isolation-runtime.js
          node tests/balancing-scope-runtime.js
          node tests/tournament-detail-scope-audit.js
          node tests/control-hub-scope-audit.js
          node tests/readiness-scope-runtime.js
          node tests/tournament-manager-permission-audit.js
          node tests/communication-security-audit.js
          node tests/role-navigation-audit.js
          node tests/cash-security-audit.js
          node tests/wallet-read-safety-audit.js
          node tests/dealer-activation-audit.js
          node tests/final-table-settings-audit.js
          node tests/alert-save-audit.js
          node tests/final-interaction-audit.js
          node tests/auth-surface-audit.js
          node tests/tertiary-structure-audit.js
          node tests/ranking-hierarchy-audit.js
          node tests/save-persistence-audit.js
      - name: Install Chromium audit runtime
        run: |
          mkdir -p /tmp/stackup-e2e
          npm install --prefix /tmp/stackup-e2e playwright@1.55.0
          PLAYWRIGHT_BROWSERS_PATH=/tmp/stackup-browsers /tmp/stackup-e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Run real Chromium role and actionability journeys
        run: |
          python3 -m http.server 4173 >/tmp/stackup-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          PLAYWRIGHT_BROWSERS_PATH=/tmp/stackup-browsers NODE_PATH=/tmp/stackup-e2e/node_modules STACKUP_E2E_BASE=http://127.0.0.1:4173 node tests/browser-open-test-e2e.cjs
          PLAYWRIGHT_BROWSERS_PATH=/tmp/stackup-browsers NODE_PATH=/tmp/stackup-e2e/node_modules STACKUP_E2E_BASE=http://127.0.0.1:4173 node tests/browser-actionability-e2e.cjs
          PLAYWRIGHT_BROWSERS_PATH=/tmp/stackup-browsers NODE_PATH=/tmp/stackup-e2e/node_modules STACKUP_E2E_BASE=http://127.0.0.1:4173 node tests/browser-control-dynamic-e2e.cjs
          PLAYWRIGHT_BROWSERS_PATH=/tmp/stackup-browsers NODE_PATH=/tmp/stackup-e2e/node_modules STACKUP_E2E_BASE=http://127.0.0.1:4173 node tests/browser-environment-dynamic-e2e.cjs
          PLAYWRIGHT_BROWSERS_PATH=/tmp/stackup-browsers NODE_PATH=/tmp/stackup-e2e/node_modules STACKUP_E2E_BASE=http://127.0.0.1:4173 node tests/browser-manager-dynamic-e2e.cjs
          PLAYWRIGHT_BROWSERS_PATH=/tmp/stackup-browsers NODE_PATH=/tmp/stackup-e2e/node_modules STACKUP_E2E_BASE=http://127.0.0.1:4173 node tests/browser-setup-dynamic-e2e.cjs
          PLAYWRIGHT_BROWSERS_PATH=/tmp/stackup-browsers NODE_PATH=/tmp/stackup-e2e/node_modules STACKUP_E2E_BASE=http://127.0.0.1:4173 node tests/browser-checkin-dynamic-e2e.cjs
          kill $SERVER_PID 2>/dev/null || true
          trap - EXIT
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

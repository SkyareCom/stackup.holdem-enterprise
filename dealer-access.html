<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>LIBERAÇÃO DO DEALER • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:680px;margin:auto;padding:18px}.ey{color:#8DFC3B;letter-spacing:.14em}.title{margin:4px 0 24px}.box{padding:14px;border:1px solid #27342D;border-radius:9px;background:linear-gradient(#0B100D,#060907);line-height:1.5}.ok{color:#8DFC3B}.bad{color:#AEB8B1}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">LIBERAÇÃO DO DEALER</h1><div id="result" class="box">VALIDANDO LIBERAÇÃO...</div></main><script src="shared.js"></script><script>(()=>{const r=document.getElementById('result');const SESSION_KEY='stackup-auth-session-v1',DEVICE_KEY='stackup-auth-device-v1',ACTIVE_GRANT='stackup-dealer-device-grant-v1';function deviceId(){let id=localStorage.getItem(DEVICE_KEY)||'';if(!id){id='device-'+Date.now()+'-'+Math.random().toString(36).slice(2,10);localStorage.setItem(DEVICE_KEY,id)}return id}try{const q=new URLSearchParams(location.search),token=q.get('grant')||'';if(!token)throw new Error('LINK DE LIBERAÇÃO INVÁLIDO.');const pad=token.length%4?'='.repeat(4-token.length%4):'',json=decodeURIComponent(escape(atob(token+pad))),grant=JSON.parse(json);if(!grant?.staffId||!grant?.eventId||!grant?.expiresAt)throw new Error('LIBERAÇÃO INCOMPLETA.');if(Date.now()>+grant.expiresAt)throw new Error('ESTA LIBERAÇÃO EXPIROU. SOLICITE UMA NOVA LIBERAÇÃO AO TD / FLOOR.');for(const k of ['staffUsers','authPeople','authClubs','authMemberships'])if(!Array.isArray(state[k]))state[k]=[];const clubId=String(grant.clubId||'club-dealer-access'),personId='dealer-device-person-'+grant.staffId,membershipId='dealer-device-membership-'+grant.staffId+'-'+grant.eventId;let club=state.authClubs.find(c=>String(c.id)===clubId);if(!club){club={id:clubId,name:grant.clubName||'AMBIENTE',type:'CLUB',active:true,createdAt:Date.now()};state.authClubs.push(club)}let staff=state.staffUsers.find(s=>String(s.id)===String(grant.staffId));if(!staff){staff={id:String(grant.staffId),name:grant.dealerName||'DEALER',role:'DEALER',clubId,permissions:['DEALER_STATION'],active:true,createdAt:Date.now()};state.staffUsers.push(staff)}else{staff.role='DEALER';staff.clubId=clubId;staff.permissions=['DEALER_STATION'];staff.active=true}let person=state.authPeople.find(p=>String(p.id)===personId);if(!person){person={id:personId,name:grant.dealerName||staff.name||'DEALER',active:true,createdAt:Date.now()};state.authPeople.push(person)}let membership=state.authMemberships.find(m=>String(m.id)===membershipId);if(!membership){membership={id:membershipId,personId,clubId,staffId:String(grant.staffId),role:'DEALER',permissions:['DEALER_STATION'],active:true,createdAt:Date.now()};state.authMemberships.push(membership)}else{membership.active=true;membership.role='DEALER';membership.permissions=['DEALER_STATION']}state.eventId=String(grant.eventId);state.tournamentName=String(grant.tournamentName||state.tournamentName||'TORNEIO');state.clubId=clubId;state.clubName=String(grant.clubName||club.name||state.clubName||'');if(!Array.isArray(state.dealerAccessGrants))state.dealerAccessGrants=[];const dev=deviceId();state.dealerAccessGrants=state.dealerAccessGrants.filter(g=>String(g.id)!==String(grant.id));state.dealerAccessGrants.unshift({...grant,status:'ACTIVE',deviceId:dev,activatedAt:Date.now()});if(grant.finalTableAllowed){if(!Array.isArray(state.finalTableAuthorizedDealers))state.finalTableAuthorizedDealers=[];state.finalTableAuthorizedDealers=state.finalTableAuthorizedDealers.filter(x=>String(x.id)!==String(grant.staffId));state.finalTableAuthorizedDealers.push({id:String(grant.staffId),name:grant.dealerName||'DEALER',cpf:''})}saveState();localStorage.setItem(ACTIVE_GRANT,JSON.stringify({...grant,status:'ACTIVE',deviceId:dev,activatedAt:Date.now()}));localStorage.setItem(SESSION_KEY,JSON.stringify({id:'dealer-device-session-'+Date.now(),personId,personName:grant.dealerName||'DEALER',clubId,clubName:grant.clubName||club.name||'',membershipId,staffId:String(grant.staffId),role:'DEALER',permissions:['DEALER_STATION'],deviceId:dev,startedAt:Date.now(),source:'DEALER_DEVICE_RELEASE'}));r.className='box ok';r.textContent=`CELULAR LIBERADO PARA ${grant.dealerName||'DEALER'} • MESA ${String(grant.table||'').padStart(2,'0')}. ABRINDO DEALER STATION...`;setTimeout(()=>location.replace('dealer.html'),900)}catch(e){r.className='box bad';r.textContent=e.message||'NÃO FOI POSSÍVEL VALIDAR A LIBERAÇÃO.'}})();</script></body></html>

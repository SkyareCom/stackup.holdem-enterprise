<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOGIN • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:560px;margin:auto;padding:24px 18px}.ey{color:#8DFC3B;letter-spacing:.14em}.title{margin:4px 0 24px}.section{color:#8DFC3B;letter-spacing:.14em;margin:16px 2px 7px}.grid{display:grid;grid-template-columns:1fr;gap:8px}.card{background:transparent!important;border:0!important;border-radius:0!important;padding:0!important;box-shadow:none!important}.env{display:grid;gap:8px;margin-top:8px}.env button{min-height:52px!important;text-align:left!important}.status{color:#AEB8B1;margin-top:8px;min-height:18px}.hidden{display:none!important}input,button{width:100%!important;min-height:44px!important;box-sizing:border-box!important;border-radius:9px!important}.primary{background:#8DFC3B!important;color:#020302!important}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">LOGIN</h1><div id="loginStep"><div class="section">IDENTIFICAÇÃO</div><div class="card grid"><input id="cpf" inputmode="numeric" autocomplete="username" placeholder="CPF"><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN"><button id="loginBtn" class="primary" type="button">ENTRAR</button></div></div><div id="environmentStep" class="hidden"><div class="section">SELECIONE O AMBIENTE</div><div id="personName"></div><div id="environments" class="env"></div><button id="backBtn" type="button" style="margin-top:8px">ANTERIOR</button></div><div id="loginStatus" class="status"></div></main><script src="production-init.js"></script><script src="shared.js"></script><script src="auth-engine.js"></script><script src="production-auth-cleanup.js"></script><script>const loginStatus=document.getElementById('loginStatus');function showEnvironments(rows,person){loginStep.classList.add('hidden');environmentStep.classList.remove('hidden');personName.textContent=person?.name||'';environments.innerHTML=rows.map(m=>`<button type="button" data-membership="${m.id}">${m.club?.name||'AMBIENTE'} • ${m.role}</button>`).join('');[...environments.querySelectorAll('[data-membership]')].forEach(b=>b.onclick=()=>{const r=StackupAuth.selectEnvironment(b.dataset.membership);if(!r.ok){loginStatus.textContent=r.error;return}location.href=StackupAuth.landing(r.session)})}function doLogin(){const r=StackupAuth.login(cpf.value,pin.value);if(!r.ok){loginStatus.textContent=r.error;return}loginStatus.textContent='';if(r.memberships.length===1){const s=StackupAuth.selectEnvironment(r.memberships[0].id);if(!s.ok){loginStatus.textContent=s.error;return}location.href=StackupAuth.landing(s.session);return}showEnvironments(r.memberships,r.person)}loginBtn.onclick=doLogin;pin.onkeydown=e=>{if(e.key==='Enter')doLogin()};backBtn.onclick=()=>{StackupAuth.logout();environmentStep.classList.add('hidden');loginStep.classList.remove('hidden');loginStatus.textContent=''};const active=StackupAuth.current();if(active)location.href=StackupAuth.landing(active);else{const rows=StackupAuth.environments();if(rows.length){const p=rows[0].person;showEnvironments(rows,p)}}</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>MESA FINAL • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff;min-height:100vh}.app{width:min(760px,92vw);margin:0 auto;padding:24px 0}.ey{color:#8DFC3B;font-size:12px!important;letter-spacing:.08em}.title{font-size:20px!important;margin:5px 0 24px}.section{color:#8DFC3B;letter-spacing:.12em;margin:18px 0 8px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode,.dealer{min-height:48px!important;border:0!important;border-radius:9px!important;background:#111713!important;color:#fff!important}.mode.active,.dealer.active{background:#8DFC3B!important;color:#020302!important}.hands{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.hands button{min-height:44px!important}.hands button.active{background:#8DFC3B!important;color:#020302!important}.custom{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}.custom input,.custom button{min-height:44px!important}.dealers{display:grid;gap:8px}.dealer{text-align:left!important;padding:0 14px!important}.note{color:#AEB8B1;font-size:12px;line-height:1.5;margin-top:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}.actions button{min-height:46px!important}.primary{background:#8DFC3B!important;color:#020302!important}@media(max-width:520px){.modes{grid-template-columns:1fr}.hands{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><div class="title">CONFIGURAÇÃO DA MESA FINAL</div><div class="section">SISTEMA DA MESA FINAL</div><div class="modes"><button id="timerMode" type="button" class="mode">RELÓGIO</button><button id="handsMode" type="button" class="mode">MÃO A MÃO</button></div><div id="handsConfig"><div class="section">MÃOS POR NÍVEL</div><div class="hands" id="handPresets"><button type="button" data-hands="5">5</button><button type="button" data-hands="10">10</button><button type="button" data-hands="15">15</button><button type="button" data-hands="20">20</button></div><div class="custom"><input id="customHands" type="tel" inputmode="numeric" maxlength="3" placeholder="PERSONALIZAR"><button id="applyCustom" type="button">OK</button></div><div class="section">DEALERS AUTORIZADOS</div><div class="dealers" id="dealers"></div><div class="note">AO ENTRAR NA MESA FINAL, O CAST TROCA AUTOMATICAMENTE O RELÓGIO PELO CONTADOR 00 / 00. A CONTAGEM SÓ É LIBERADA APÓS O CHECK-IN DE UM DEALER AUTORIZADO.</div></div><div class="actions"><button type="button" onclick="location.href='tournament-settings.html'">ANTERIOR</button><button type="button" class="primary" id="saveBtn">SALVAR</button></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard('tournament-settings.html');const mode=String(state.finalTableStructureMode||'TIMER').toUpperCase()==='MANUAL'?'MANUAL':'TIMER';let selectedMode=mode,handTarget=Math.max(1,Math.floor(+state.finalTableHandsPerLevel||10));const environmentId=String(state.activeEnvironmentId||state.clubId||'');let authorized=Array.isArray(state.finalTableAuthorizedDealers)?state.finalTableAuthorizedDealers.map(x=>String(x.id)):[];const allDealers=(state.staffUsers||[]).filter(x=>x&&x.active!==false&&String(x.role||'').toUpperCase()==='DEALER'&&(!environmentId||String(x.clubId||'')===environmentId));authorized=authorized.filter(id=>allDealers.some(d=>String(d.id)===id));function render(){timerMode.classList.toggle('active',selectedMode==='TIMER');handsMode.classList.toggle('active',selectedMode==='MANUAL');handsConfig.style.display=selectedMode==='MANUAL'?'block':'none';document.querySelectorAll('[data-hands]').forEach(b=>b.classList.toggle('active',+b.dataset.hands===handTarget));dealers.innerHTML='';if(!allDealers.length){dealers.innerHTML='<div class="note">NENHUM DEALER ATIVO CADASTRADO NESTE AMBIENTE.</div>';return}allDealers.forEach(d=>{const b=document.createElement('button');b.type='button';b.className='dealer '+(authorized.includes(String(d.id))?'active':'');b.textContent=(d.name||'DEALER')+(d.cpf?' • '+d.cpf:'');b.onclick=()=>{const id=String(d.id),i=authorized.indexOf(id);if(i>=0)authorized.splice(i,1);else if(authorized.length<3)authorized.push(id);render()};dealers.appendChild(b)})}timerMode.onclick=()=>{selectedMode='TIMER';render()};handsMode.onclick=()=>{selectedMode='MANUAL';render()};document.querySelectorAll('[data-hands]').forEach(b=>b.onclick=()=>{handTarget=+b.dataset.hands;customHands.value='';render()});customHands.oninput=()=>customHands.value=customHands.value.replace(/\D/g,'').slice(0,3);applyCustom.onclick=()=>{const raw=Number(customHands.value);if(!Number.isFinite(raw)||raw<1)return;handTarget=Math.max(1,Math.min(999,Math.floor(raw)));customHands.value=String(handTarget);render()};saveBtn.onclick=()=>{if(selectedMode==='MANUAL'&&!authorized.length)return alert('SELECIONE PELO MENOS UM DEALER AUTORIZADO PARA A MESA FINAL.');state.finalTableStructureMode=selectedMode;state.finalTableHandsPerLevel=handTarget;state.finalTableAutoConfigured=selectedMode==='MANUAL';state.finalTableManualActive=false;state.finalTableMode='TIMER';state.finalTableAuthorizedDealers=selectedMode==='MANUAL'?allDealers.filter(d=>authorized.includes(String(d.id))).map(d=>({id:d.id,name:d.name||'DEALER',cpf:d.cpf||'',clubId:d.clubId||environmentId})):[];state.finalTableGate=null;state.finalTableAccess=null;state.finalTableHands={target:handTarget,completed:0,levelIndex:+state.levelIndex||0,updatedAt:Date.now()};saveState();saveBtn.textContent='SALVO';setTimeout(()=>location.href='tournament-settings.html',500)};render();</script></body></html>

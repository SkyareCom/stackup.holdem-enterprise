n id="customSchedule" type="button">ATIVAR AGENDAMENTO</button></div></div></div></section><div class="bottomActions"><a href="screen-alerts.html"><button type="button">VOLTAR PARA ALERTAS E RECADOS</button></a></div></main><script src="screen-alert-audio.js?v=8f2b54c"></script><script src="shared.js?v=cc65ef70"></script><script src="screen-message-engine.js?v=9134dfc"></script><script src="screen-poker-pronunciation-v1.js?v=e80a284"></script><script src="screen-registration-message-texts-v2.js?v=98136a87"></script><script src="screen-registration-chain-v2.js?v=b69d85f"></script><script src="screen-message-language-sync-v2.js?v=b97528c"></script><script src="screen-message-groups-v13.js?v=4a4e5ff3"></script><script src="screen-message-spanish-runtime-v1.js?v=7b93cde"></script><script src="screen-alert-structure.js?v=4ee7e2a"></script><script src="app-language-qa.js?v=a9105c3"></script><script src="app-language-alerts-v1.js?v=c4a58eb"></script><script>const key=(location.hash||'#sound').slice(1);const chosen=['sound','voice','text'].includes(key)?key:'sound';document.querySelector('[data-module="'+chosen+'"]').classList.add('active');(()=>{const api=window.StackupScreenMessages,m=document.getElementById('voiceMale'),f=document.getElementById('voiceFemale');if(!api||!m||!f)return;const currentLang=()=>api.officialLang();const render=()=>{const c=api.load(),l=currentLang(),female=c.voiceProfile===`${l}_f`;m.classList.toggle('active',!female);f.classList.toggle('active',female)};const choose=sex=>{const c=api.load(),l=currentLang();c.voiceLang=l;c.voiceProfile=`${l}_${sex}`;api.save(c);render()};m.onclick=()=>choose('m');f.onclick=()=>choose('f');render();window.addEventListener('stackup-screen-message-config',render)})();window.addEventListener('load',()=>{const refresh=()=>window.dispatchEvent(new CustomEvent('stackup-screen-message-config'));refresh();setTimeout(refresh,50);setTimeout(refresh,250)});</script><script src="app-theme.js?v=9036d09a"></script></body></htm

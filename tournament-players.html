<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JOGADORES INSCRITOS • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>:root{--bg:#020302;--line:#27342D;--text:#fff;--muted:#AEB8B1;--green:#8DFC3B}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.app{max-width:980px;margin:auto;padding:18px}.ey{color:var(--green);letter-spacing:.14em}.title{font-size:20px;font-weight:600;margin:4px 0 24px}.personal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:8px}.dataCard{width:100%;height:44px;min-height:44px;padding:10px;border:1px solid var(--line);border-radius:9px;background:#060907;display:flex;align-items:center;gap:10px}.dataCard .k{color:var(--muted);font-size:12px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dataCard .v{color:#fff;font-size:12px;font-weight:400;margin:0 0 0 auto;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}.dataCard .v:empty{display:none}.search{width:100%;height:44px;min-height:44px;padding:10px;margin:0 0 18px;border:1px solid var(--line);border-radius:9px;background:#060907;color:#fff}.tableWrap{width:100%;overflow-x:auto}.table{min-width:2320px;width:100%}.row{display:grid;grid-template-columns:42px minmax(220px,1.6fr) 120px 70px 80px repeat(9,94px) 115px 110px 120px;align-items:center;gap:1px;border-bottom:1px solid #1d2721;min-height:46px;padding:6px 0}.row.header{color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.04em}.cell{padding:0 6px;font-size:11px}.name{font-weight:700;color:#fff}.center{text-align:center}.checkCell{display:flex;align-items:center;justify-content:center}.pick{appearance:none;-webkit-appearance:none;width:19px;height:19px;margin:0;border:1px solid var(--green);border-radius:3px;background:#060907}.pick:checked{background:var(--green);box-shadow:inset 0 0 0 4px #060907}.empty{color:var(--muted);padding:14px 2px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.actions button{min-height:44px;padding:10px 12px;border-radius:9px;font-weight:700;font-size:12px}.selectBtn{border:1px solid var(--green);background:var(--green);color:#020302}.cancelBtn{border:1px solid var(--green);background:#060907;color:var(--green)}.pkoMode .personal{grid-template-columns:1fr!important}@media(max-width:700px){.personal{grid-template-columns:1fr}.pkoMode .personal{grid-template-columns:1fr!important}.dataCard{height:44px!important;min-height:44px!important;padding:10px!important}.dataCard .k,.dataCard .v{margin-top:0!important;margin-bottom:0!important;line-height:1!important}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><div class="title">JOGADORES INSCRITOS</div><div class="personal"><div class="dataCard"><div class="k">NOME COMPLETO</div><div id="dataName" class="v"></div></div><div class="dataCard"><div class="k">CPF</div><div id="dataCpf" class="v"></div></div><div class="dataCard"><div class="k">DATA DE NASCIMENTO</div><div id="dataBirth" class="v"></div></div><div class="dataCard"><div class="k">TELEFONE</div><div id="dataPhone" class="v"></div></div></div><input id="searchPlayer" class="search" type="search" placeholder="PROCURAR JOGADOR"><div class="tableWrap"><div id="table" class="table"></div></div><div class="actions"><button id="selectPlayer" class="selectBtn" type="button">SELECIONAR JOGADOR</button><button id="cancel" class="cancelBtn" type="button">CANCELAR</button></div></main><script src="shared.js"></script><script src="finance-config.js"></script><script src="wallet-engine.js"></script><script src="player-profile-engine.js"></script><script>
ensureOperationalState();const params=new URLSearchParams(location.search),mode=params.get('mode')||'MOVEMENTS',SELECT_KEY=mode==='PKO_PRO'?'stackup-pko-pro-player':mode==='PKO_CONTRA'?'stackup-pko-contra-player':'stackup-movements-selected-player';if(mode.startsWith('PKO_'))document.body.classList.add('pkoMode');if(mode==='PKO_PRO')selectPlayer.textContent='SELECIONAR PKO PRÓ';if(mode==='PKO_CONTRA')selectPlayer.textContent='SELECIONAR PKO CONTRA';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=v=>typeof fmtCurrency==='function'?fmtCurrency(v):new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(+v||0);function displayBirth(v){if(/^\d{4}-\d{2}-\d{2}$/.test(v||'')){const[y,m,d]=v.split('-');return`${d} / ${m} / ${y}`}return v||''}function playerRows(){const q=String(searchPlayer.value||'').trim().toLocaleLowerCase('pt-BR');return(state.players||[]).map(p=>({p,profile:StackupPlayerProfile.tournamentProfile(p)})).filter(x=>x.profile?.metrics?.buyin>0).filter(({p,profile})=>{if(!q)return true;const i=profile?.identity||{};return[p.name,i.cpf,i.phone,i.whatsapp,profile?.code].some(v=>String(v||'').toLocaleLowerCase('pt-BR').includes(q))}).sort((a,b)=>String(a.p.name||'').localeCompare(String(b.p.name||''),'pt-BR'))}let selectedId='';function fillCards(){const p=(state.players||[]).find(x=>String(x.id)===String(selectedId)),profile=StackupPlayerProfile.tournamentProfile(p),i=profile?.identity||{};dataName.textContent=i.name||'';dataCpf.textContent=i.cpf||'';dataBirth.textContent=displayBirth(i.birth||'');dataPhone.textContent=i.phone||''}function render(){const rows=playerRows(),header='<div class="row header"><div></div><div class="cell">NOME COMPLETO</div><div class="cell center">CÓDIGO</div><div class="cell center">MESA</div><div class="cell center">POSIÇÃO</div><div class="cell center">BUY IN</div><div class="cell center">EARLY BONUS</div><div class="cell center">REBUY I</div><div class="cell center">REBUY II</div><div class="cell center">RE-ENTRIES</div><div class="cell center">ADD ON I</div><div class="cell center">ADD ON II</div><div class="cell center">BONUS ADD ON</div><div class="cell center">BOUNTIES</div><div class="cell center">VALOR GASTO</div><div class="cell center">CRÉDITO</div><div class="cell center">CREDIT PLAYER</div></div>';table.innerHTML=header+(rows.length?rows.map(({p,profile})=>{const m=profile.metrics,s=profile.seat;return`<div class="row"><div class="checkCell"><input class="pick" type="checkbox" data-id="${esc(p.id)}" ${String(p.id)===String(selectedId)?'checked':''}></div><div class="cell name">${esc(profile.identity.name||p.name||'SEM NOME')}</div><div class="cell center">${esc(profile.code||'—')}</div><div class="cell center">${esc(s?.table??'—')}</div><div class="cell center">${esc(s?.seat??'—')}</div><div class="cell center">${m.buyin}</div><div class="cell center">${m.early}</div><div class="cell center">${m.rebuy1}</div><div class="cell center">${m.rebuy2}</div><div class="cell center">${m.reentry}</div><div class="cell center">${m.addon1}</div><div class="cell center">${m.addon2}</div><div class="cell center">${m.addonBonus}</div><div class="cell center">${m.bounties}</div><div class="cell center">${money(m.spent)}</div><div class="cell center">${money(m.credit)}</div><div class="cell center">${money(profile.creditPlayer)}</div></div>`}).join(''):'<div class="empty">NENHUM JOGADOR ENCONTRADO.</div>');table.querySelectorAll('.pick').forEach(c=>c.onchange=()=>{selectedId=c.checked?c.dataset.id:'';table.querySelectorAll('.pick').forEach(x=>{if(x!==c)x.checked=false});fillCards()});fillCards()}searchPlayer.oninput=render;selectPlayer.onclick=()=>{if(!selectedId)return alert('SELECIONE UM JOGADOR.');localStorage.setItem(SELECT_KEY,selectedId);location.href='players.html'};cancel.onclick=()=>location.href='players.html';window.onPokerStateChange=render;window.addEventListener('storage',render);window.addEventListener('stackup-wallet-change',render);render();
</script></body></html>

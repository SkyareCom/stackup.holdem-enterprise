<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BOT OPERACIONAL</title><link rel="stylesheet" href="app-theme.css"><style>:root{--bg:#020302;--panel:#0a0f0c;--line:#26342c;--text:#f4f7f4;--green:#9cff4b;--amber:#f3c64e;--red:#ff6069}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.app{max-width:760px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid #1d2821}.ey{font-size:9px;color:var(--green);font-weight:950;letter-spacing:.16em}.title{font-size:24px;font-weight:950}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.section{font-size:10px;color:var(--green);font-weight:950;letter-spacing:.13em;margin:16px 2px 7px}.grid,.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.label{font-size:9px;color:#b3bcb6;margin-bottom:5px}.meta{font-size:10px;color:#aab3ad;line-height:1.5}input,textarea,select,button{width:100%;border-radius:9px;padding:10px;font-size:12px}input,textarea,select{background:#060907;border:1px solid #304038;color:#fff}textarea{min-height:88px;resize:vertical}button{border:1px solid #34463b;background:#0c130f;color:#fff;font-weight:950}.primary{background:var(--green);color:#071005;border-color:var(--green)}.preview{white-space:pre-wrap;background:#060907;border:1px solid #223027;border-radius:10px;padding:11px;margin-top:8px;font-size:11px;line-height:1.5}.ok{border-color:#31533c}.warn{border-color:#65542b}.bad{border-color:#63353a}.row{padding:9px 0;border-bottom:1px solid #1d2721}.badge{display:inline-block;padding:3px 6px;border-radius:999px;border:1px solid #35513d;color:var(--green);font-size:8px;font-weight:950}@media(max-width:620px){.grid,.actions{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="top"><div><div class="ey">WHATSAPP • FLOOR • TD</div><div class="title">BOT OPERACIONAL</div></div><a href="players.html"><button type="button">JOGADORES ↗</button></a></div><div class="card"><div class="meta">CONSOLE DE TESTES DO FUTURO WEBHOOK. TODA AÇÃO PASSA PELO MESMO MOTOR OPERACIONAL DO DEALER E DO BALANCING E EXIGE O OPERADOR AUTENTICADO NESTE AMBIENTE.</div></div><div class="section">OPERADOR</div><div class="card"><div class="label">STAFF AUTENTICADO</div><select id="sender" disabled></select><div id="senderInfo" class="meta" style="margin-top:8px"></div></div><div class="section">COMANDO RECEBIDO</div><div class="card"><textarea id="command" placeholder="EX.: ELIMINAÇÃO MESA 5 POSIÇÃO 8&#10;EX.: REBUY DUPLO MESA 6 POSIÇÃO 2"></textarea><button class="primary" id="interpret" type="button" style="margin-top:8px">INTERPRETAR COMANDO</button><div id="interpretation"></div></div><div class="section">ALERTAS FLOOR / TD</div><div class="card" id="staffAlerts"></div><div class="section">LOG DE COMANDOS</div><div class="card" id="commandLog"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script src="validation.js"></script><script src="operations.js"></script><script src="tournament-engine.js"></script><script>if(StackupAuth.guard('communication-hub.html')){(()=>{ensureOperationalState();PokerOperations.ensure();let pending=null;const BOT_STAFF=StackupAuth.staffForSession(),PERMS={ELIMINATION:['OWNER','GESTOR','TD','FLOOR'],REBUY:['OWNER','GESTOR','TD','CASHIER'],DOUBLE_REBUY:['OWNER','GESTOR','TD','CASHIER'],ADDON:['OWNER','GESTOR','TD','CASHIER'],REENTRY:['OWNER','GESTOR','TD','CASHIER']};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/-/g,' ')}function selectedStaff(){return BOT_STAFF||null}function eventPlayers(){return currentTournamentPlayers()}function locate(t,s,all=false){return eventPlayers().find(p=>(all||p.status==='active')&&+p.table===+t&&+p.seat===+s)||null}function label(a){return({ELIMINATION:'ELIMINAÇÃO',REBUY:'REBUY',DOUBLE_REBUY:'REBUY DUPLO',ADDON:'ADD-ON',REENTRY:'REENTRADA'})[a]||a}function parse(raw){const s=norm(raw),tm=s.match(/mesa\s*(\d+)/),sm=s.match(/(?:posicao|assento|seat)\s*(\d+)/);if(!tm||!sm)return{ok:false,error:'INFORME MESA E POSIÇÃO/ASSENTO.'};const table=+tm[1],seat=+sm[1];let action=null;if(/elimin/.test(s))action='ELIMINATION';else if(/rebuy\s*duplo|duplo\s*rebuy/.test(s))action='DOUBLE_REBUY';else if(/rebuy/.test(s))action='REBUY';else if(/add\s*on|addon/.test(s))action='ADDON';else if(/reentrada|re entry|reentry/.test(s))action='REENTRY';if(!action)return{ok:false,error:'AÇÃO NÃO RECONHECIDA.'};const p=locate(table,seat,action==='REENTRY');if(!p)return{ok:false,error:`NENHUM JOGADOR ENCONTRADO NA MESA ${table}, ASSENTO ${seat} NESTE TORNEIO.`};if(action==='REENTRY'&&p.status==='active')return{ok:false,error:`${p.name} AINDA ESTÁ ATIVO.`};return{ok:true,action,table,seat,player:p}}function authorized(staff,action){return !!staff&&((PERMS[action]||[]).includes(String(staff.role||'').toUpperCase()))}function preview(r){const staff=selectedStaff();if(!staff){interpretation.innerHTML='<div class="preview bad"><b>SESSÃO AUTENTICADA OBRIGATÓRIA</b>\nENTRE NOVAMENTE NO AMBIENTE.</div>';return}if(!r.ok){interpretation.innerHTML=`<div class="preview bad"><b>COMANDO NÃO EXECUTÁVEL</b>\n${esc(r.error)}</div>`;return}if(!authorized(staff,r.action)){interpretation.innerHTML=`<div class="preview bad"><b>PERMISSÃO NEGADA</b>\n${esc(staff.name)} • ${esc(staff.role)} NÃO PODE EXECUTAR ${esc(label(r.action))}.</div>`;auditEvent('BOT_COMMAND_REJECTED',{source:'BOT_UI',operator:staff.id,action:r.action,reason:'ROLE_NOT_ALLOWED'});saveState();return}if(r.action==='ELIMINATION'&&PokerOperations.bountyEnabled()){interpretation.innerHTML='<div class="preview warn"><b>BOUNTY / PKO EXIGE KILLER</b>\nA ELIMINAÇÃO PELO BOT FICA BLOQUEADA NESTE FORMATO. USE DEALER STATION OU JOGADORES PARA SELECIONAR QUEM ELIMINOU E REGISTRAR O BOUNTY DE FORMA ATÔMICA.</div>';auditEvent('BOT_COMMAND_REJECTED',{source:'BOT_UI',operator:staff.id,action:r.action,playerId:r.player.id,reason:'KILLER_REQUIRED'});saveState();return}pending={...r,staff,seatSnapshot:r.player.seat,tableSnapshot:r.player.table};const amount=r.action==='ELIMINATION'?null:PokerOperations.defaultTransactionValue(r.action);interpretation.innerHTML=`<div class="preview warn"><b>CONFIRMAR ${esc(label(r.action))}</b>\nOPERADOR: ${esc(staff.name)} • ${esc(staff.role)}\nJOGADOR: ${esc(r.player.name)}\nMESA: ${r.table}\nASSENTO: ${r.seat}${amount!==null?`\nVALOR: ${fmtCurrency(amount)}`:''}</div><div class="actions"><button id="cancelCmd" type="button">CANCELAR</button><button class="primary" id="confirmCmd" type="button">CONFIRMAR</button></div>`;cancelCmd.onclick=()=>{pending=null;interpretation.innerHTML=''};confirmCmd.onclick=confirmPending}function confirmPending(){if(!pending)return;const r=pending,p=PokerOperations.playerById(r.player.id),staff=r.staff;if(!p||+p.table!==+r.tableSnapshot||+p.seat!==+r.seatSnapshot){auditEvent('BOT_COMMAND_REJECTED',{source:'BOT_UI',operator:staff.id,action:r.action,playerId:r.player.id,reason:'STALE_SEAT'});pending=null;interpretation.innerHTML='<div class="preview bad"><b>COMANDO EXPIRADO</b>\nA MESA/ASSENTO DO JOGADOR MUDOU. INTERPRETE NOVAMENTE.</div>';saveState();return}let out;if(r.action==='ELIMINATION')out=PokerOperations.eliminatePlayer({playerId:p.id,staff,source:'WHATSAPP_BOT'});else if(r.action==='REENTRY')out=PokerOperations.reenterPlayer({playerId:p.id,staff,source:'WHATSAPP_BOT'});else out=PokerOperations.addTournamentTransaction({playerId:p.id,type:r.action,staff,source:'WHATSAPP_BOT'});if(!out.ok){interpretation.innerHTML=`<div class="preview bad"><b>FALHA</b>\n${esc(out.error)}</div>`;return}const now=Date.now(),environmentId=String(state.activeEnvironmentId||state.clubId||'');state.botCommands.unshift({id:'cmd-'+now+'-'+Math.random().toString(36).slice(2,6),eventId:state.eventId,environmentId,raw:command.value,action:r.action,playerId:p.id,playerName:p.name,table:r.table,seat:r.seat,operatorId:staff.id,operatorName:staff.name,operatorRole:staff.role,createdAt:now,status:'confirmed'});auditEvent('BOT_COMMAND_EXECUTED',{source:'BOT_UI',operator:staff.id,action:r.action,playerId:p.id,table:r.table,seat:r.seat,environmentId});saveState();pending=null;command.value='';interpretation.innerHTML='<div class="preview ok"><b>✓ COMANDO CONFIRMADO</b>\nMOTOR OPERACIONAL CENTRAL, AUDITORIA E BALANCING ATUALIZADOS.</div>';render()}function renderStaff(){sender.innerHTML=BOT_STAFF?`<option value="${esc(BOT_STAFF.id)}">${esc(BOT_STAFF.name)} • ${esc(BOT_STAFF.role)}</option>`:'<option value="">SEM SESSÃO AUTENTICADA</option>';senderInfo.textContent=BOT_STAFF?`WHATSAPP: ${BOT_STAFF.phone||'-'} • ${BOT_STAFF.role}`:'NENHUM OPERADOR AUTENTICADO.'}function renderAlerts(){const event=String(state.eventId||''),environment=String(state.activeEnvironmentId||state.clubId||'');const rows=(state.staffAlerts||[]).filter(a=>String(a.eventId||'')===event&&(!environment||!a.environmentId||String(a.environmentId)===environment)).slice(0,20);staffAlerts.innerHTML=rows.map(a=>`<div class="row"><b>${esc(a.type)}</b> <span class="badge">${esc(a.status||'PENDING')}</span><div class="meta">${new Date(a.createdAt).toLocaleString('pt-BR')}</div><div class="preview">${esc(a.text||'')}</div></div>`).join('')||'<div class="meta">NENHUM ALERTA OPERACIONAL NESTE TORNEIO.</div>'}function renderLog(){const event=String(state.eventId||''),rows=(state.botCommands||[]).filter(c=>String(c.eventId||'')===event).slice(0,40);commandLog.innerHTML=rows.map(c=>`<div class="row"><b>${esc(c.playerName)} • ${esc(label(c.action))}</b><div class="meta">M${esc(c.table)}/A${esc(c.seat)} • ${esc(c.operatorName||c.operatorId||'BOT')} ${c.operatorRole?`• ${esc(c.operatorRole)}`:''} • ${new Date(c.createdAt).toLocaleString('pt-BR')}</div></div>`).join('')||'<div class="meta">NENHUM COMANDO CONFIRMADO NESTE TORNEIO.</div>'}function render(){renderStaff();renderAlerts();renderLog()}interpret.onclick=()=>preview(parse(command.value));command.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();preview(parse(command.value))}};window.onPokerStateChange=render;window.addEventListener('storage',render);render()})();}</script></body></html>

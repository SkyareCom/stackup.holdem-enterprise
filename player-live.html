<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PLAYER LIVE</title><link rel="stylesheet" href="app-theme.css"><style>:root{--bg:#020302;--panel:#0a0f0c;--line:#26342c;--text:#f5f7f5;--green:#9cff4b;--amber:#f3c64e;--red:#ff6069;--blue:#62a7ff;--purple:#b987ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.app{max-width:520px;margin:auto;padding:16px}.ey{font-size:9px;color:var(--green);font-weight:950;letter-spacing:.16em}.title{font-size:22px;font-weight:950;margin:4px 0 14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}.timer{text-align:center;padding:22px 10px}.clock{font-size:68px;font-weight:950;letter-spacing:-.05em}.label{font-size:9px;color:#aab3ad;font-weight:900;letter-spacing:.1em}.level{display:inline-block;background:var(--green);color:#071005;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:950}.blinds{font-size:22px;font-weight:950;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#060907;border:1px solid #223027;border-radius:12px;padding:11px}.v{font-size:18px;font-weight:950;margin-top:3px}.seat{border-color:#5b4b23;background:linear-gradient(180deg,#171308,#0d0b06)}.seat .v{color:var(--amber)}select{width:100%;padding:11px;border-radius:10px;background:#0c130f;color:#fff;border:1px solid #34463b;font-weight:900}.code{text-align:center;font-size:42px;font-weight:950;letter-spacing:.18em;padding:14px 4px;color:var(--green)}.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.purple{color:var(--purple)}.move{border-color:#315b83;background:#08111c}.move .v{color:var(--blue)}@media(max-width:420px){.clock{font-size:58px}.code{font-size:34px}}</style></head><body><main class="app"><div class="ey">POKER CLUB • PLAYER LIVE</div><div class="title" id="tournament"></div><div class="card"><div class="label">SELECIONE O PERFIL NESTE TORNEIO</div><select id="playerSelect"></select></div><div class="card timer"><div id="level" class="level"></div><div id="clock" class="clock"></div><div class="label">TEMPO RESTANTE DO NÍVEL</div><div id="blinds" class="blinds"></div><div id="next" class="label" style="margin-top:8px"></div></div><div class="grid"><div class="metric"><div class="label">PLAYERS LEFT</div><div id="left" class="v"></div></div><div class="metric"><div class="label">PRIZE POOL</div><div id="prize" class="v"></div></div><div class="metric"><div class="label">PRÓXIMO BREAK</div><div id="nextBreak" class="v"></div></div><div class="metric"><div class="label">TEMPO DECORRIDO</div><div id="elapsed" class="v"></div></div><div class="metric" id="bountyMetric" style="display:none"><div class="label">BOUNTY ATUAL</div><div id="bounty" class="v purple"></div></div></div><div class="card seat"><div class="label">POSIÇÃO ATUAL</div><div id="seatInfo" class="v"></div><div id="seatStatus" class="label" style="margin-top:8px"></div></div><div class="card move" id="moveCard" style="display:none"><div class="label">MOVIMENTAÇÃO DE MESA</div><div id="moveInfo" class="v"></div><div class="label" style="margin-top:8px">DIRIJA-SE À NOVA MESA E INFORME O CÓDIGO AO DEALER.</div></div><div class="card"><div class="label">CÓDIGO DE VALIDAÇÃO</div><div id="code" class="code"></div><div id="codeStatus" class="label" style="text-align:center"></div></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script src="validation.js"></script><script src="timer-engine.js"></script><script src="wallet-engine.js"></script><script src="player-profile-engine.js"></script><script>if(StackupAuth.guard('communication-hub.html')){(()=>{function livePlayers(){return currentTournamentPlayers()}function currentPlayer(){const list=livePlayers();return list.find(p=>p.id===playerSelect.value)||list[0]||null}function renderSelect(){const list=livePlayers(),current=playerSelect.value;playerSelect.innerHTML=list.length?list.map(p=>`<option value="${p.id}">${p.name}${p.nickname?' • '+p.nickname:''}</option>`).join(''):'<option value="">NENHUM JOGADOR NESTE TORNEIO</option>';if(current&&list.some(p=>p.id===current))playerSelect.value=current}function nextBreakFrom(remaining){let secs=Math.max(0,+remaining||0);for(let i=(+state.levelIndex||0)+1;i<(state.structure||[]).length;i++){const it=state.structure[i];if(it.type==='break')return{secs,label:it.label||'BREAK',index:i};secs+=Math.max(0,+it.duration||0)}return null}function render(){ValidationCodes.ensureValidationState();TournamentTimer.ensure();renderSelect();tournament.textContent=state.tournamentName||'TORNEIO';const s=TournamentTimer.displayed(),c=currentItem(),n=nextLevelItem(),p=currentPlayer(),profile=StackupPlayerProfile.tournamentProfile(p),nb=nextBreakFrom(s.remaining);clock.textContent=fmtTime(s.remaining);level.textContent=c.type==='break'?'BREAK':c.label;blinds.textContent=c.type==='level'?`SB ${fmtNumber(c.sb)} • BB ${fmtNumber(c.bb)} • ANTE ${fmtNumber(c.ante)}`:'INTERVALO';next.textContent=n&&n!==c?`PRÓXIMO: ${n.label} • SB ${fmtNumber(n.sb)} / BB ${fmtNumber(n.bb)} / ANTE ${fmtNumber(n.ante)}`:'';left.textContent=fmtNumber(state.playersLeft);prize.textContent=fmtCurrency(state.prizePool||0);nextBreak.textContent=nb?fmtTime(nb.secs):'-';elapsed.textContent=fmtTime(s.elapsed,true);if(!p){seatInfo.textContent='SEM JOGADOR';seatStatus.textContent='';code.textContent='------';codeStatus.textContent='';bountyMetric.style.display='none';moveCard.style.display='none';return}const bountyActive=['BOUNTY','PKO'].includes(state.tournamentFormat)&&(+state.bountyValue||0)>0;bountyMetric.style.display=bountyActive?'block':'none';bounty.textContent=bountyActive?fmtCurrency(+p.currentBounty||0):'';const seat=profile?.seat;seatInfo.textContent=p.status==='eliminated'?'ELIMINADO':`MESA ${seat?.table??p.table} • ASSENTO ${seat?.seat??p.seat}`;const currentCheck=StackupPlayerProfile.currentSeatCheckin(p),event=String(state.eventId||''),lastMove=(state.tableMovements||[]).find(m=>String(m.eventId||'')===event&&m.playerId===p.id&&['CONFIRMED_AT_DESTINATION','AWAITING_DESTINATION_CHECKIN','confirmed'].includes(m.status));seatStatus.textContent=p.status==='eliminated'?`PARTICIPAÇÃO ENCERRADA • ${p.finishPosition||'-'}º`:currentCheck?`✓ PRESENÇA CONFIRMADA • ${new Date(currentCheck.createdAt).toLocaleTimeString('pt-BR')}`:'AGUARDANDO CONFIRMAÇÃO DO DEALER';seatStatus.className='label '+(currentCheck?'ok':p.status==='eliminated'?'bad':'warn');if(lastMove&&p.status!=='eliminated'&&+lastMove.toTable===+p.table&&+lastMove.toSeat===+p.seat){moveCard.style.display='block';moveInfo.textContent=`MESA ${lastMove.fromTable} / ASSENTO ${lastMove.fromSeat} → MESA ${lastMove.toTable} / ASSENTO ${lastMove.toSeat}`}else moveCard.style.display='none';code.textContent=profile?.code||'------';const active=p.status!=='eliminated'&&p.validationCodeStatus!=='INACTIVE';code.className='code '+(active?'ok':'bad');codeStatus.textContent=active?'CÓDIGO ATIVO • INFORME AO DEALER PARA VALIDAR PRESENÇA OU MOVIMENTAÇÃO':'CÓDIGO INATIVO • PARTICIPAÇÃO ENCERRADA';codeStatus.className='label '+(active?'ok':'bad')}playerSelect.onchange=render;window.onPokerStateChange=render;window.addEventListener('storage',render);setInterval(render,500);ValidationCodes.ensureValidationState();TournamentTimer.ensure();render()})();}</script></body></html>

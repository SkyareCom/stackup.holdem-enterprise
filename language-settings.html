<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDIOMAS • STACKUP</title><link rel="stylesheet" href="app-theme.css"><link rel="stylesheet" href="typography-global.css"><style>body{margin:0;background:#020302;color:#fff;min-height:100vh}.wrap{width:min(980px,92vw);margin:0 auto;padding:24px 0}.ey{color:#8DFC3B;font-size:12px!important;letter-spacing:.08em}.title{font-size:20px!important;margin:5px 0 16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.lang{display:flex!important;align-items:center!important;justify-content:center!important;height:44px!important;min-height:44px!important;max-height:44px!important;padding:0 10px!important;border:1px solid #8DFC3B!important;border-radius:9px!important;background:linear-gradient(#0B100D,#060907)!important;color:#8DFC3B!important;box-sizing:border-box!important}.lang.active{background:#8DFC3B!important;color:#020302!important;border-color:#8DFC3B!important}.lang .label{font-size:12px!important;line-height:1!important;white-space:nowrap}.notice{margin-top:12px;color:#8DFC3B;font-size:12px!important;min-height:18px;text-align:center}@media(max-width:520px){.wrap{width:min(100%,calc(100vw - 24px));padding:18px 0}.grid{grid-template-columns:1fr}.lang{width:100%!important}}</style></head><body><main class="wrap"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><div class="title">IDIOMAS</div><div class="grid"><button class="lang" type="button" data-lang="pt"><span class="label">PORTUGUÊS</span></button><button class="lang" type="button" data-lang="en"><span class="label">ENGLISH</span></button><button class="lang" type="button" data-lang="es"><span class="label">ESPAÑOL</span></button></div><div id="notice" class="notice" role="status"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script src="app-language.js?v=9864a67"></script><script src="app-language-extra.js?v=2b08a68"></script><script src="app-language-final.js?v=9fbc2cd"></script><script src="app-language-spanish-clean-v1.js?v=c0f7a78"></script><script>if(StackupAuth.guard()){const applyButtons=()=>{const current=window.StackupAppLanguage?.get?.()||state.language||'pt';document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===current))};document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{const lang=b.dataset.lang;if(!window.StackupAppLanguage?.set(lang))return;notice.textContent=lang==='pt'?'IDIOMA DO APP: PORTUGUÊS':lang==='en'?'APP LANGUAGE: ENGLISH':'IDIOMA DE LA APLICACIÓN: ESPAÑOL';applyButtons()});window.addEventListener('stackup-language-change',applyButtons);applyButtons()}</script><script src="app-theme.js"></script></body></html>

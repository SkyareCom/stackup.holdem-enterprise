<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CONECTAR TELÃO</title><link href="https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#020302;color:#fff;font-family:'Caacupe One',sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(520px,100%);border:1px solid #31511f;border-radius:18px;padding:28px;background:#080b07}.brand{color:#8dfc3b;font-size:22px;text-align:center}.title{text-align:center;font-size:28px;margin:24px 0}.code{width:100%;background:#020302;border:1px solid #8dfc3b;color:#8dfc3b;border-radius:12px;padding:18px;text-align:center;font:inherit;font-size:38px;letter-spacing:8px}.btn{width:100%;margin-top:18px;padding:18px;border:0;border-radius:12px;background:#8dfc3b;color:#071006;font:inherit;font-size:22px}.status{text-align:center;margin-top:18px;min-height:28px;color:#8dfc3b}.note{text-align:center;opacity:.72;font-size:14px;margin-top:14px}</style></head><body><main class="card"><div class="brand">STACKUP HOLD'EM ENTERPRISE</div><div class="title">CONECTAR TELÃO</div><input class="code" id="code" inputmode="numeric" maxlength="6" placeholder="000000"><button class="btn" id="connect">CONECTAR</button><div class="status" id="status">INFORME O CÓDIGO EXIBIDO NA TV</div><div class="note">MANTENHA ESTA PÁGINA ABERTA DURANTE A TRANSMISSÃO.</div></main><script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script><script>const KEY='poker-club-state-v4',CHANNEL=KEY,$=id=>document.getElementById(id),code=$('code'),statusEl=$('status');code.value=new URLSearchParams(location.search).get('code')||'';let conn=null,peer=null,bc=null,last='';function state(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){return null}}function send(){const s=state();if(!conn?.open||!s)return;const raw=JSON.stringify(s);if(raw===last)return;last=raw;conn.send({type:'state',state:s})}function start(){const c=code.value.replace(/\D/g,'').slice(0,6);code.value=c;if(c.length!==6){statusEl.textContent='CÓDIGO INVÁLIDO';return}statusEl.textContent='CONECTANDO...';peer?.destroy();peer=new Peer();peer.on('open',()=>{conn=peer.connect('stackup-tv-'+c,{reliable:true});conn.on('open',()=>{statusEl.textContent='TELÃO CONECTADO';send();if('BroadcastChannel'in window){bc?.close();bc=new BroadcastChannel(CHANNEL);bc.onmessage=()=>{last='';send()}}window.addEventListener('storage',()=>{last='';send()});setInterval(()=>{last='';send()},500)});conn.on('close',()=>statusEl.textContent='CONEXÃO ENCERRADA');conn.on('error',()=>statusEl.textContent='ERRO NA CONEXÃO')});peer.on('error',()=>statusEl.textContent='NÃO FOI POSSÍVEL CONECTAR — TENTE NOVAMENTE')}$('connect').onclick=start;if(code.value.length===6)setTimeout(start,300);</script><script src="app-language.js"></script><script src="app-language-extra.js"></script><script src="app-language-final.js"></script><script src="app-language-qa.js"></script></body></html>

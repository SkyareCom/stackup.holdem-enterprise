<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>AMBIENTES CADASTRADOS • STACKUP</title><style>@import url('https://fonts.googleapis.com/css2?family=Caacupe+One:wght@400&display=swap');:root{--bg:#020302;--green:#8DFC3B;--border:#27342D;--top:#0B100D;--bottom:#060907;--muted:#AEB8B1}*{box-sizing:border-box}html,body{width:100%;margin:0;background:var(--bg);color:#fff}body,body *,button,input,select,option{font-family:'Caacupe One',system-ui,sans-serif!important;font-weight:400!important;letter-spacing:1px!important;text-transform:uppercase}.app{display:block;width:100%;max-width:980px;margin:0 auto;padding:24px 18px}.ey{color:var(--green);font-size:12px}.title{font-size:20px;margin:5px 0 18px}.activeSection{display:block;width:100%;padding:14px 0;margin-bottom:18px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.activeLabel{color:var(--green);font-size:12px}.activeName{margin-top:6px;font-size:18px}#environmentList{display:flex;flex-direction:column;align-items:stretch;width:100%;gap:8px}.listRow{display:block;width:100%;padding:0 12px;border:1px solid var(--border);border-radius:9px;background:linear-gradient(var(--top),var(--bottom))}.stackup-compact-name{display:block;width:100%;padding:13px 4px;cursor:pointer;color:#fff;font-weight:600;line-height:1.25;outline:none}.stackup-compact-name:focus-visible{outline:1px solid var(--green);outline-offset:2px;border-radius:6px}.stackup-compact-row.stackup-expanded .stackup-compact-name{color:var(--green);padding-bottom:8px}.stackup-details{display:none;padding:0 0 12px}.stackup-expanded .stackup-details{display:block}.meta{color:var(--muted);font-size:12px;line-height:1.45}.selectedMeta{color:var(--green);margin-top:5px}.stackup-row-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.stackup-row-actions button{width:100%;min-height:44px;padding:10px 12px;background:var(--bottom);color:var(--green);border:1px solid var(--green);border-radius:9px;font-size:12px}.stackup-row-actions .stackup-delete{color:#ff858d;border-color:#ff858d}.empty{color:var(--muted);padding:12px 0}.emptyAction{display:block;width:100%;min-height:44px;margin-top:8px;padding:12px;text-align:center;text-decoration:none;border:1px solid var(--green);border-radius:9px;color:var(--green);background:var(--bottom)}@media(max-width:700px){.app{max-width:none;padding:18px 12px}.stackup-row-actions{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><div class="title">AMBIENTES CADASTRADOS</div><section class="activeSection"><div class="activeLabel">AMBIENTE SELECIONADO</div><div class="activeName" id="activeEnvironmentName">NENHUM AMBIENTE FIXADO</div></section><button id="selectMode" type="button" hidden aria-hidden="true">SELECIONAR</button><div id="environmentList"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script src="inline-interactions-v1.js"></script><script>if(StackupAuth.guard()){ensureOperationalState();StackupAuth.ensure();const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m])),typeLabel=t=>t==='HOME_GAME'?'HOME GAME':t==='LEAGUE'?'LIGA':'CLUBE';let opened='';const activeClub=()=> (state.authClubs||[]).find(c=>c.active!==false&&String(c.id)===String(state.activeEnvironmentId||''));function updateActiveHeader(){const active=activeClub();activeEnvironmentName.textContent=active?.name||state.activeEnvironmentName||'NENHUM AMBIENTE FIXADO'}function render(){const arr=(state.authClubs||[]).filter(c=>c.active!==false);updateActiveHeader();environmentList.innerHTML=arr.length?arr.map(c=>{const active=String(c.id)===String(state.activeEnvironmentId||''),expanded=String(c.id)===String(opened);return `<div class="listRow stackup-compact-row${expanded?' stackup-expanded':''}" data-stackup-compact="1" data-environment-row="${esc(c.id)}"><b class="stackup-compact-name" role="button" tabindex="0" aria-expanded="${expanded?'true':'false'}">${esc(c.name)}</b><div class="stackup-details"><div class="meta">${typeLabel(c.type)}</div>${active?'<div class="meta selectedMeta">FIXADO PARA USO NOS CADASTROS</div>':''}<div class="stackup-row-actions stackup-environment-actions"><button type="button" data-stackup-fix="${esc(c.id)}">${active?'FIXADO':'FIXAR'}</button><button type="button" data-stackup-edit="${esc(c.id)}">EDITAR</button><button type="button" class="stackup-delete" data-stackup-delete="${esc(c.id)}">APAGAR</button></div></div></div>`}).join(''):'<div class="empty">NENHUM AMBIENTE CADASTRADO.<a class="emptyAction" href="environment-register.html">CADASTRAR AMBIENTE</a></div>';bindRows()}function toggle(row){const id=row.dataset.environmentRow;opened=String(opened)===String(id)?'':id;render()}function fix(id,row){const club=(state.authClubs||[]).find(c=>c.active!==false&&String(c.id)===String(id));if(!club)return;state.activeEnvironmentId=club.id;state.activeEnvironmentName=club.name;state.activeEnvironmentType=club.type;state.clubId=club.id;state.clubName=club.name;try{localStorage.setItem('stackup-active-environment-v1',String(club.id))}catch(_){ }saveState();opened=id;render();window.StackupInlineFeedback?.show?.(`${club.name} FIXADO PARA USO NOS CADASTROS.`,{error:false,trigger:document.querySelector(`[data-environment-row="${CSS.escape(String(id))}"]`)})}function remove(id,trigger){const club=(state.authClubs||[]).find(c=>c.active!==false&&String(c.id)===String(id));if(!club)return;const linked=(state.authMemberships||[]).filter(m=>m.active!==false&&String(m.clubId)===String(id)).length,message=linked?`APAGAR ${club.name}? ${linked} VÍNCULO(S) DE STAFF SERÃO DESATIVADOS.`:`APAGAR ${club.name}?`;window.StackupInlineFeedback.mount(trigger,{message,confirmLabel:'CONFIRMAR',cancelLabel:'CANCELAR',onConfirm:()=>{club.active=false;club.deletedAt=Date.now();(state.authMemberships||[]).forEach(m=>{if(String(m.clubId)===String(id))m.active=false});let pinnedId='';try{pinnedId=localStorage.getItem('stackup-active-environment-v1')||''}catch(_){ }if(String(state.activeEnvironmentId||'')===String(id)||String(state.clubId||'')===String(id)||String(pinnedId)===String(id)){state.activeEnvironmentId='';state.activeEnvironmentName='';state.activeEnvironmentType='';if(String(state.clubId||'')===String(id))state.clubId='';if(String(state.clubName||'')===String(club.name))state.clubName='';try{localStorage.removeItem('stackup-active-environment-v1')}catch(_){ }}saveState();opened='';render()},onCancel:()=>{}})}function bindRows(){document.querySelectorAll('[data-environment-row]').forEach(row=>{const name=row.querySelector('.stackup-compact-name');name.onclick=()=>toggle(row);name.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(row)}};row.querySelector('[data-stackup-fix]')?.addEventListener('click',e=>{e.stopPropagation();fix(row.dataset.environmentRow,row)});row.querySelector('[data-stackup-edit]')?.addEventListener('click',e=>{e.stopPropagation();location.href=`environment-register.html?edit=${encodeURIComponent(row.dataset.environmentRow)}`});row.querySelector('[data-stackup-delete]')?.addEventListener('click',e=>{e.stopPropagation();remove(row.dataset.environmentRow,e.currentTarget)})})}selectMode.onclick=()=>{if(!(state.authClubs||[]).some(c=>c.active!==false)){location.href='environment-register.html';return}opened='';render()};render()}</script><script src="app-theme.js"></script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JOGADORES • STACKUP</title><link rel="stylesheet" href="app-theme.css?v=ad060218"><style>.app{max-width:760px;margin:auto;padding:18px}.list{display:grid;gap:8px}.row{padding:10px 0;border-bottom:1px solid #27342D}.row:last-child{border-bottom:0}.name{font-weight:600;color:#fff}.meta{color:#AEB8B1;line-height:1.5}.status{color:#8DFC3B}.checkinCode{color:#fff;font-weight:600}.empty{color:#AEB8B1;padding:4px 2px}.directorySearch{width:100%;min-height:44px;margin:0 0 10px;padding:10px 12px;border:1px solid #27342D;border-radius:9px;background:linear-gradient(#0B100D,#060907);color:#fff}.directoryPick{width:100%;min-height:54px;padding:10px 12px;border:1px solid #27342D;border-radius:9px;background:linear-gradient(#0B100D,#060907);color:#fff;text-align:left;display:block}.directoryPick .name{color:#fff}.directoryPick .meta{margin-top:3px}.hidden{display:none!important}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><div class="title" id="pageTitle">JOGADORES NO TORNEIO</div><div class="section" id="sectionTitle">ATIVOS COM CHECK-IN CONFIRMADO</div><input id="searchDirectory" class="directorySearch hidden" type="search" placeholder="PROCURAR JOGADOR CADASTRADO"><div id="list" class="list"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script src="operations.js"></script><script src="player-profile-engine.js"></script><script>const DIRECTORY_KEY='stackup-player-directory-v1',SELECTED_KEY='stackup-checkin-selected-player',params=new URLSearchParams(location.search),returnTo=['checkin.html','pre-registration.html'].includes(params.get('return'))?params.get('return'):'';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function directory(){try{const arr=JSON.parse(localStorage.getItem(DIRECTORY_KEY)||'[]');return Array.isArray(arr)?arr:[]}catch(_){return[]}}function playersInTournament(){return(state.players||[]).filter(p=>p.status==='active'&&!!p.seatedAt).sort((a,b)=>{const sa=StackupPlayerProfile.latestSeatForPlayer(a),sb=StackupPlayerProfile.latestSeatForPlayer(b);return(+sa?.table-+sb?.table)||(+sa?.seat-+sb?.seat)||String(a.name||'').localeCompare(String(b.name||''),'pt-BR')})}function selectDirectoryPlayer(id){const p=directory().find(x=>String(x.id)===String(id));if(!p)return;localStorage.setItem(SELECTED_KEY,p.id);location.href=returnTo}function renderDirectory(){const q=String(searchDirectory.value||'').trim().toLocaleLowerCase('pt-BR'),activeEnvironment=String(state.activeEnvironmentId||'');const arr=directory().filter(p=>{if(!q)return true;return[p.name,p.cpf,p.phone,p.whatsapp,p.email].some(v=>String(v||'').toLocaleLowerCase('pt-BR').includes(q))}).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'pt-BR'));list.innerHTML=arr.length?arr.map(p=>`<button class="directoryPick" type="button" data-directory-id="${esc(p.id)}"><span class="name">${esc(p.name||'SEM NOME')}</span><span class="meta">CPF ${esc(p.cpf||'-')} • TEL ${esc(p.phone||p.whatsapp||'-')}${p.environmentName?` • ${esc(p.environmentName)}`:''}</span></button>`).join(''):'<div class="empty">NENHUM JOGADOR CADASTRADO ENCONTRADO.</div>';list.querySelectorAll('[data-directory-id]').forEach(b=>b.onclick=()=>selectDirectoryPlayer(b.dataset.directoryId))}function renderTournament(){const arr=playersInTournament();list.innerHTML=arr.length?arr.map(p=>{const profile=StackupPlayerProfile.tournamentProfile(p),seat=profile?.seat,level=p.checkinLevelLabel||p.checkinLevel||'-',code=profile?.code||'-';return `<div class="row"><div class="name">${esc(profile?.identity?.name||p.name||'SEM NOME')}</div><div class="meta"><span class="status">ATIVO</span> • ${seat&&seat.status==='SEATED'?'SEATED':'AGUARDANDO NOVO ASSENTO'} • MESA ${esc(seat?.table??'-')} • ASSENTO ${esc(seat?.seat??'-')} • CHECK-IN ${esc(level)} • CÓDIGO <span class="checkinCode">${esc(code)}</span></div></div>`}).join(''):'<div class="empty">NENHUM JOGADOR COM BUY-IN E CHECK-IN CONFIRMADOS.</div>'}function render(){if(returnTo){pageTitle.textContent='SELECIONAR JOGADOR';sectionTitle.textContent='CADASTRO GERAL DE JOGADORES';searchDirectory.classList.remove('hidden');renderDirectory()}else{pageTitle.textContent='JOGADORES NO TORNEIO';sectionTitle.textContent='ATIVOS COM CHECK-IN CONFIRMADO';searchDirectory.classList.add('hidden');renderTournament()}}searchDirectory.oninput=render;window.onPokerStateChange=render;window.addEventListener('storage',render);window.addEventListener('stackup-wallet-change',render);render();</script></body></html>
